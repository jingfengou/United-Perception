num_classes: &num_classes 81
runtime:
  task_names: det
  aligned: true

resize: &resize
  type: keep_ar_resize_max
  kwargs:
    max_size: 800

to_tensor: &to_tensor
  type: custom_to_tensor
  kwargs:
    norm_image: true

normalize: &normalize
  type: normalize
  kwargs:
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]

dataset:
  train:
    dataset:
      type: coco
      kwargs:
        meta_file: coco/annotations/instances_train2017.json
        image_reader:
          type: fs_opencv
          kwargs:
            image_dir: coco/train2017
            color_mode: RGB
        transformer: [*resize, *to_tensor, *normalize]
    batch_sampler:
      type: base
      kwargs:
        sampler: {type: dist, kwargs: {}}
        batch_size: 2
  test:
    dataset:
      type: coco
      kwargs:
        meta_file: coco/annotations/instances_val2017.json
        image_reader:
          type: fs_opencv
          kwargs:
            image_dir: coco/val2017
            color_mode: RGB
        transformer: [*resize, *to_tensor, *normalize]
        evaluator:
          type: COCO
          kwargs:
            gt_file: coco/annotations/instances_val2017.json
            iou_types: [bbox]
    batch_sampler:
      type: base
      kwargs:
        sampler: {type: dist_test, kwargs: {}}
        batch_size: 2
  dataloader:
    type: base
    kwargs:
      num_workers: 4
      alignment: 32
      pad_type: batch_pad

trainer:
  max_epoch: 300
  save_freq: 5
  test_freq: 5
  optimizer:
    type: AdamW
    special_param_group:
    - {key: backbone, lr: 0.00001}
    kwargs:
      lr: 0.0001
      weight_decay: 0.0001
  lr_scheduler:
    warmup_iter: 0
    type: MultiStepLR
    kwargs:
      milestones: [200]
      gamma: 0.1

saver:
  save_dir: checkpoints/detr_r50
  results_dir: results_dir/detr_r50
  auto_resume: true

hooks:
- type: auto_save_best
- type: grad_clipper
  kwargs:
    mode: pre_defined
    max_norm: 0.1

net:
- name: detector
  type: detr
  kwargs:
    num_classes: *num_classes
    num_queries: 100
    aux_loss: true
