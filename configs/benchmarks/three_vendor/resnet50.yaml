# Confirmed 3-vendor experiment. Override runtime.platform and data/output paths per host.
num_classes: 1000
runtime:
  task_names: cls
  platform: nvidia
  fp16: true
  random_seed: 131
  expected_world_size: 4
  dnn:
    benchmark: true
    deterministic: false
    allow_tf32: false
random_resized_crop: &id001
  type: torch_random_resized_crop
  kwargs:
    size: 224
    scale:
    - 0.08
    - 1
random_horizontal_flip: &id002
  type: torch_random_horizontal_flip
pil_color_jitter: &id003
  type: torch_color_jitter
  kwargs:
    brightness: 0.2
    contrast: 0.2
    saturation: 0.2
    hue: 0.1
center_crop: &id007
  type: torch_center_crop
  kwargs:
    size: 224
torch_size: &id006
  type: torch_resize
  kwargs:
    size: 256
to_tensor: &id004
  type: to_tensor
normalize: &id005
  type: normalize
  kwargs:
    mean:
    - 0.485
    - 0.456
    - 0.406
    std:
    - 0.229
    - 0.224
    - 0.225
dataset:
  train:
    dataset:
      type: cls
      kwargs:
        meta_file: images/meta/train.txt
        image_reader:
          type: fs_pillow
          kwargs:
            image_dir: images/train
            color_mode: RGB
        transformer:
        - *id001
        - *id002
        - *id003
        - *id004
        - *id005
    batch_sampler:
      type: base
      kwargs:
        sampler:
          type: dist
          kwargs: {}
        batch_size: 256
    dataloader:
      type: cls_base
      kwargs:
        num_workers: 4
        pin_memory: true
  test:
    dataset:
      type: cls
      kwargs:
        meta_file: images/meta/val.txt
        image_reader:
          type: fs_pillow
          kwargs:
            image_dir: images/val
            color_mode: RGB
        transformer:
        - *id006
        - *id007
        - *id004
        - *id005
        evaluator:
          type: imagenet
          kwargs:
            topk:
            - 1
            - 5
    batch_sampler:
      type: base
      kwargs:
        sampler:
          type: dist
          kwargs: {}
        batch_size: 256
    dataloader:
      type: cls_base
      kwargs:
        num_workers: 4
        pin_memory: false
trainer:
  max_epoch: 100
  test_freq: 1
  save_freq: 1
  only_save_latest: true
  optimizer:
    type: SGD
    kwargs:
      lr: 0.4
      nesterov: true
      momentum: 0.9
      weight_decay: 0.0001
  lr_scheduler:
    warmup_iter: 2500
    warmup_type: linear
    warmup_register_type: no_scale_lr
    warmup_ratio: 0.25
    type: MultiStepLR
    kwargs:
      milestones:
      - 30
      - 60
      - 90
      gamma: 0.1
saver:
  save_dir: outputs/resnet50/checkpoints
  results_dir: outputs/resnet50/results
  auto_resume: false
hooks:
- type: auto_save_best
net:
- name: backbone
  type: resnet50
  kwargs:
    frozen_layers: []
    out_layers:
    - 4
    out_strides:
    - 32
    normalize:
      type: solo_bn
    initializer:
      method: msra
- name: head
  type: base_cls_head
  kwargs:
    num_classes: 1000
    in_plane: 2048
    input_feature_idx: -1
- name: post_process
  type: base_cls_postprocess
  kwargs:
    cls_loss:
      type: label_smooth_ce
      kwargs:
        smooth_ratio: 0.1
        num_classes: 1000
export:
  input_size:
  - 3
  - 224
  - 224
  opset: 17
