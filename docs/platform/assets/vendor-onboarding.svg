<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1300" viewBox="0 0 1080 1300" role="img" aria-labelledby="title desc">
  <title id="title">新增厂商的接口实现与接入路径</title>
  <desc id="desc">先确认厂商PyTorch或设备桥接，分别交付设备、算子与用途实现，再注册配置并验收。</desc>
  <style>
svg{--bg:#ffffff;--ink:#17243d;--muted:#53617b;--line:#cbd5e3;--surface:#f5f8fc;--accent:#2548c7;--soft:#edf2ff;--warn:#815000;--warnbg:#fff5df;font-family:"Microsoft YaHei","Noto Sans CJK SC",Arial,sans-serif}
@media(prefers-color-scheme:dark){svg{--bg:#111827;--ink:#edf3ff;--muted:#b8c7dc;--line:#41516b;--surface:#1c293d;--accent:#a4bbff;--soft:#243654;--warn:#ffda91;--warnbg:#382d1a}}
text{fill:var(--ink);font-weight:400} .muted{fill:var(--muted)} .accent{fill:var(--accent)} .warn{fill:var(--warn)}
</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="var(--muted)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" />
    </marker>
  </defs>
  <rect x="0" y="0" width="1080" height="1300" rx="0" fill="var(--bg)" stroke="none" stroke-width="1.25" />
  <text x="40" y="58" font-size="32" style="font-weight:500">新增厂商：接口实现与接入路径</text>
  <text x="40" y="90" font-size="20" style="font-weight:400" class="muted">兼容能力显式复用，只写差异；未实现能力明确报错</text>
  <text x="40" y="130" font-size="23" style="font-weight:500" class="accent">01  确认运行时前提</text>
  <rect x="40" y="148" width="488" height="110" rx="14" fill="var(--soft)" stroke="none" stroke-width="1.25" />
  <rect x="552" y="148" width="488" height="110" rx="14" fill="var(--soft)" stroke="none" stroke-width="1.25" />
  <text x="64" y="183" font-size="22" style="font-weight:500">已有厂商 PyTorch 设备适配</text>
  <text x="64" y="216" font-size="20" style="font-weight:400">兼容接口复用公共 Torch 实现</text>
  <text x="64" y="246" font-size="19" style="font-weight:400">缺失算子再用 SDK / 内核补齐</text>
  <text x="576" y="183" font-size="22" style="font-weight:500">没有 PyTorch 设备后端</text>
  <text x="576" y="216" font-size="19" style="font-weight:400">先补设备、张量存储、派发与 autograd</text>
  <text x="576" y="246" font-size="19" style="font-weight:400">完成桥接后，再接入以下平台接口</text>
  <path d="M 284 258 L 284 280 L 796 280 L 796 258 M 540 280 L 540 330" fill="none" stroke="var(--muted)" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" />
  <text x="40" y="313" font-size="23" style="font-weight:500" class="accent">02  实现同一份接口契约</text>
  <path d="M 196 330 L 884 330" fill="none" stroke="var(--muted)" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" />
  <path d="M 196 330 L 196 346" fill="none" stroke="var(--muted)" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)" />
  <path d="M 540 330 L 540 346" fill="none" stroke="var(--muted)" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)" />
  <path d="M 884 330 L 884 346" fill="none" stroke="var(--muted)" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)" />
  <rect x="40" y="352" width="312" height="268" rx="14" fill="var(--surface)" stroke="var(--line)" stroke-width="1.25" />
  <rect x="384" y="352" width="312" height="268" rx="14" fill="var(--surface)" stroke="var(--line)" stroke-width="1.25" />
  <rect x="728" y="352" width="312" height="268" rx="14" fill="var(--surface)" stroke="var(--line)" stroke-width="1.25" />
  <text x="60" y="391" font-size="23" style="font-weight:500">设备 · 18 项</text>
  <text x="60" y="429" font-size="20" style="font-weight:400" class="accent">device.py</text>
  <text x="60" y="473" font-size="19" style="font-weight:400">SDK 导入与身份/版本校验</text>
  <text x="60" y="505" font-size="19" style="font-weight:400">继承或实现 DeviceBackend</text>
  <text x="60" y="537" font-size="19" style="font-weight:400">迁移 / 同步 / RNG / 显存</text>
  <text x="60" y="569" font-size="19" style="font-weight:400">覆盖不兼容 API 与卷积开关</text>
  <text x="404" y="391" font-size="22" style="font-weight:500">算子 / 功能 · 129 项</text>
  <text x="404" y="429" font-size="20" style="font-weight:400" class="accent">ops/&lt;类别&gt;.py</text>
  <text x="404" y="473" font-size="18" style="font-weight:400">继承类别父类，逐项显式绑定</text>
  <text x="404" y="505" font-size="18" style="font-weight:400">兼容操作 → torch_impl</text>
  <text x="404" y="537" font-size="18" style="font-weight:400">缺失操作 → SDK / 自写内核</text>
  <text x="404" y="569" font-size="18" style="font-weight:400">训练提供所需反向和状态</text>
  <text x="404" y="601" font-size="18" style="font-weight:400">保持 dtype / 布局 / 边界契约</text>
  <text x="748" y="391" font-size="22" style="font-weight:500">用途适配 · 7 + 2 项</text>
  <text x="748" y="429" font-size="19" style="font-weight:400" class="accent">training.py / inference.py</text>
  <text x="748" y="473" font-size="18" style="font-weight:400">分别复用或覆盖对应实现</text>
  <text x="748" y="505" font-size="18" style="font-weight:400">可先只支持一种用途</text>
  <text x="748" y="537" font-size="18" style="font-weight:400">另一用途必须明确拒绝</text>
  <text x="748" y="569" font-size="18" style="font-weight:400">训练内 eval 仍走 training</text>
  <text x="748" y="601" font-size="18" style="font-weight:400">缺 SDK / 能力必须明确报错</text>
  <text x="40" y="653" font-size="19" style="font-weight:400" class="muted">已隔离主流程只增加后端与注册；复用公共能力，模型算法与配方保持不变。</text>
  <text x="40" y="700" font-size="23" style="font-weight:500" class="accent">03  装配并注册后端</text>
  <rect x="40" y="720" width="1000" height="154" rx="14" fill="var(--soft)" stroke="none" stroke-width="1.25" />
  <text x="64" y="756" font-size="22" style="font-weight:500">__init__.py：build(config, purpose)</text>
  <text x="64" y="792" font-size="21" style="font-weight:400">PlatformBackend(device, purpose, operations, execution)</text>
  <text x="64" y="828" font-size="21" style="font-weight:400" class="accent">register_backend("acme", build)</text>
  <text x="64" y="858" font-size="19" style="font-weight:400">装配当前厂商的 device / ops / execution，只加载当前用途实现。</text>
  <path d="M 540 874 L 540 906" fill="none" stroke="var(--muted)" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)" />
  <text x="40" y="945" font-size="23" style="font-weight:500" class="accent">04  配置使用，并完成契约与真机验收</text>
  <rect x="40" y="966" width="1000" height="162" rx="14" fill="var(--surface)" stroke="var(--line)" stroke-width="1.25" />
  <text x="64" y="1001" font-size="19" style="font-weight:400">backend: acme    device: privateuseone    plugins: [acme_torch_platform]</text>
  <text x="64" y="1037" font-size="20" style="font-weight:400">purpose 由入口指定：training（含训练内 eval）或 inference</text>
  <text x="64" y="1073" font-size="19" style="font-weight:400">路由/缺失能力 → 算子前向、梯度与状态 → 训练、eval、恢复、独立推理</text>
  <text x="64" y="1107" font-size="19" style="font-weight:400">CPU 契约通过仍需真机；不静默 CPU 代算、不放宽原容差。</text>
  <rect x="40" y="1164" width="1000" height="86" rx="14" fill="var(--warnbg)" stroke="none" stroke-width="1.25" />
  <text x="64" y="1197" font-size="22" style="font-weight:500" class="warn">当前边界限制</text>
  <text x="64" y="1230" font-size="19" style="font-weight:400" class="warn">主流程可按契约接入；11 处旧 linklink 分支仍需平台公共边界收尾。</text>
  <text x="40" y="1280" font-size="17" style="font-weight:400" class="muted">模板 ≠ 完整硬件支持；昇腾 / 寒武纪当前仅模板，未启用。</text>
</svg>
