s_list)\n                begin_index = 0\n                for group_idx in range(group):\n                    num_result = len(range(group_idx, results_size, group))\n                    group_result = all_results_list[begin_index:begin_index + num_result]\n                    begin_index += num_result","limited":true,"property":false},"up/runner/base_runner.py::BaseRunner.forward_eval":{"id":"up/runner/base_runner.py::BaseRunner.forward_eval","name":"BaseRunner.forward_eval","path":"up/runner/base_runner.py","line":587,"end":592,"meaning":"触发验证前后回调，调用 forward_model() 得到预测。","kind":"compute","hardware":"不会进入训练 forward() 的 AMP 上下文。","url":"https://github.com/ModelTC/United-Perception/blob/52aaeb9ed27a490820696d7754d19f98cd6ecd11/up/runner/base_runner.py#L587","code":"    def forward_eval(self, batch):\n        self._hooks('before_eval_forward', self.local_eval_iter(), batch)\n        assert not self.model.training\n        output = self.forward_model(batch)\n        self._hooks('after_eval_forward', self.local_eval_iter(), output)\n        return output","limited":false,"property":false},"up/runner/base_runner.py::BaseRunner._prepare_writer":{"id":"up/runner/base_runner.py::BaseRunner._prepare_writer","name":"BaseRunner._prepare_writer","path":"up/runner/base_runner.py","line":452,"end":459,"meaning":"为当前 rank 创建结果文件，或接着已有结果继续写。","kind":"cpu","hardware":"只在按文件存验证结果时使用。","url":"https://github.com/ModelTC/United-Perception/blob/52aaeb9ed27a490820696d7754d19f98cd6ecd11/up/runner/base_runner.py#L452","code":"    def _prepare_writer(self, resume=False):\n        os.makedirs(self.results_dir, exist_ok=True)\n        res_file = os.path.join(self.results_dir, f'results.txt.rank{env.rank}')\n        if not resume or not os.path.exists(res_file):\n            writer = open(res_file, 'w')\n        else:\n            writer = open(res_file, 'a')\n        return writer","limited":false,"property":false},"up/runner/base_runner.py::BaseRunner._results2disk":{"id":"up/runner/base_runner.py::BaseRunner._results2disk","name":"BaseRunner._results2disk","path":"up/runner/base_runner.py","line":461,"end":464,"meaning":"把一批已整理好的预测按 JSON 行写入结果文件。","kind":"cpu","hardware":"磁盘写入。","url":"https://github.com/ModelTC/United-Perception/blob/52aaeb9ed27a490820696d7754d19f98cd6ecd11/up/runner/base_runner.py#L461","code":"    def _results2disk(self, dump_results, writer):\n        for results in dump_results:\n            writer.write(json.dumps(results, ensure_ascii=False) + '\\n')\n        writer.flush()","limited":false,"property":false},"up/runner/base_runner.py::BaseRunner.merge_results":{"id":"up/runner/base_runner.py::BaseRunner.merge_results","name":"BaseRunner.merge_results","path":"up/runner/base_runner.py","line":434,"end":450,"meaning":"把各个 rank 的预测文件合并为一个总结果文件。","kind":"cpu","hardware":"文件合并。","url":"https://github.com/ModelTC/United-Perception/blob/52aaeb9ed27a490820696d7754d19f98cd6ecd11/up/runner/base_runner.py#L434","code":"    def merge_results(self):\n        prefix = os.path.join(self.results_dir, 'results.txt.rank')\n        world_size = env.world_size\n        merged_file = os.path.join(self.results_dir, 'results.txt')\n        logger.info(f'concat all results into:{merged_file}')\n        merged_fd = open(merged_file, 'w')\n        for rank in range(world_size):\n            res_file = prefix + str(rank)\n            assert os.path.exists(res_file), f'No such file or directory: {res_file}'\n            with open(res_file, 'r') as fin:\n                for line_idx, line in enumerate(fin):\n                    merged_fd.write(line)\n            logger.info(f'merging {res_file} {line_idx+1} results')\n        merged_fd.close()\n        with open(os.path.join(self.results_dir, 'inference_process.log'), 'w') as f:\n            f.write('[Done] writing all results to {} done. \\n'.format(merged_file))\n        return merged_file","limited":false,"property":false},"up/tasks/det/data/datasets/coco_dataset.py::CocoDataset.dump":{"id":"up/tasks/det/data/datasets/coco_dataset.py::CocoDataset.dump","name":"CocoDataset.dump","path":"up/tasks/det/data/datasets/coco_dataset.py","line":365,"end":446,"meaning":"把检测框从缩放后的坐标还原到原图，转换成评估器需要的预测记录。","kind":"mixed","hardware":"含 Tensor 到 CPU/NumPy 的结果传输；后续主要是格式整理。","url":"https://github.com/ModelTC/United-Perception/blob/52aaeb9ed27a490820696d7754d19f98cd6ecd11/up/tasks/det/data/datasets/coco_dataset.py#L365","code":"    def dump(self, output):\n        \"\"\"\n        Write predicted results into files.\n\n        .. note::\n\n            Masks are binaried by threshold 0.5 and converted to rle string\n\n        Arguments:\n            - writer: output stream to write results\n            - image_info (FloatTensor): [B, 5] (resized_h, resized_w, scale_factor, origin_h, origin_w)\n            - bboxes (FloatTensor): [N, 7] (batch_idx, x1, y1, x2, y2, score, cls)\n            - keypoints (FloatTensor): [N, K, 3], (x, y, score)\n            - masks (list FloatTensor): [N, h, w]\n        \"\"\"\n        # filenames = output['filenames']\n        # image_info = self.tensor2numpy(output['image_info'])\n        image_info = output['image_info']\n        bboxes = self.tensor2numpy(output['dt_bboxes'])\n        keypoints = self.tensor2numpy(output.get('dt_keyps', None))\n        masks = self.tensor2numpy(output.get('dt_masks', None))\n        image_ids = output['image_id']\n        if len(bboxes) == 0:\n            return\n\n        dump_results = []\n        for b_ix in range(len(image_info)):\n            info = image_info[b_ix]\n            img_h, img_w = map(int, info[3: 5])\n            img_id = image_ids[b_ix]\n\n            scores = bboxes[:, 5]","limited":true,"property":false},"up/data/datasets/base_dataset.py::BaseDataset.evaluate":{"id":"up/data/datasets/base_dataset.py::BaseDataset.evaluate","name":"BaseDataset.evaluate","path":"up/data/datasets/base_dataset.py","line":124,"end":130,"meaning":"把结果文件或内存结果交给配置中的 evaluator.eval()。","kind":"cpu","hardware":"数据集评估入口。","url":"https://github.com/ModelTC/United-Perception/blob/52aaeb9ed27a490820696d7754d19f98cd6ecd11/up/data/datasets/base_dataset.py#L124","code":"    def evaluate(self, res_file, res=None):\n        \"\"\"\n        Arguments:\n            - res_file (:obj:`str`): filename\n        \"\"\"\n        metrics = self.evaluator.eval(res_file, res) if self.evaluator else {}\n        return metrics","limited":false,"property":false},"up/tasks/det/data/metrics/coco_evaluator.py::CocoEvaluator.load_dts":{"id":"up/tasks/det/data/metrics/coco_evaluator.py::CocoEvaluator.load_dts","name":"CocoEvaluator.load_dts","path":"up/tasks/det/data/metrics/coco_evaluator.py","line":85,"end":95,"meaning":"读入预测结果，整理为 COCO 评估需要的检测记录。","kind":"cpu","hardware":"预测格式转换。","url":"https://github.com/ModelTC/United-Perception/blob/52aaeb9ed27a490820696d7754d19f98cd6ecd11/up/tasks/det/data/metrics/coco_evaluator.py#L85","code":"    def load_dts(self, res_file, res):\n        out = []\n        if res is not None:\n            for device_res in res:\n                for lines in device_res:\n                    for line in lines:\n                        out.append(line)\n        else:\n            logger.info(f'loading res from {res_file}')\n            out = [json.loads(line) for line in open(res_file, 'r')]\n        return out","limited":false,"property":false},"up/tasks/det/data/metrics/coco_evaluator.py::CocoEvaluator.eval":{"id":"up/tasks/det/data/metrics/coco_evaluator.py::CocoEvaluator.eval","name":"CocoEvaluator.eval","path":"up/tasks/det/data/metrics/coco_evaluator.py","line":97,"end":141,"meaning":"用真实标注和预测运行 COCOeval，返回 AP、AP50、AP75 等指标。","kind":"cpu","hardware":"COCO 指标统计；模型前向已经在前面完成。","url":"https://github.com/ModelTC/United-Perception/blob/52aaeb9ed27a490820696d7754d19f98cd6ecd11/up/tasks/det/data/metrics/coco_evaluator.py#L97","code":"    def eval(self, res_file, res=None):\n        \"\"\"This should return a dict with keys of metric names, values of metric values\"\"\"\n        # if not self.gt_loaded:\n        #     self.gts = COCO(self.gt_file)\n        #     self.gt_loaded = True\n        self.gts = COCO(self.gt_file)\n        dts = self.load_dts(res_file, res)\n        dts = self.gts.loadRes(dts)\n\n        metrics = Metric({})\n        for itype, class_agnostic in zip(self.iou_types, self.use_cats):\n            coco_eval = COCOeval(self.gts, dts, itype)\n            if not class_agnostic:\n                coco_eval.params.useCats = 0\n                coco_eval.params.maxDets = [1, 100, 1000]\n            coco_eval.evaluate()\n            coco_eval.accumulate()\n            coco_eval.summarize()\n            aps = coco_eval.stats\n            COCO_AP = 0\n            COCO_AP50 = 1\n            COCO_AP75 = 2\n            COCO_APS = 3\n            COCO_APM = 4\n            COCO_APL = 5\n            s = coco_eval.stats\n            res = {}\n            res['AP'] = s[COCO_AP]\n            res['AP50'] = s[COCO_AP50]\n            res['AP75'] = s[COCO_AP75]\n            res['APs'] = s[COCO_APS]\n            res['APm'] = s[COCO_APM]","limited":true,"property":false},"up/tasks/cls/data/cls_evaluator.py::ImageNetEvaluator.eval":{"id":"up/tasks/cls/data/cls_evaluator.py::ImageNetEvaluator.eval","name":"ImageNetEvaluator.eval","path":"up/tasks/cls/data/cls_evaluator.py","line":184,"end":212,"meaning":"读入分类结果，选择普通或多标签评估，再返回 Top-k 等指标。","kind":"cpu","hardware":"ImageNet 指标统计。","url":"https://github.com/ModelTC/United-Perception/blob/52aaeb9ed27a490820696d7754d19f98cd6ecd11/up/tasks/cls/data/cls_evaluator.py#L184","code":"    def eval(self, res_file, res=None):\n        res_dict = self.load_res(res_file, res)\n        if self.multilabel:\n            label, pred = [], []\n            for attr_idx in range(len(res_dict['label'])):\n                label.append(np.concatenate(np.array(res_dict['label'][attr_idx]), axis=0))\n                pred.append(np.concatenate(np.array(res_dict['prediction'][attr_idx]), axis=0))\n            label = torch.from_numpy(np.array(label))\n            pred = torch.from_numpy(np.array(pred))\n        else:\n            label = torch.from_numpy(np.array(res_dict['label']))\n        if 'score' in res_dict.keys():\n            score = res_dict['score']\n        else:\n            score = res_dict['topk_idx']\n        if len(label.shape) > 1:\n            if not self.multilabel:\n                preds = []\n                for attr_idx in range(label.shape[1]):\n                    temp = []\n                    for b_idx in range(label.shape[0]):\n                        temp.append(score[b_idx][attr_idx])\n                    preds.append(temp)\n                pred = [torch.from_numpy(np.array(idx)) for idx in preds]\n            metric = self.multicls_eval(pred, label)\n        else:\n            score = torch.from_numpy(np.array(score))\n            metric = self.single_eval(score, label, res_dict)\n        return metric","limited":false,"property":false},"up/utils/env/dist_helper.py::all_reduce_norm":{"id":"up/utils/env/dist_helper.py::all_reduce_norm","name":"all_reduce_norm","path":"up/utils/env/dist_helper.py","line":600,"end":608,"meaning":"收集 BN 等模块的状态，跨进程平均后重新写回模型。","kind":"comm","hardware":"在 async_norm 配置启用、进入验证前执行。","url":"https://github.com/ModelTC/United-Perception/blob/52aaeb9ed27a490820696d7754d19f98cd6ecd11/up/utils/env/dist_helper.py#L600","code":"def all_reduce_norm(module):\n    \"\"\"\n    All reduce norm statistics in different devices.\n    \"\"\"\n    if get_world_size() <= 1:\n        return\n    states = get_async_norm_states(module)\n    states = all_reduce_dict(states, op=\"mean\")\n    module.load_state_dict(states, strict=False)","limited":false,"property":false},"up/utils/env/dist_helper.py::get_async_norm_states":{"id":"up/utils/env/dist_helper.py::get_async_norm_states","name":"get_async_norm_states","path":"up/utils/env/dist_helper.py","line":590,"end":597,"meaning":"遍历模型，把 BN 的状态按名称收集到字典中。","kind":"cpu","hardware":"被收集的 Tensor 可以在 GPU 上。","url":"https://github.com/ModelTC/United-Perception/blob/52aaeb9ed27a490820696d7754d19f98cd6ecd11/up/utils/env/dist_helper.py#L590","code":"def get_async_norm_states(module):\n    async_norm_states = OrderedDict()\n    ASYNC_NORM = (nn.BatchNorm1d, nn.BatchNorm2d, nn.BatchNorm3d)\n    for name, child in module.named_modules():\n        if isinstance(child, ASYNC_NORM):\n            for k, v in child.state_dict().items():\n                async_norm_states[\".\".join([name, k])] = v\n    return async_norm_states","limited":false,"property":false},"up/utils/env/dist_helper.py::all_reduce_dict":{"id":"up/utils/env/dist_helper.py::all_reduce_dict","name":"all_reduce_dict","path":"up/utils/env/dist_helper.py","line":555,"end":587,"meaning":"把字典里的 Tensor 拼在一起同步，再按原形状拆回去。","kind":"comm","hardware":"torch.cat；all_reduce；平均与 reshape。","url":"https://github.com/ModelTC/United-Perception/blob/52aaeb9ed27a490820696d7754d19f98cd6ecd11/up/utils/env/dist_helper.py#L555","code":"def all_reduce_dict(py_dict, op=\"sum\", group=None):\n    \"\"\"\n    Apply all reduce function for python dict object.\n    NOTE: make sure that every py_dict has the same keys and values are in the same shape.\n\n    Args:\n        py_dict (dict): dict to apply all reduce op.\n        op (str): operator, could be \"sum\" or \"mean\".\n    \"\"\"\n    world_size = get_world_size()\n    if world_size == 1:\n        return py_dict\n    # all reduce logic across different devices.\n    py_key = list(py_dict.keys())\n    py_key_tensor = pyobj2tensor(py_key)\n    if DIST_BACKEND.backend == 'dist':\n        broadcast(py_key_tensor, src=MASTER_RANK)\n    else:\n        broadcast(py_key_tensor, MASTER_RANK)\n    py_key = tensor2pyobj(py_key_tensor)\n\n    tensor_shapes = [py_dict[k].shape for k in py_key]\n    tensor_numels = [py_dict[k].numel() for k in py_key]\n\n    flatten_tensor = torch.cat([py_dict[k].flatten() for k in py_key])\n    all_reduce(flatten_tensor)\n    if op == \"mean\":\n        flatten_tensor /= world_size\n    split_tensors = [\n        x.reshape(shape)\n        for x, shape in zip(torch.split(flatten_tensor, tensor_numels), tensor_shapes)\n    ]","limited":true,"property":false},"up/utils/env/dist_helper.py::gather_pk":{"id":"up/utils/env/dist_helper.py::gather_pk","name":"gather_pk","path":"up/utils/env/dist_helper.py","line":481,"end":528,"meaning":"把各进程的预测等 Python 对象收集到指定主进程。","kind":"comm","hardware":"默认使用 Gloo 对象收集路径。","url":"https://github.com/ModelTC/United-Perception/blob/52aaeb9ed27a490820696d7754d19f98cd6ecd11/up/utils/env/dist_helper.py#L481","code":"def gather_pk(data, dst=0, group=None):\n    \"\"\"\n    Run gather on arbitrary picklable data (not necessarily tensors).\n    Args:\n        data: any picklable object\n        dst (int): destination rank\n        group: a torch process group. By default, will use a group which\n            contains all ranks on gloo backend.\n    Returns:\n        list[data]: on dst, a list of data gathered from each rank. Otherwise,\n            an empty list.\n    \"\"\"\n    if get_world_size() == 1:\n        return [data]\n    if DIST_BACKEND.backend == 'dist':\n        if group is None:\n            group = _get_global_gloo_group()\n        if get_world_size(group=group) == 1:\n            return [data]\n        rank = get_rank(group=group)\n    else:\n        rank = get_rank()\n\n    tensor = _serialize_to_tensor(data, group)\n    size_list, tensor = _pad_to_largest_tensor(tensor, group)\n\n    # receiving Tensor from all ranks\n    if rank == dst:\n        max_size = max(size_list)\n        tensor_list = [\n            torch.empty((max_size,), dtype=torch.uint8, device=tensor.device)\n            for _ in size_list","limited":true,"property":false},"up/utils/env/dist_helper.py::_get_global_gloo_group":{"id":"up/utils/env/dist_helper.py::_get_global_gloo_group","name":"_get_global_gloo_group","path":"up/utils/env/dist_helper.py","line":363,"end":379,"meaning":"需要收集 Python 对象时，创建或取得 Gloo 通信组。","kind":"comm","hardware":"区别于模型梯度常用的 NCCL 组。","url":"https://github.com/ModelTC/United-Perception/blob/52aaeb9ed27a490820696d7754d19f98cd6ecd11/up/utils/env/dist_helper.py#L363","code":"@functools.lru_cache()\ndef _get_global_gloo_group():\n    \"\"\"\n    Return a process group based on gloo backend, containing all the ranks\n    The result is cached.\n    \"\"\"\n    if DIST_BACKEND.backend == 'dist':\n        if dist.get_backend() == \"nccl\":\n            return dist.new_group(backend=\"gloo\")\n        else:\n            return dist.group.WORLD\n    elif DIST_BACKEND.backend == 'linklink':\n        if link.get_backend() == \"nccl\":\n            return link.new_group(backend=\"gloo\")\n        else:\n            return link.group.WORLD\n    else:\n        raise NotImplementedError","limited":false,"property":false},"up/utils/env/dist_helper.py::_serialize_to_tensor":{"id":"up/utils/env/dist_helper.py::_serialize_to_tensor","name":"_serialize_to_tensor","path":"up/utils/env/dist_helper.py","line":382,"end":401,"meaning":"先 pickle 对象，再把字节放入 Tensor 以便通信。","kind":"mixed","hardware":"Gloo 路径用 CPU，NCCL 路径用 CUDA。","url":"https://github.com/ModelTC/United-Perception/blob/52aaeb9ed27a490820696d7754d19f98cd6ecd11/up/utils/env/dist_helper.py#L382","code":"def _serialize_to_tensor(data, group):\n    if DIST_BACKEND.backend == 'dist':\n        backend = dist.get_backend(group)\n        assert backend in [\"gloo\", \"nccl\"]\n        device = torch.device(\"cpu\" if backend == \"gloo\" else \"cuda\")\n    else:\n        device = torch.device(\"cpu\")\n\n    buffer = pickle.dumps(data)\n    if len(buffer) > 1024 ** 3:\n        import logging\n        logger = logging.getLogger('global')\n        logger.warning(\n            \"Rank {} trying to all-gather {:.2f} GB of data on device {}\".format(\n                get_rank(), len(buffer) / (1024 ** 3), device\n            )\n        )\n    storage = torch.ByteStorage.from_buffer(buffer)\n    tensor = torch.ByteTensor(storage).to(device=device)\n    return tensor","limited":false,"property":false},"up/utils/env/dist_helper.py::_pad_to_largest_tensor":{"id":"up/utils/env/dist_helper.py::_pad_to_largest_tensor","name":"_pad_to_largest_tensor","path":"up/utils/env/dist_helper.py","line":404,"end":437,"meaning":"先交换每个进程的数据长度，再把字节 Tensor 补齐到相同长度。","kind":"comm","hardware":"创建与通信 Tensor 同设备的临时缓冲区。","url":"https://github.com/ModelTC/United-Perception/blob/52aaeb9ed27a490820696d7754d19f98cd6ecd11/up/utils/env/dist_helper.py#L404","code":"def _pad_to_largest_tensor(tensor, group):\n    \"\"\"\n    Returns:\n        list[int]: size of the tensor, on each rank\n        Tensor: padded tensor that has the max size\n    \"\"\"\n    if DIST_BACKEND.backend == 'dist':\n        world_size = get_world_size(group=group)\n    else:\n        world_size = get_world_size()\n    assert (\n        world_size >= 1\n    ), \"comm.gather/all_gather must be called from ranks within the given group!\"\n    local_size = torch.tensor([tensor.numel()], dtype=torch.int64, device=tensor.device)\n    size_list = [\n        torch.zeros([1], dtype=torch.int64, device=tensor.device)\n        for _ in range(world_size)\n    ]\n    if DIST_BACKEND.backend == 'dist':\n        allgather(size_list, local_size, group=group)\n    else:\n        allgather(size_list, local_size)\n    size_list = [int(size.item()) for size in size_list]\n\n    max_size = max(size_list)\n\n    # we pad the tensor because torch all_gather does not support\n    # gathering tensors of different shapes\n    if local_size != max_size:\n        padding = torch.zeros(\n            (max_size - local_size,), dtype=torch.uint8, device=tensor.device\n        )","limited":true,"property":false},"up/utils/env/dist_helper.py::all_gather":{"id":"up/utils/env/dist_helper.py::all_gather","name":"all_gather","path":"up/utils/env/dist_helper.py","line":440,"end":478,"meaning":"把各进程的对象收集到每个进程，最后解码成 Python 对象列表。","kind":"comm","hardware":"序列化 → 通信 → Tensor.cpu() → 反序列化。","url":"https://github.com/ModelTC/United-Perception/blob/52aaeb9ed27a490820696d7754d19f98cd6ecd11/up/utils/env/dist_helper.py#L440","code":"def all_gather(data, group=None):\n    \"\"\"\n    Run all_gather on arbitrary picklable data (not necessarily tensors).\n    Args:\n        data: any picklable object\n        group: a torch process group. By default, will use a group which\n            contains all ranks on gloo backend.\n    Returns:\n        list[data]: list of data gathered from each rank\n    \"\"\"\n    if get_world_size() == 1:\n        return [data]\n    if DIST_BACKEND.backend == 'dist':\n        if group is None:\n            group = _get_global_gloo_group()\n        if get_world_size(group) == 1:\n            return [data]\n\n    tensor = _serialize_to_tensor(data, group)\n\n    size_list, tensor = _pad_to_largest_tensor(tensor, group)\n    max_size = max(size_list)\n\n    # receiving Tensor from all ranks\n    tensor_list = [\n        torch.empty((max_size,), dtype=torch.uint8, device=tensor.device)\n        for _ in size_list\n    ]\n    if DIST_BACKEND.backend == 'dist':\n        allgather(tensor_list, tensor, group=group)\n    else:\n        allgather(tensor_list, tensor)","limited":true,"property":false},"up/utils/env/dist_helper.py::allreduce":{"id":"up/utils/env/dist_helper.py::allreduce","name":"allreduce","path":"up/utils/env/dist_helper.py","line":24,"end":32,"meaning":"对多个进程的 Tensor 做归约，例如求和。","kind":"comm","hardware":"PyTorch 路线调用 dist.all_reduce。","url":"https://github.com/ModelTC/United-Perception/blob/52aaeb9ed27a490820696d7754d19f98cd6ecd11/up/utils/env/dist_helper.py#L24","code":"def allreduce(*args, **kwargs):\n    if get_world_size() <= 1:\n        return\n    if DIST_BACKEND.backend == 'linklink':\n        return link.allreduce(*args, **kwargs)\n    elif DIST_BACKEND.backend == 'dist':\n        return dist.all_reduce(*args, **kwargs)\n    else:\n        raise NotImplementedError","limited":false,"property":false},"up/utils/env/dist_helper.py::broadcast":{"id":"up/utils/env/dist_helper.py::broadcast","name":"broadcast","path":"up/utils/env/dist_helper.py","line":35,"end":43,"meaning":"把一个进程上的 Tensor 发给其他进程。","kind":"comm","hardware":"PyTorch 路线调用 dist.broadcast。","url":"https://github.com/ModelTC/United-Perception/blob/52aaeb9ed27a490820696d7754d19f98cd6ecd11/up/utils/env/dist_helper.py#L35","code":"def broadcast(*args, **kwargs):\n    if get_world_size() <= 1:\n        return\n    if DIST_BACKEND.backend == 'linklink':\n        return link.broadcast(*args, **kwargs)\n    elif DIST_BACKEND.backend == 'dist':\n        return dist.broadcast(*args, **kwargs)\n    else:\n        raise NotImplementedError","limited":false,"property":false},"up/commands/inference.py::Inference.add_subparser":{"id":"up/commands/inference.py::Inference.add_subparser","name":"Inference.add_subparser","path":"up/commands/inference.py","line":24,"end":89,"meaning":"声明配置、图片路径、checkpoint 和可视化目录等命令行参数。","kind":"cpu","hardware":"将命令的执行入口设为 _main。","url":"https://github.com/ModelTC/United-Perception/blob/52aaeb9ed27a490820696d7754d19f98cd6ecd11/up/commands/inference.py#L24","code":"    def add_subparser(self, name, parser):\n        sub_parser = parser.add_parser(name,\n                                       description='subcommand for inferencing',\n                                       help='inference an image')\n        sub_parser.add_argument(\n            '--fork-method',\n            dest='fork_method',\n            type=str,\n            default='fork',\n            choices=['spawn', 'fork'],\n            help='method to fork subprocess, especially for dataloader')\n        sub_parser.add_argument('--backend',\n                                dest='backend',\n                                type=str,\n                                default='dist',\n                                help='model backend')\n        sub_parser.add_argument('--ng', '--num_gpus_per_machine',\n                                dest='num_gpus_per_machine',\n                                type=int,\n                                default=8,\n                                help='num_gpus_per_machine')\n        sub_parser.add_argument('--nm', '--num_machines',\n                                dest='num_machines',\n                                type=int,\n                                default=1,\n                                help='num_machines')\n        sub_parser.add_argument('--launch',\n                                dest='launch',\n                                type=str,\n                                default='slurm',\n                                help='launch backend')\n        sub_parser.add_argument('--port',","limited":true,"property":false},"up/commands/inference.py::_main":{"id":"up/commands/inference.py::_main","name":"_main","path":"up/commands/inference.py","line":117,"end":130,"meaning":"选择启动方式，准备通信环境，然后进入 inference.main()。","kind":"runtime","hardware":"与训练复用 launch/setup_distributed。","url":"https://github.com/ModelTC/United-Perception/blob/52aaeb9ed27a490820696d7754d19f98cd6ecd11/up/commands/inference.py#L117","code":"def _main(args):\n    DIST_BACKEND.backend = args.backend\n    if args.launch == 'pytorch':\n        launch(main, args.num_gpus_per_machine, args.num_machines, args=args, start_method=args.fork_method)\n    else:\n        mp.set_start_method(args.fork_method, force=True)\n        fork_method = mp.get_start_method(allow_none=True)\n        assert fork_method == args.fork_method\n        sys.stdout.flush()\n        try:\n            setup_distributed(args.port, args.launch, args.backend)\n        except KeyError:\n            logger.info(\"Setup distributed env failed.\")\n        main(args)","limited":false,"property":false},"up/commands/inference.py::main":{"id":"up/commands/inference.py::main","name":"main","path":"up/commands/inference.py","line":92,"end":114,"meaning":"读取配置，补默认推理器和画图工具配置，创建推理器并执行 predict()。","kind":"cpu","hardware":"GPU 工作在 BaseInference 内部。","url":"https://github.com/ModelTC/United-Perception/blob/52aaeb9ed27a490820696d7754d19f98cd6ecd11/up/commands/inference.py#L92","code":"def main(args):\n    cfg = load_yaml(args.config, args.cfg_type)\n    cfg['args'] = {\n        'image_path': args.image_path,\n        'ckpt': args.ckpt,\n        'vis_dir': args.vis_dir,\n        'opts': args.opts\n    }\n    if not os.path.exists(args.vis_dir):\n        os.makedirs(args.vis_dir, exist_ok=True)\n    send_info(cfg, func=\"inference\")\n    cfg['runtime'] = cfg.setdefault('runtime', {})\n    infer_cfg = cfg['runtime'].get('inferencer', {})\n    infer_cfg['type'] = infer_cfg.get('type', 'base')\n    infer_cfg['kwargs'] = infer_cfg.get('kwargs', {})\n    # default visualizer\n    vis_cfg = infer_cfg['kwargs'].setdefault('visualizer', {})\n    vis_cfg['type'] = vis_cfg.get('type', 'plt')\n    vis_cfg['kwargs'] = vis_cfg.get('kwargs', {})\n    cfg['runtime']['inferencer'] = infer_cfg\n    inferencer = INFERENCER_REGISTRY.get(infer_cfg['type'])(cfg, **infer_cfg['kwargs'])\n    inferencer.predict()\n    finalize()","limited":false,"property":false},"up/apis/inference.py::BaseInference.__init__":{"id":"up/apis/inference.py::BaseInference.__init__","name":"BaseInference.__init__","path":"up/apis/inference.py","line":22,"end":55,"meaning":"保存路径和配置，然后依次创建图片处理、模型、Saver、可视化工具，最后加载权重。","kind":"mixed","hardware":"build_data → build_model → build_saver → visualizer → resume。","url":"https://github.com/ModelTC/United-Perception/blob/52aaeb9ed27a490820696d7754d19f98cd6ecd11/up/apis/inference.py#L22","code":"    def __init__(self, config, visualizer, work_dir='./'):\n        self.args = config.get('args', {})\n        opts = self.args.get('opts', [])\n        config = merge_opts_into_cfg(opts, config)\n        self.config = config\n        self.class_names = visualizer.get('class_names', None)\n        self.work_dir = work_dir\n        self.vis_dir = self.args['vis_dir']\n        self.ckpt = self.args['ckpt']\n        self.image_path = self.args['image_path']\n        self.task_type = get_task_from_cfg(config)\n        self.num_classes = config.get('num_classes')\n\n        assert self.image_path and os.path.exists(self.image_path), 'Invalid images path.'\n\n        # build DataFetch\n        self.build_data()\n        logger.info('build data fetcher done')\n        # build model\n        self.build_model()\n        logger.info('build model done')\n        # build saver\n        self.build_saver()\n        logger.info('build saver done')\n        # build visualizer\n        self.vis_cfg = visualizer\n        self.vis_type = self.vis_cfg['type']\n        # update vis_dir\n        self.vis_cfg['kwargs']['vis_dir'] = self.vis_dir\n        self.visualizer = VISUALIZER_REGISTRY.build(self.vis_cfg)\n        logger.info('build visualizer done')\n        # resume","limited":true,"property":false},"up/apis/inference.py::BaseInference.build_data":{"id":"up/apis/inference.py::BaseInference.build_data","name":"BaseInference.build_data","path":"up/apis/inference.py","line":89,"end":106,"meaning":"从 dataset.test 取出读图、预处理和 padding 设置，创建对应对象。","kind":"cpu","hardware":"只准备处理工具，还没有读取本次图片。","url":"https://github.com/ModelTC/United-Perception/blob/52aaeb9ed27a490820696d7754d19f98cd6ecd11/up/apis/inference.py#L89","code":"    def build_data(self):\n        data_cfg = self.config['dataset']\n        assert 'test' in data_cfg, 'Test dataset config must need !'\n        dataset_cfg = data_cfg['test']['dataset']['kwargs']\n        self.color_mode = dataset_cfg['image_reader']['kwargs']['color_mode']\n        # build image_reader\n        self.image_reader = IMAGE_READER_REGISTRY.build(dataset_cfg['image_reader'])\n\n        self.transformer = build_transformer(dataset_cfg['transformer'])\n        try:\n            pad_type = data_cfg['dataloader']['kwargs'].get('pad_type', 'batch_pad')\n            pad_value = data_cfg['dataloader']['kwargs'].get('pad_value', 0)\n            alignment = data_cfg['dataloader']['kwargs'].get('alignment', 1)\n        except BaseException:\n            pad_type = data_cfg['test']['dataloader']['kwargs'].get('pad_type', 'batch_pad')\n            pad_value = data_cfg['test']['dataloader']['kwargs'].get('pad_value', 0)\n            alignment = data_cfg['test']['dataloader']['kwargs'].get('alignment', 1)\n        self.batch_pad = BATCHING_REGISTRY.get(pad_type)(alignment, pad_value)","limited":false,"property":false},"up/apis/inference.py::BaseInference.build_model":{"id":"up/apis/inference.py::BaseInference.build_model","name":"BaseInference.build_model","path":"up/apis/inference.py","line":83,"end":87,"meaning":"按 net 创建模型，然后搬到 CUDA 并设为 eval。","kind":"transfer","hardware":"MODEL_HELPER_REGISTRY.build(...).cuda().eval()。","url":"https://github.com/ModelTC/United-Perception/blob/52aaeb9ed27a490820696d7754d19f98cd6ecd11/up/apis/inference.py#L83","code":"    def build_model(self):\n        model_helper_cfg = self.config['runtime'].get('model_helper', {})\n        model_helper_cfg['type'] = model_helper_cfg.get('type', 'base')\n        model_helper_cfg['kwargs'] = model_helper_cfg.get('kwargs', {'cfg': self.config['net']})\n        self.detector = MODEL_HELPER_REGISTRY.build(model_helper_cfg).cuda().eval()","limited":false,"property":false},"up/apis/inference.py::BaseInference.build_saver":{"id":"up/apis/inference.py::BaseInference.build_saver","name":"BaseInference.build_saver","path":"up/apis/inference.py","line":74,"end":81,"meaning":"按配置创建 Saver，用它读取 checkpoint。","kind":"cpu","hardware":"读取权重时转入 Saver.load_checkpoint。","url":"https://github.com/ModelTC/United-Perception/blob/52aaeb9ed27a490820696d7754d19f98cd6ecd11/up/apis/inference.py#L74","code":"    def build_saver(self):\n        cfg_saver = self.config['saver']\n        _cfg_saver = cfg_saver\n        if 'kwargs' not in cfg_saver:\n            _cfg_saver = {\"type\": 'base', \"kwargs\": {}}\n            _cfg_saver['kwargs']['save_cfg'] = cfg_saver\n            _cfg_saver['kwargs']['work_dir'] = self.work_dir\n        self.saver = SAVER_REGISTRY.build(_cfg_saver)","limited":false,"property":false},"up/apis/inference.py::BaseInference.resume":{"id":"up/apis/inference.py::BaseInference.resume","name":"BaseInference.resume","path":"up/apis/inference.py","line":66,"end":72,"meaning":"checkpoint 有 EMA 时优先取 EMA 权重，否则取 model/state_dict，再加载到模型。","kind":"transfer","hardware":"原版 Saver.load_checkpoint 会把存储映射到当前 CUDA 卡。","url":"https://github.com/ModelTC/United-Perception/blob/52aaeb9ed27a490820696d7754d19f98cd6ecd11/up/apis/inference.py#L66","code":"    def resume(self):\n        checkpoint = self.saver.load_checkpoint(self.ckpt)\n        if 'ema' in checkpoint.keys():\n            state_dict = checkpoint['ema']['ema_state_dict']\n        else:\n            state_dict = checkpoint.get('model', checkpoint.get('state_dict', {}))\n        self.detector.load(state_dict, strict=False)","limited":false,"property":false},"up/apis/inference.py::BaseInference.iterate_image":{"id":"up/apis/inference.py::BaseInference.iterate_image","name":"BaseInference.iterate_image","path":"up/apis/inference.py","line":108,"end":116,"meaning":"递归遍历图片目录，按后缀筛出图片路径。","kind":"cpu","hardware":"返回逐个可迭代的文件名。","url":"https://github.com/ModelTC/United-Perception/blob/52aaeb9ed27a490820696d7754d19f98cd6ecd11/up/apis/inference.py#L108","code":"    def iterate_image(self, image_dir):\n        EXTS = ['jpg', 'jpeg', 'png', 'svg', 'bmp']\n\n        for root, subdirs, subfiles in os.walk(image_dir):\n            for filename in subfiles:\n                ext = filename.rsplit('.', 1)[-1].lower()\n                filepath = os.path.join(root, filename)\n                if ext in EXTS:\n                    yield filepath","limited":false,"property":false},"up/apis/inference.py::BaseInference.fetch_single":{"id":"up/apis/inference.py::BaseInference.fetch_single","name":"BaseInference.fetch_single","path":"up/apis/inference.py","line":161,"end":190,"meaning":"读取一张图片，做测试预处理，记录原图尺寸和缩放比例，再把图像 Tensor 搬到 CUDA。","kind":"transfer","hardware":"data.image.cuda() 是本条输入迁移边界。","url":"https://github.com/ModelTC/United-Perception/blob/52aaeb9ed27a490820696d7754d19f98cd6ecd11/up/apis/inference.py#L161","code":"    def fetch_single(self, filename):\n        if isinstance(filename, str):\n            img = self.image_reader.read(filename)\n            data = EasyDict({\n                'filename': filename,\n                'origin_image': img,\n                'image': img,\n                'flipped': False\n            })\n        else:\n            origin_img = img = filename\n            data = EasyDict({\n                'filename': 'temp.jpg',\n                'origin_image': origin_img,\n                'image': img,\n                'flipped': False\n            })\n\n        if self.task_type == 'seg':\n            data['gt_semantic_seg'] = img\n        data = self.transformer(data)\n        scale_factor = data.get('scale_factor', 1)\n\n        image_h, image_w = get_image_size(img)\n        new_image_h, new_image_w = get_image_size(data.image)\n        pad_w, pad_h = data.get('dw', 0), data.get('dh', 0)\n        data.image_info = [new_image_h, new_image_w, scale_factor,\n                           image_h, image_w, data.flipped, pad_w, pad_h, filename]\n        data.image = data.image.cuda()\n        return data","limited":false,"property":false},"up/apis/inference.py::BaseInference.fetch":{"id":"up/apis/inference.py::BaseInference.fetch","name":"BaseInference.fetch","path":"up/apis/inference.py","line":192,"end":203,"meaning":"逐张调用 fetch_single()，合并各字段并 padding，返回模型要用的 batch 字典。","kind":"compute","hardware":"图片已在 GPU 上，BatchPad 的分配与拷贝也可能在 GPU 上。","url":"https://github.com/ModelTC/United-Perception/blob/52aaeb9ed27a490820696d7754d19f98cd6ecd11/up/apis/inference.py#L192","code":"    def fetch(self, filename_list):\n        batch = [self.fetch_single(filename) for filename in filename_list]\n\n        batch_keys = list(batch[0].keys())\n\n        def batch_value(key, default=None):\n            return [_.get(key, default) for _ in batch]\n\n        data = EasyDict({k: batch_value(k) for k in batch_keys})\n        data = self.batch_pad(data)\n\n        return data","limited":false,"property":false},"up/apis/inference.py::BaseInference.fetch.batch_value":{"id":"up/apis/inference.py::BaseInference.fetch.batch_value","name":"BaseInference.fetch.batch_value","path":"up/apis/inference.py","line":197,"end":198,"meaning":"从这批图片中，取出同名字段并组成一个列表。","kind":"cpu","hardware":"内部辅助函数；不复制 Tensor 内容到其他设备。","url":"https://github.com/ModelTC/United-Perception/blob/52aaeb9ed27a490820696d7754d19f98cd6ecd11/up/apis/inference.py#L197","code":"        def batch_value(key, default=None):\n            return [_.get(key, default) for _ in batch]","limited":false,"property":false},"up/apis/inference.py::BaseInference.predict":{"id":"up/apis/inference.py::BaseInference.predict","name":"BaseInference.predict","path":"up/apis/inference.py","line":205,"end":223,"meaning":"遍历输入图片，组 batch，在 no_grad 下调用模型，再按任务选择输出方式。","kind":"compute","hardware":"self.detector(batch)；本入口没有显式 autocast。","url":"https://github.com/ModelTC/United-Perception/blob/52aaeb9ed27a490820696d7754d19f98cd6ecd11/up/apis/inference.py#L205","code":"    def predict(self):\n        if os.path.isdir(self.image_path):\n            list_imgs = self.iterate_image(self.image_path)\n        else:\n            list_imgs = [self.image_path]\n        for img_idx, filename in enumerate(list_imgs):\n            logger.info('predicting {}:{}'.format(img_idx, filename))\n            batch = self.fetch([filename])\n            with torch.no_grad():\n                output = self.detector(batch)\n            if(self.task_type == 'det'):\n                output = self.map_back(output)\n                self.vis(output)\n            elif(self.task_type == 'cls'):\n                self.vis_cls(output)\n            elif(self.task_type == 'seg'):\n                self.vis_seg(output)\n            else:\n                raise Exception('Unsupported type of task')","limited":false,"property":false},"up/apis/inference.py::BaseInference.tensor2numpy":{"id":"up/apis/inference.py::BaseInference.tensor2numpy","name":"BaseInference.tensor2numpy","path":"up/apis/inference.py","line":57,"end":64,"meaning":"把 Tensor 从设备取回 CPU，并转成 NumPy 数组；也处理列表和 None。","kind":"transfer","hardware":"Tensor.cpu().numpy()；读取 GPU 结果的边界。","url":"https://github.com/ModelTC/United-Perception/blob/52aaeb9ed27a490820696d7754d19f98cd6ecd11/up/apis/inference.py#L57","code":"    def tensor2numpy(self, x):\n        if x is None:\n            return x\n        if torch.is_tensor(x):\n            return x.cpu().numpy()\n        if isinstance(x, list):\n            x = [_.cpu().numpy() if torch.is_tensor(_) else _ for _ in x]\n        return x","limited":false,"property":false},"up/apis/inference.py::BaseInference.map_back":{"id":"up/apis/inference.py::BaseInference.map_back","name":"BaseInference.map_back","path":"up/apis/inference.py","line":118,"end":159,"meaning":"按缩放比例把预测框还原到原始图片坐标，再按图片拆开。","kind":"mixed","hardware":"先把 dt_bboxes 转到 CPU，随后用 NumPy 处理坐标。","url":"https://github.com/ModelTC/United-Perception/blob/52aaeb9ed27a490820696d7754d19f98cd6ecd11/up/apis/inference.py#L118","code":"    def map_back(self, output):\n        \"\"\"Map predictions to original image\n        Args:\n           - output: dict\n        Returns:\n           - output_list: list of dict,\n        \"\"\"\n        origin_images = output['origin_image']\n        image_info = output['image_info']\n        bboxes = self.tensor2numpy(output['dt_bboxes'])\n        batch_size = len(image_info)\n\n        output_list = []\n        for b_ix in range(batch_size):\n\n            origin_image = origin_images[b_ix]\n            if origin_image.ndim == 3:\n                origin_image_h, origin_image_w, _ = origin_image.shape\n            else:\n                origin_image_h, origin_image_w = origin_image.shape\n\n            img_info = image_info[b_ix]\n            unpad_image_h, unpad_image_w = img_info[:2]\n            scale_h, scale_w = _pair(img_info[2])\n            keep_ix = np.where(bboxes[:, 0] == b_ix)[0]\n\n            # resize bbox\n            img_bboxes = bboxes[keep_ix]\n            img_bboxes[:, 1] /= scale_w\n            img_bboxes[:, 2] /= scale_h\n            img_bboxes[:, 3] /= scale_w\n            img_bboxes[:, 4] /= scale_h","limited":true,"property":false},"up/apis/inference.py::BaseInference.vis":{"id":"up/apis/inference.py::BaseInference.vis","name":"BaseInference.vis","path":"up/apis/inference.py","line":225,"end":240,"meaning":"把检测类别和框交给可视化工具，保存带框图片。","kind":"cpu","hardware":"OpenCV/绘图与文件保存。","url":"https://github.com/ModelTC/United-Perception/blob/52aaeb9ed27a490820696d7754d19f98cd6ecd11/up/apis/inference.py#L225","code":"    def vis(self, outputs):\n        for img_idx, output in enumerate(outputs):\n            img = output['image']\n            if self.color_mode != 'RGB':\n                cvt_color_vis = getattr(cv2, 'COLOR_{}2RGB'.format(self.color_mode))\n                img = cv2.cvtColor(img, cvt_color_vis)\n            boxes = output['dt_bboxes']\n            filename = os.path.basename(output['image_info'][-1])\n            if self.vis_type == 'plt':\n                filename = filename.rsplit('.', 1)[0]\n            logger.info('visualizing {}'.format(filename))\n\n            img_h, img_w = img.shape[:2]\n            classes = boxes[:, -1].astype(np.int32)\n            boxes = boxes[:, :-1]\n            self.visualizer.vis(img, boxes, classes, filename)","limited":false,"property":false},"up/apis/inference.py::BaseInference.vis_cls":{"id":"up/apis/inference.py::BaseInference.vis_cls","name":"BaseInference.vis_cls","path":"up/apis/inference.py","line":242,"end":257,"meaning":"把分类预测取回 CPU，写到图片上并保存。","kind":"transfer","hardware":"通过 tensor2numpy() 取回预测。","url":"https://github.com/ModelTC/United-Perception/blob/52aaeb9ed27a490820696d7754d19f98cd6ecd11/up/apis/inference.py#L242","code":"    def vis_cls(self, outputs):\n        origin_images = outputs['origin_image']\n        image_info = outputs['image_info']\n        batch_size = len(image_info)\n        preds = self.tensor2numpy(outputs['preds'])\n        for b_ix in range(batch_size):\n            img = origin_images[b_ix]\n            pred = str(preds[b_ix])\n            filename = os.path.basename(image_info[b_ix][-1])\n            draw = ImageDraw.Draw(img)\n            draw.text((100, 100), pred, (255, 255, 255))\n            draw = ImageDraw.Draw(img)\n            logger.info('visualizing {}'.format(filename))\n            output_name = os.path.basename(filename)\n            output_name = os.path.join(self.vis_dir, '{}'.format(output_name))\n            img.save(output_name)","limited":false,"property":false},"up/apis/inference.py::BaseInference.vis_seg":{"id":"up/apis/inference.py::BaseInference.vis_seg","name":"BaseInference.vis_seg","path":"up/apis/inference.py","line":259,"end":276,"meaning":"选出每个像素得分最高的类别，转成彩色分割图后保存。","kind":"mixed","hardware":"preds.max(1) 可在 GPU 上；后续取回 CPU 并着色。","url":"https://github.com/ModelTC/United-Perception/blob/52aaeb9ed27a490820696d7754d19f98cd6ecd11/up/apis/inference.py#L259","code":"    def vis_seg(self, outputs):\n        image_info = outputs['image_info']\n        batch_size = len(image_info)\n        blob_preds = outputs['blob_pred']\n        for b_ix in range(batch_size):\n            filename = os.path.basename(image_info[b_ix][-1])\n            preds = blob_preds[b_ix]\n            pred = preds.reshape(1, preds.shape[0], preds.shape[1], preds.shape[2])\n            pred = pred.max(1)[1]\n            pred = self.tensor2numpy(pred)[0]\n            pred = pred * 255 / self.num_classes\n            pred = cv2.applyColorMap(cv2.convertScaleAbs(pred), cv2.COLORMAP_JET)\n            img = Image.fromarray(np.uint8(pred))\n            img = img.convert(\"RGB\")\n            logger.info('visualizing {}'.format(filename))\n            output_name = os.path.basename(filename)\n            output_name = os.path.join(self.vis_dir, '{}'.format(output_name))\n            img.save(output_name)","limited":false,"property":false},"up/tasks/det/plugins/yolox/models/backbone/cspdarknet.py::yolox_s":{"id":"up/tasks/det/plugins/yolox/models/backbone/cspdarknet.py::yolox_s","name":"yolox_s","path":"up/tasks/det/plugins/yolox/models/backbone/cspdarknet.py","line":292,"end":299,"meaning":"创建 small 规模的 CSPDarknet，并设置宽度、深度等默认参数。","kind":"cpu","hardware":"构造模型，真正卷积在 forward 中。","url":"https://github.com/ModelTC/United-Perception/blob/52aaeb9ed27a490820696d7754d19f98cd6ecd11/up/tasks/det/plugins/yolox/models/backbone/cspdarknet.py#L292","code":"@MODULE_ZOO_REGISTRY.register('yolox_s')\ndef yolox_s(**kwargs):\n    \"\"\"\n    Constructs a yolox_tiny model.\n\n    Arguments:\n    \"\"\"\n    model = CSPDarknet(dep_mul=0.33, wid_mul=0.50, **kwargs)\n    return model","limited":false,"property":false},"up/tasks/det/plugins/yolox/models/backbone/cspdarknet.py::CSPDarknet.forward":{"id":"up/tasks/det/plugins/yolox/models/backbone/cspdarknet.py::CSPDarknet.forward","name":"CSPDarknet.forward","path":"up/tasks/det/plugins/yolox/models/backbone/cspdarknet.py","line":242,"end":263,"meaning":"把图像依次送过各层，取配置要求的多尺度特征图。","kind":"compute","hardware":"卷积、归一化、激活、拼接、池化。","url":"https://github.com/ModelTC/United-Perception/blob/52aaeb9ed27a490820696d7754d19f98cd6ecd11/up/tasks/det/plugins/yolox/models/backbone/cspdarknet.py#L242","code":"    def forward(self, x):\n        x = x['image']\n        features = []\n        # stem\n        x = self.stem(x)\n        features.append(x)\n        # dark2\n        x = self.dark2(x)\n        features.append(x)\n        # dark3\n        x = self.dark3(x)\n        features.append(x)\n        # dark4\n        x = self.dark4(x)\n        features.append(x)\n        # dark5\n        x = self.dark5(x)\n        features.append(x)\n\n        # [dark3, dark4, dark5]\n        features = [features[_] for _ in self.out_layers]\n        return {'features': features, 'strides': self.get_outstrides()}","limited":false,"property":false},"up/tasks/det/plugins/yolox/models/backbone/cspdarknet.py::Bottleneck.forward":{"id":"up/tasks/det/plugins/yolox/models/backbone/cspdarknet.py::Bottleneck.forward","name":"Bottleneck.forward","path":"up/tasks/det/plugins/yolox/models/backbone/cspdarknet.py","line":78,"end":82,"meaning":"连续做特征变换，按设置加上残差。","kind":"compute","hardware":"卷积和残差 Tensor 相加。","url":"https://github.com/ModelTC/United-Perception/blob/52aaeb9ed27a490820696d7754d19f98cd6ecd11/up/tasks/det/plugins/yolox/models/backbone/cspdarknet.py#L78","code":"    def forward(self, x):\n        y = self.conv2(self.conv1(x))\n        if self.use_add:\n            y = y + x\n        return y","limited":false,"property":false},"up/tasks/det/plugins/yolox/models/backbone/cspdarknet.py::CSPLayer.forward":{"id":"up/tasks/det/plugins/yolox/models/backbone/cspdarknet.py::CSPLayer.forward","name":"CSPLayer.forward","path":"up/tasks/det/plugins/yolox/models/backbone/cspdarknet.py","line":109,"end":114,"meaning":"把特征拆成两路，分别处理后拼接并融合。","kind":"compute","hardware":"卷积、torch.cat。","url":"https://github.com/ModelTC/United-Perception/blob/52aaeb9ed27a490820696d7754d19f98cd6ecd11/up/tasks/det/plugins/yolox/models/backbone/cspdarknet.py#L109","code":"    def forward(self, x):\n        x_1 = self.conv1(x)\n        x_2 = self.conv2(x)\n        x_1 = self.m(x_1)\n        x = torch.cat((x_1, x_2), dim=1)\n        return self.conv3(x)","limited":false,"property":false},"up/tasks/det/plugins/yolox/models/backbone/cspdarknet.py::SPP_dila.forward":{"id":"up/tasks/det/plugins/yolox/models/backbone/cspdarknet.py::SPP_dila.forward","name":"SPP_dila.forward","path":"up/tasks/det/plugins/yolox/models/backbone/cspdarknet.py","line":34,"end":38,"meaning":"对特征做多个尺度的池化，再拼接融合。","kind":"compute","hardware":"池化、拼接、卷积。","url":"https://github.com/ModelTC/United-Perception/blob/52aaeb9ed27a490820696d7754d19f98cd6ecd11/up/tasks/det/plugins/yolox/models/backbone/cspdarknet.py#L34","code":"    def forward(self, x):\n        x = self.conv_block1(x)\n        x = torch.cat([x] + [m(x) for m in self.pooling_blocks], 1)\n        x = self.conv_block2(x)\n        return x","limited":false,"property":false},"up/tasks/det/plugins/yolox/models/backbone/cspdarknet.py::DWConv.forward":{"id":"up/tasks/det/plugins/yolox/models/backbone/cspdarknet.py::DWConv.forward","name":"DWConv.forward","path":"up/tasks/det/plugins/yolox/models/backbone/cspdarknet.py","line":59,"end":61,"meaning":"先做逐通道卷积，再做逐点卷积。","kind":"compute","hardware":"此类只在选择相应深度可分离结构时参与。","url":"https://github.com/ModelTC/United-Perception/blob/52aaeb9ed27a490820696d7754d19f98cd6ecd11/up/tasks/det/plugins/yolox/models/backbone/cspdarknet.py#L59","code":"    def forward(self, x):\n        x = self.dconv(x)\n        return self.pconv(x)","limited":false,"property":false},"up/tasks/det/plugins/yolox/models/neck/pafpn.py::YoloxPAFPN.forward":{"id":"up/tasks/det/plugins/yolox/models/neck/pafpn.py::YoloxPAFPN.forward","name":"YoloxPAFPN.forward","path":"up/tasks/det/plugins/yolox/models/neck/pafpn.py","line":92,"end":130,"meaning":"将高层和低层特征上下采样、拼接、融合，输出三个尺度的特征。","kind":"compute","hardware":"F.interpolate、torch.cat、卷积。","url":"https://github.com/ModelTC/United-Perception/blob/52aaeb9ed27a490820696d7754d19f98cd6ecd11/up/tasks/det/plugins/yolox/models/neck/pafpn.py#L92","code":"    def forward(self, input):\n        laterals = input['features']\n        [x2, x1, x0] = laterals\n        features = []\n\n        fpn_out0 = self.lateral_conv0(x0)  # 1024->512/32\n        f_out0 = F.interpolate(fpn_out0,\n                               size=x1.shape[-2:],\n                               mode=self.upsample,\n                               align_corners=self.align_corners)\n        f_out0 = torch.cat([f_out0, x1], 1)  # 512->1024/16\n        f_out0 = self.C3_p4(f_out0)  # 1024->512/16\n        # features.append(f_out0)\n\n        fpn_out1 = self.reduce_conv1(f_out0)  # 512->256/16\n        f_out1 = F.interpolate(fpn_out1,\n                               size=x2.shape[-2:],\n                               mode=self.upsample,\n                               align_corners=self.align_corners)\n        f_out1 = torch.cat([f_out1, x2], 1)  # 256->512/8\n        pan_out2 = self.C3_p3(f_out1)  # 512->256/8\n        features.append(pan_out2)\n\n        p_out1 = self.bu_conv2(pan_out2)  # 256->256/16\n        p_out1 = torch.cat([p_out1, fpn_out1], 1)  # 256->512/16\n        pan_out1 = self.C3_n3(p_out1)  # 512->512/16\n        features.append(pan_out1)\n\n        p_out0 = self.bu_conv1(pan_out1)  # 512->512/32\n        p_out0 = torch.cat([p_out0, fpn_out0], 1)  # 512->1024/32\n        pan_out0 = self.C3_n4(p_out0)  # 1024->1024/32\n        features.append(pan_out0)","limited":true,"property":false},"up/tasks/det/plugins/yolox/models/neck/pafpn.py::YoloxPAFPN.get_outplanes":{"id":"up/tasks/det/plugins/yolox/models/neck/pafpn.py::YoloxPAFPN.get_outplanes","name":"YoloxPAFPN.get_outplanes","path":"up/tasks/det/plugins/yolox/models/neck/pafpn.py","line":132,"end":133,"meaning":"告诉下一个模块各尺度输出通道数。","kind":"cpu","hardware":"模型组装时传递结构信息。","url":"https://github.com/ModelTC/United-Perception/blob/52aaeb9ed27a490820696d7754d19f98cd6ecd11/up/tasks/det/plugins/yolox/models/neck/pafpn.py#L132","code":"    def get_outplanes(self):\n        return self.outplanes","limited":false,"property":false},"up/tasks/det/plugins/yolox/models/neck/pafpn.py::YoloxPAFPN.get_outstrides":{"id":"up/tasks/det/plugins/yolox/models/neck/pafpn.py::YoloxPAFPN.get_outstrides","name":"YoloxPAFPN.get_outstrides","path":"up/tasks/det/plugins/yolox/models/neck/pafpn.py","line":135,"end":136,"meaning":"告诉下一个模块每个特征图对应的图片缩小倍数。","kind":"cpu","hardware":"框坐标换算会用到 stride。","url":"https://github.com/ModelTC/United-Perception/blob/52aaeb9ed27a490820696d7754d19f98cd6ecd11/up/tasks/det/plugins/yolox/models/neck/pafpn.py#L135","code":"    def get_outstrides(self):\n        return torch.tensor(self.out_strides, dtype=torch.int)","limited":false,"property":false},"up/tasks/det/plugins/yolox/models/head/yolox_head.py::YoloXHead.initialize_biases":{"id":"up/tasks/det/plugins/yolox/models/head/yolox_head.py::YoloXHead.initialize_biases","name":"YoloXHead.initialize_biases","path":"up/tasks/det/plugins/yolox/models/head/yolox_head.py","line":146,"end":155,"meaning":"用先验概率设置分类和目标置信度头的初始 bias。","kind":"mixed","hardware":"初始化参数；通常在模型搬 GPU 前执行。","url":"https://github.com/ModelTC/United-Perception/blob/52aaeb9ed27a490820696d7754d19f98cd6ecd11/up/tasks/det/plugins/yolox/models/head/yolox_head.py#L146","code":"    def initialize_biases(self, prior_prob):\n        for conv in self.cls_preds:\n            b = conv.bias.view(self.num_point, -1)\n            b.data.fill_(-math.log((1 - prior_prob) / prior_prob))\n            conv.bias = torch.nn.Parameter(b.view(-1), requires_grad=True)\n\n        for conv in self.obj_preds:\n            b = conv.bias.view(self.num_point, -1)\n            b.data.fill_(-math.log((1 - prior_prob) / prior_prob))\n            conv.bias = torch.nn.Parameter(b.view(-1), requires_grad=True)","limited":false,"property":false},"up/tasks/det/plugins/yolox/models/head/yolox_head.py::YoloXHead.forward":{"id":"up/tasks/det/plugins/yolox/models/head/yolox_head.py::YoloXHead.forward","name":"YoloXHead.forward","path":"up/tasks/det/plugins/yolox/models/head/yolox_head.py","line":157,"end":163,"meaning":"遍历各尺度特征，调用 forward_net() 得到各尺度预测。","kind":"compute","hardware":"输出仍是网络预测，还不是最后检测框。","url":"https://github.com/ModelTC/United-Perception/blob/52aaeb9ed27a490820696d7754d19f98cd6ecd11/up/tasks/det/plugins/yolox/models/head/yolox_head.py#L157","code":"    def forward(self, input):\n        features = input['features']\n        mlvl_raw_preds = self.forward_net(features)\n        output = {}\n        output['preds'] = mlvl_raw_preds\n        output.update({'deploy_output_node': output['preds']})\n        return output","limited":false,"property":false},"up/tasks/det/plugins/yolox/models/head/yolox_head.py::YoloXHead.forward_net":{"id":"up/tasks/det/plugins/yolox/models/head/yolox_head.py::YoloXHead.forward_net","name":"YoloXHead.forward_net","path":"up/tasks/det/plugins/yolox/models/head/yolox_head.py","line":134,"end":144,"meaning":"对一个尺度分别计算分类、框回归和目标置信度。","kind":"compute","hardware":"卷积等计算，返回这三个分支的 Tensor。","url":"https://github.com/ModelTC/United-Perception/blob/52aaeb9ed27a490820696d7754d19f98cd6ecd11/up/tasks/det/plugins/yolox/models/head/yolox_head.py#L134","code":"    def forward_net(self, features, idx=0):\n        mlvl_preds = []\n        for i in range(self.num_level):\n            feat = self.stems[i](features[i])\n            cls_feat = self.cls_convs[i](feat)\n            loc_feat = self.reg_convs[i](feat)\n            cls_pred = self.cls_preds[i](cls_feat)\n            loc_pred = self.reg_preds[i](loc_feat)\n            obj_pred = self.obj_preds[i](loc_feat)\n            mlvl_preds.append((cls_pred, loc_pred, obj_pred))\n        return mlvl_preds","limited":false,"property":false},"up/tasks/det/plugins/yolox/models/postprocess/yolox_postprocess.py::YoloxPostProcess.__init__":{"id":"up/tasks/det/plugins/yolox/models/postprocess/yolox_postprocess.py::YoloxPostProcess.__init__","name":"YoloxPostProcess.__init__","path":"up/tasks/det/plugins/yolox/models/postprocess/yolox_postprocess.py","line":21,"end":48,"meaning":"准备目标分配器、预测器、网格点生成器和各项损失。","kind":"cpu","hardware":"按 cfg 分别创建训练与评估工具。","url":"https://github.com/ModelTC/United-Perception/blob/52aaeb9ed27a490820696d7754d19f98cd6ecd11/up/tasks/det/plugins/yolox/models/postprocess/yolox_postprocess.py#L21","code":"    def __init__(self,\n                 num_classes,\n                 cfg,\n                 norm_on_bbox=False,\n                 all_reduce_norm=True,\n                 use_l1=False,\n                 prefix=None):\n        super(YoloxPostProcess, self).__init__()\n        self.prefix = prefix if prefix is not None else self.__class__.__name__\n        self.num_classes = num_classes\n        self.norm_on_bbox = norm_on_bbox\n        test_cfg = copy.deepcopy(cfg)\n        test_cfg.update(test_cfg.get('test', {}))\n        train_cfg = copy.deepcopy(cfg)\n        train_cfg.update(train_cfg.get('train', {}))\n        self.supervisor = build_roi_supervisor(train_cfg['roi_supervisor'])\n        self.predictor = build_roi_predictor(test_cfg['roi_predictor'])\n        self.point_generator = build_anchor_generator(cfg['anchor_generator'])\n        self.dense_points = self.point_generator.dense_points\n        self.cls_loss = build_loss(cfg['cls_loss'])\n        self.loc_loss = build_loss(cfg['loc_loss'])\n        self.obj_loss = build_loss(cfg['obj_loss'])\n        self.l1_loss = nn.L1Loss(reduction=\"none\")\n        self.use_l1 = use_l1\n\n        # config\n        self.cfg = copy.deepcopy(cfg)\n        self.all_reduce_norm = all_reduce_norm","limited":false,"property":false},"up/tasks/det/plugins/yolox/models/postprocess/yolox_postprocess.py::YoloxPostProcess.forward":{"id":"up/tasks/det/plugins/yolox/models/postprocess/yolox_postprocess.py::YoloxPostProcess.forward","name":"YoloxPostProcess.forward","path":"up/tasks/det/plugins/yolox/models/postprocess/yolox_postprocess.py","line":79,"end":117,"meaning":"整理各尺度预测并解码框；训练时生成目标和损失，评估时输出检测结果。","kind":"compute","hardware":"这是训练/推理计算开始分叉的位置。","url":"https://github.com/ModelTC/United-Perception/blob/52aaeb9ed27a490820696d7754d19f98cd6ecd11/up/tasks/det/plugins/yolox/models/postprocess/yolox_postprocess.py#L79","code":"    def forward(self, input):\n        features = input['features']\n        strides = input['strides']\n        mlvl_preds = input['preds']\n\n        # [B, hi*wi*A, :]\n        mlvl_preds, mlvl_shapes = self.permute_preds(mlvl_preds)\n        mlvl_shapes = [(*shp, s) for shp, s in zip(mlvl_shapes, strides)]\n\n        # [hi*wi*A, 2], for C4 there is only one layer, for FPN generate anchors for each layer\n        mlvl_locations = self.point_generator.get_anchors(mlvl_shapes, device=features[0].device)\n\n        mlvl_ori_loc_preds = None\n        if self.use_l1:\n            mlvl_ori_loc_preds = []\n        for l_ix in range(len(mlvl_locations)):\n            # add preds for l1 loss\n            if self.use_l1:\n                mlvl_ori_loc_preds.append(mlvl_preds[l_ix][1].clone())\n            mlvl_preds[l_ix][1][..., :2] *= strides[l_ix]\n            mlvl_preds[l_ix][1][..., :2] += mlvl_locations[l_ix]\n            if self.norm_on_bbox:\n                mlvl_preds[l_ix][1][..., 2:4] = F.relu(mlvl_preds[l_ix][1][..., 2:4])  # , inplace=True)\n                mlvl_preds[l_ix][1][..., 2:4] *= strides[l_ix]\n            else:\n                mlvl_preds[l_ix][1][..., 2:4] = torch.exp(mlvl_preds[l_ix][1][..., 2:4]) * strides[l_ix]\n\n        if self.training:\n            targets = self.supervisor.get_targets(mlvl_locations, input, mlvl_preds)\n            if not self.use_l1:\n                losses = self.get_loss(targets, mlvl_preds)\n            else:","limited":true,"property":false},"up/tasks/det/plugins/yolox/models/postprocess/yolox_postprocess.py::YoloxPostProcess.permute_preds":{"id":"up/tasks/det/plugins/yolox/models/postprocess/yolox_postprocess.py::YoloxPostProcess.permute_preds","name":"YoloxPostProcess.permute_preds","path":"up/tasks/det/plugins/yolox/models/postprocess/yolox_postprocess.py","line":68,"end":77,"meaning":"把 [B,C,H,W] 调整成按候选点排列的预测，方便后续匹配。","kind":"compute","hardware":"permute、contiguous、view；包含可能的显存重排。","url":"https://github.com/ModelTC/United-Perception/blob/52aaeb9ed27a490820696d7754d19f98cd6ecd11/up/tasks/det/plugins/yolox/models/postprocess/yolox_postprocess.py#L68","code":"    def permute_preds(self, mlvl_preds):\n        \"\"\"Permute preds from [B, A*C, H, W] to [B, H*W*A, C] \"\"\"\n        mlvl_permuted_preds, mlvl_shapes = [], []\n        for lvl_idx, preds in enumerate(mlvl_preds):\n            b, _, h, w = preds[0].shape\n            k = self.dense_points * h * w\n            preds = [p.permute(0, 2, 3, 1).contiguous().view(b, k, -1) for p in preds]\n            mlvl_permuted_preds.append(preds)\n            mlvl_shapes.append((h, w, k))\n        return mlvl_permuted_preds, mlvl_shapes","limited":false,"property":false},"up/tasks/det/plugins/yolox/models/postprocess/yolox_postprocess.py::YoloxPostProcess.get_loss":{"id":"up/tasks/det/plugins/yolox/models/postprocess/yolox_postprocess.py::YoloxPostProcess.get_loss","name":"YoloxPostProcess.get_loss","path":"up/tasks/det/plugins/yolox/models/postprocess/yolox_postprocess.py","line":126,"end":182,"meaning":"计算分类、框、目标置信度和可选 L1 损失，组成带名称的输出字典。","kind":"compute","hardware":"Tensor 拼接、IoU/BCE/L1；未启用 L1 时原版直接创建 CUDA 零 Tensor。","url":"https://github.com/ModelTC/United-Perception/blob/52aaeb9ed27a490820696d7754d19f98cd6ecd11/up/tasks/det/plugins/yolox/models/postprocess/yolox_postprocess.py#L126","code":"    def get_loss(self, targets, mlvl_preds, mlvl_ori_loc_preds=None):\n        mlvl_cls_pred, mlvl_loc_pred, mlvl_obj_pred = zip(*mlvl_preds)\n        cls_pred = torch.cat(mlvl_cls_pred, dim=1)\n        loc_pred = torch.cat(mlvl_loc_pred, dim=1)\n        obj_pred = torch.cat(mlvl_obj_pred, dim=1)\n        if self.use_l1:\n            ori_loc_preds = torch.cat(mlvl_ori_loc_preds, dim=1)\n            del mlvl_ori_loc_preds\n        del mlvl_cls_pred, mlvl_loc_pred, mlvl_obj_pred\n\n        cls_targets, reg_targets, obj_targets, ori_reg_targets, fg_masks, num_fgs = targets\n        cls_targets = torch.cat(cls_targets, 0)\n        reg_targets = torch.cat(reg_targets, 0)\n        obj_targets = torch.cat(obj_targets, 0)\n        if self.use_l1:\n            ori_reg_targets = torch.cat(ori_reg_targets, 0)\n        fg_masks = torch.cat(fg_masks, 0)\n        if self.all_reduce_norm and dist.is_initialized():\n            num_fgs = self.get_ave_normalizer(fg_masks)\n        else:\n            num_fgs = fg_masks.sum().item()\n        num_fgs = max(num_fgs, 1)\n\n        cls_pred = cls_pred.reshape(-1, self.num_classes - 1)\n        cls_loss = self.cls_loss(cls_pred[fg_masks], cls_targets, normalizer_override=num_fgs)\n\n        acc = self.get_acc(cls_pred[fg_masks], cls_targets)\n\n        loc_target = reg_targets.reshape(-1, 4)\n        loc_pred = loc_pred.reshape(-1, 4)\n        # loc_preds [xc, yc, w, h] -> [x1, y1, x2, y2]\n        loc_pred_x1 = loc_pred[:, 0] - loc_pred[:, 2] / 2","limited":true,"property":false},"up/tasks/det/plugins/yolox/models/postprocess/yolox_postprocess.py::YoloxPostProcess.get_acc":{"id":"up/tasks/det/plugins/yolox/models/postprocess/yolox_postprocess.py::YoloxPostProcess.get_acc","name":"YoloxPostProcess.get_acc","path":"up/tasks/det/plugins/yolox/models/postprocess/yolox_postprocess.py","line":119,"end":124,"meaning":"从训练分类预测和目标中计算一个训练用准确率。","kind":"compute","hardware":"topk 等；它不是整个 COCO 验证集的 AP。","url":"https://github.com/ModelTC/United-Perception/blob/52aaeb9ed27a490820696d7754d19f98cd6ecd11/up/tasks/det/plugins/yolox/models/postprocess/yolox_postprocess.py#L119","code":"    def get_acc(self, cls_pred, cls_targets):\n        max_value, cls_targets_acc = cls_targets.topk(1, 1, True, True)\n        cls_targets_acc += 1\n        cls_targets_acc[max_value == 0] = 0\n        acc = A.accuracy_v2(cls_pred, cls_targets_acc, activation_type='qfl')\n        return acc","limited":false,"property":false},"up/tasks/det/plugins/yolox/models/postprocess/yolox_postprocess.py::YoloxPostProcess.get_ave_normalizer":{"id":"up/tasks/det/plugins/yolox/models/postprocess/yolox_postprocess.py::YoloxPostProcess.get_ave_normalizer","name":"YoloxPostProcess.get_ave_normalizer","path":"up/tasks/det/plugins/yolox/models/postprocess/yolox_postprocess.py","line":184,"end":190,"meaning":"统计并同步正样本数量，用它归一化损失。","kind":"comm","hardware":"Tensor.sum、allreduce、item。","url":"https://github.com/ModelTC/United-Perception/blob/52aaeb9ed27a490820696d7754d19f98cd6ecd11/up/tasks/det/plugins/yolox/models/postprocess/yolox_postprocess.py#L184","code":"    def get_ave_normalizer(self, _mask):\n        ave_mask = torch.sum(_mask)\n        if env.world_size > 1:\n            allreduce(ave_mask)\n        num_gpus = env.world_size\n        ave_normalizer = max(ave_mask.item(), 1) / float(num_gpus)\n        return ave_normalizer","limited":false,"property":false},"up/tasks/det/plugins/yolox/models/postprocess/yolox_postprocess.py::YoloxPostProcess.apply_activation":{"id":"up/tasks/det/plugins/yolox/models/postprocess/yolox_postprocess.py::YoloxPostProcess.apply_activation","name":"YoloxPostProcess.apply_activation","path":"up/tasks/det/plugins/yolox/models/postprocess/yolox_postprocess.py","line":54,"end":66,"meaning":"把分类和目标置信度转成概率，并相乘得到候选框得分。","kind":"compute","hardware":"sigmoid、Tensor 乘法。","url":"https://github.com/ModelTC/United-Perception/blob/52aaeb9ed27a490820696d7754d19f98cd6ecd11/up/tasks/det/plugins/yolox/models/postprocess/yolox_postprocess.py#L54","code":"    def apply_activation(self, mlvl_preds):\n        \"\"\"apply activation on permuted class prediction\n        Arguments:\n            - mlvl_pred (list (levels) of tuple (predictions) of Tensor): first element must\n            be permuted class prediction with last dimension be class dimension\n        \"\"\"\n        mlvl_activated_preds = []\n        for lvl_idx, preds in enumerate(mlvl_preds):\n            cls_pred = preds[0].sigmoid()\n            obj_pred = preds[2].sigmoid()\n            cls_pred *= obj_pred\n            mlvl_activated_preds.append((cls_pred, *preds[1:]))\n        return mlvl_activated_preds","limited":false,"property":false},"up/tasks/det/plugins/yolox/models/postprocess/roi_supervisor.py::OTASupervisor.get_targets":{"id":"up/tasks/det/plugins/yolox/models/postprocess/roi_supervisor.py::OTASupervisor.get_targets","name":"OTASupervisor.get_targets","path":"up/tasks/det/plugins/yolox/models/postprocess/roi_supervisor.py","line":39,"end":107,"meaning":"逐张图片做匹配，再生成分类、回归、置信度目标和前景掩码。","kind":"compute","hardware":"原版捕获 RuntimeError 后有 CPU 匹配重试分支；这是原有逻辑。","url":"https://github.com/ModelTC/United-Perception/blob/52aaeb9ed27a490820696d7754d19f98cd6ecd11/up/tasks/det/plugins/yolox/models/postprocess/roi_supervisor.py#L39","code":"    @torch.no_grad()\n    def get_targets(self, locations, input, mlvl_preds):\n        cls_targets = []\n        reg_targets = []\n        obj_targets = []\n        ori_reg_targets = []\n        fg_masks = []\n\n        # process mlvl_preds: --> [B, A, 85]\n        mlvl_preds = [torch.cat(preds, dim=-1) for preds in mlvl_preds]\n        mlvl_preds = torch.cat(mlvl_preds, dim=1)  # [B, A, 85]\n\n        gt_bboxes = input['gt_bboxes']\n        strides = input['strides']\n        # center points\n        num_points_per_level = [len(p) for p in locations]\n        points = torch.cat(locations, dim=0)  # [A, 2]\n\n        # batch size\n        B = len(gt_bboxes)\n\n        num_gts = 0.0\n        num_fgs = 0.0\n        for b_ix in range(B):\n            gts = gt_bboxes[b_ix]    # [G, 5]\n            num_gts += len(gts)\n            preds = mlvl_preds[b_ix]  # [A, 85]\n            if gts.shape[0] > 0:\n                try:\n                    img_size = input['image_info'][b_ix][:2]\n                    num_fg, gt_matched_classes, pred_ious_this_matching, matched_gt_inds, fg_mask, expanded_strides = \\\n                        self.matcher.match(gts, preds, points, num_points_per_level, strides, img_size=img_size)","limited":true,"property":false},"up/tasks/det/plugins/yolox/models/postprocess/roi_supervisor.py::OTASupervisor.get_l1_target":{"id":"up/tasks/det/plugins/yolox/models/postprocess/roi_supervisor.py::OTASupervisor.get_l1_target","name":"OTASupervisor.get_l1_target","path":"up/tasks/det/plugins/yolox/models/postprocess/roi_supervisor.py","line":22,"end":36,"meaning":"把真实框换算为 L1 分支需要的中心点、对数宽高目标。","kind":"compute","hardware":"仅开启 L1 时使用的 Tensor 运算。","url":"https://github.com/ModelTC/United-Perception/blob/52aaeb9ed27a490820696d7754d19f98cd6ecd11/up/tasks/det/plugins/yolox/models/postprocess/roi_supervisor.py#L22","code":"    def get_l1_target(self, gts_xyxy, points_stride, strides, eps=1e-8):\n        gts = gts_xyxy.clone()\n        gts[:, 0] = (gts_xyxy[:, 0] + gts_xyxy[:, 2]) / 2\n        gts[:, 1] = (gts_xyxy[:, 1] + gts_xyxy[:, 3]) / 2\n        gts[:, 2] = gts_xyxy[:, 2] - gts_xyxy[:, 0]\n        gts[:, 3] = gts_xyxy[:, 3] - gts_xyxy[:, 1]\n        points = points_stride.clone() / strides.unsqueeze(-1)\n        x_shifts = points[:, 0]\n        y_shifts = points[:, 1]\n        l1_target = gts.new_zeros((gts.shape[0], 4))\n        l1_target[:, 0] = gts[:, 0] / strides - x_shifts\n        l1_target[:, 1] = gts[:, 1] / strides - y_shifts\n        l1_target[:, 2] = torch.log(gts[:, 2] / strides + eps)\n        l1_target[:, 3] = torch.log(gts[:, 3] / strides + eps)\n        return l1_target","limited":false,"property":false},"up/tasks/det/plugins/yolox/models/postprocess/roi_supervisor.py::OTAMatcher.match":{"id":"up/tasks/det/plugins/yolox/models/postprocess/roi_supervisor.py::OTAMatcher.match","name":"OTAMatcher.match","path":"up/tasks/det/plugins/yolox/models/postprocess/roi_supervisor.py","line":120,"end":196,"meaning":"筛选候选点，计算类别和 IoU 代价，再执行动态正样本分配。","kind":"compute","hardware":"含 torch.cuda.amp.autocast(enabled=False)、IoU、BCE、log。","url":"https://github.com/ModelTC/United-Perception/blob/52aaeb9ed27a490820696d7754d19f98cd6ecd11/up/tasks/det/plugins/yolox/models/postprocess/roi_supervisor.py#L120","code":"    @torch.no_grad()\n    def match(self, gts, preds, points, num_points_per_level, strides, mode='cuda', img_size=[]):\n        ''' points: [A, 2] || gts: [G, 5] || preds: [A, 85]\n        num_points_per_level:  [15808, 3952, 988, 247, 70]\n        strides: [8, 16, 32, 64, 128]'''\n        G = len(gts)\n        if mode == 'cpu':\n            logger.info('------------CPU Mode for This Batch-------------')\n            gts = gts.cpu()\n            points = points.cpu()\n\n        gt_labels = gts[:, 4]   # [G, 1]\n        gt_bboxes = gts[:, :4]  # [G, 4]\n\n        if self.center_sample:\n            fg_mask, is_in_boxes_and_center, expanded_strides = self.get_sample_region(\n                gt_bboxes, strides, points, num_points_per_level, img_size)\n        else:\n            assert \"Not implement\"\n\n        if fg_mask.sum() <= 1e-6:\n            logger.info('no gt in center')\n            return 0, None, None, None, None, None\n\n        masked_preds = preds[fg_mask]\n        if mode == 'cpu':\n            masked_preds = masked_preds.cpu()\n\n        preds_cls = masked_preds[:, :self.num_classes]\n        preds_box = masked_preds[:, self.num_classes:-1]  # [A', 4]\n        preds_obj = masked_preds[:, -1:]\n","limited":true,"property":false},"up/tasks/det/plugins/yolox/models/postprocess/roi_supervisor.py::OTAMatcher.match.decode_ota_box":{"id":"up/tasks/det/plugins/yolox/models/postprocess/roi_supervisor.py::OTAMatcher.match.decode_ota_box","name":"OTAMatcher.match.decode_ota_box","path":"up/tasks/det/plugins/yolox/models/postprocess/roi_supervisor.py","line":151,"end":156,"meaning":"把中心点和宽高预测转换成 x1/y1/x2/y2，供 IoU 比较。","kind":"compute","hardware":"加减乘除和 torch.stack。","url":"https://github.com/ModelTC/United-Perception/blob/52aaeb9ed27a490820696d7754d19f98cd6ecd11/up/tasks/det/plugins/yolox/models/postprocess/roi_supervisor.py#L151","code":"        def decode_ota_box(preds):\n            x1 = preds[:, 0] - preds[:, 2] / 2\n            y1 = preds[:, 1] - preds[:, 3] / 2\n            x2 = preds[:, 0] + preds[:, 2] / 2\n            y2 = preds[:, 1] + preds[:, 3] / 2\n            return torch.stack([x1, y1, x2, y2], -1)","limited":false,"property":false},"up/tasks/det/plugins/yolox/models/postprocess/roi_supervisor.py::OTAMatcher.get_sample_region":{"id":"up/tasks/det/plugins/yolox/models/postprocess/roi_supervisor.py::OTAMatcher.get_sample_region","name":"OTAMatcher.get_sample_region","path":"up/tasks/det/plugins/yolox/models/postprocess/roi_supervisor.py","line":198,"end":254,"meaning":"按真实框和中心区域，筛出值得进一步比较的候选点。","kind":"compute","hardware":"比较、逻辑掩码和坐标计算。","url":"https://github.com/ModelTC/United-Perception/blob/52aaeb9ed27a490820696d7754d19f98cd6ecd11/up/tasks/det/plugins/yolox/models/postprocess/roi_supervisor.py#L198","code":"    def get_sample_region(self, gt_bboxes, strides, points, num_points_per_level, img_size):\n        G = gt_bboxes.shape[0]  # num_gts\n        A = points.shape[0]     # num_anchors\n        expanded_strides = torch.zeros(1, points.shape[0]).to(dtype=points.dtype, device=points.device)\n\n        beg = 0\n        for l_ix in range(len(num_points_per_level)):\n            end = beg + num_points_per_level[l_ix]\n            expanded_strides[0][beg:end] = strides[l_ix]\n            beg += num_points_per_level[l_ix]\n\n        x_center = points[:, 0].unsqueeze(0).repeat(G, 1) + 0.5 * expanded_strides  # [G, A]\n        y_center = points[:, 1].unsqueeze(0).repeat(G, 1) + 0.5 * expanded_strides  # [G, A]\n\n        # x1, x2, y1, y2\n        gt_bboxes_l = (gt_bboxes[:, 0]).unsqueeze(1).repeat(1, A)  # [G, A]\n        gt_bboxes_r = (gt_bboxes[:, 2]).unsqueeze(1).repeat(1, A)  # [G, A]\n        gt_bboxes_t = (gt_bboxes[:, 1]).unsqueeze(1).repeat(1, A)  # [G, A]\n        gt_bboxes_b = (gt_bboxes[:, 3]).unsqueeze(1).repeat(1, A)  # [G, A]\n\n        b_l = x_center - gt_bboxes_l  # [G, A]\n        b_r = gt_bboxes_r - x_center  # [G, A]\n        b_t = y_center - gt_bboxes_t  # [G, A]\n        b_b = gt_bboxes_b - y_center  # [G, A]\n        bbox_deltas = torch.stack([b_l, b_t, b_r, b_b], 2)   # [G, A, 4]\n        is_in_boxes = bbox_deltas.min(dim=-1).values > 0.0   # [G, A]\n        is_in_boxes_all = is_in_boxes.sum(dim=0) > 0         # [A]\n\n        center_radius = self.radius\n\n        gt_bboxes_cx = (gt_bboxes[:, 0] + gt_bboxes[:, 2]) / 2\n        gt_bboxes_cy = (gt_bboxes[:, 1] + gt_bboxes[:, 3]) / 2","limited":true,"property":false},"up/tasks/det/plugins/yolox/models/postprocess/roi_supervisor.py::OTAMatcher.dynamic_k_matching":{"id":"up/tasks/det/plugins/yolox/models/postprocess/roi_supervisor.py::OTAMatcher.dynamic_k_matching","name":"OTAMatcher.dynamic_k_matching","path":"up/tasks/det/plugins/yolox/models/postprocess/roi_supervisor.py","line":256,"end":286,"meaning":"按每个物体的匹配质量决定正样本数量；出现冲突时选代价更低的匹配。","kind":"compute","hardware":"topk、sum、min、argmax、索引写入；含 item 的主机读取。","url":"https://github.com/ModelTC/United-Perception/blob/52aaeb9ed27a490820696d7754d19f98cd6ecd11/up/tasks/det/plugins/yolox/models/postprocess/roi_supervisor.py#L256","code":"    def dynamic_k_matching(self, cost, pair_wise_ious, gt_classes, num_gt, fg_mask):\n        matching_matrix = torch.zeros_like(cost)  # [G, A']\n\n        ious_in_boxes_matrix = pair_wise_ious    # [G, A']\n        n_candidate_k = min(self.candidate_k, ious_in_boxes_matrix.size(1))\n        topk_ious, _ = torch.topk(ious_in_boxes_matrix, n_candidate_k, dim=1)\n        dynamic_ks = torch.clamp(topk_ious.sum(1).int(), min=1)  # , max=A_-1)\n        for gt_idx in range(num_gt):\n            _, pos_idx = torch.topk(\n                cost[gt_idx], k=dynamic_ks[gt_idx].item(), largest=False\n            )\n            matching_matrix[gt_idx][pos_idx] = 1.0\n\n        del topk_ious, dynamic_ks, pos_idx\n\n        anchor_matching_gt = matching_matrix.sum(0)    # [A']  wether matched\n        if (anchor_matching_gt > 1).sum() > 0:\n            cost_min, cost_argmin = torch.min(cost[:, anchor_matching_gt > 1], dim=0)\n            matching_matrix[:, anchor_matching_gt > 1] *= 0.0\n            matching_matrix[cost_argmin, anchor_matching_gt > 1] = 1.0\n        fg_mask_inboxes = matching_matrix.sum(0) > 0.0\n        num_fg = fg_mask_inboxes.sum().item()\n\n        fg_mask[fg_mask.clone()] = fg_mask_inboxes\n\n        matched_gt_inds = matching_matrix[:, fg_mask_inboxes].argmax(0)\n        gt_matched_classes = gt_classes[matched_gt_inds]\n\n        pred_ious_this_matching = (matching_matrix * pair_wise_ious).sum(0)[fg_mask_inboxes]\n\n        return num_fg, gt_matched_classes, pred_ious_this_matching, matched_gt_inds","limited":false,"property":false},"up/tasks/det/models/utils/bbox_helper.py::bbox_iou_overlaps":{"id":"up/tasks/det/models/utils/bbox_helper.py::bbox_iou_overlaps","name":"bbox_iou_overlaps","path":"up/tasks/det/models/utils/bbox_helper.py","line":42,"end":63,"meaning":"计算两组框的 IoU；按设备、对齐方式和显存，选择原版实现分支。","kind":"mixed","hardware":"NVIDIA 路径查询显存并可能调用 GPU 扩展；也有原有 CPU 分支。","url":"https://github.com/ModelTC/United-Perception/blob/52aaeb9ed27a490820696d7754d19f98cd6ecd11/up/tasks/det/models/utils/bbox_helper.py#L42","code":"@allow_empty_tensor(2)\n@to_float32\ndef bbox_iou_overlaps(b1, b2, aligned=False):\n    if not b1.is_cuda or aligned:\n        return vanilla_bbox_iou_overlaps(b1, b2, aligned)\n\n    global GPU_MEMORY\n    gbytes = 1024.0**3\n    if GPU_MEMORY is None:\n        GPU_MEMORY = torch.cuda.get_device_properties(b1.device.index).total_memory\n    alloated_memory = torch.cuda.memory_allocated()\n    spare_memory = 0.5 * gbytes\n    available_memory = GPU_MEMORY - alloated_memory - spare_memory\n    size = b1.shape[0] * b2.shape[0]\n    needed_memory = 2 * size * 4\n\n    if needed_memory < available_memory:\n        ious = gpu_iou_overlap(b1, b2, mode='IoU')\n    else:\n        ious = vanilla_bbox_iou_overlaps(b1.cpu(), b2.cpu())\n        res_memory = size * 4\n        if res_memory < available_memory:\n            ious = ious.to(b1.device)\n    return ious","limited":false,"property":false},"up/tasks/det/models/utils/bbox_helper.py::vanilla_bbox_iou_overlaps":{"id":"up/tasks/det/models/utils/bbox_helper.py::vanilla_bbox_iou_overlaps","name":"vanilla_bbox_iou_overlaps","path":"up/tasks/det/models/utils/bbox_helper.py","line":68,"end":98,"meaning":"用普通 Tensor 运算计算框交集与并集，再得到 IoU。","kind":"compute","hardware":"运算设备随输入 Tensor；不是名字叫 vanilla 就一定在 CPU。","url":"https://github.com/ModelTC/United-Perception/blob/52aaeb9ed27a490820696d7754d19f98cd6ecd11/up/tasks/det/models/utils/bbox_helper.py#L68","code":"@allow_empty_tensor(2)\n@to_float32\ndef vanilla_bbox_iou_overlaps(b1, b2, aligned=False, return_union=False):\n    \"\"\"\n    Arguments:\n        b1: dts, [n, >=4] (x1, y1, x2, y2, ...)\n        b1: gts, [n, >=4] (x1, y1, x2, y2, ...)\n\n    Returns:\n        intersection-over-union pair-wise.\n    \"\"\"\n    area1 = (b1[:, 2] - b1[:, 0] + ALIGNED_FLAG.offset) * (b1[:, 3] - b1[:, 1] + ALIGNED_FLAG.offset)\n    area2 = (b2[:, 2] - b2[:, 0] + ALIGNED_FLAG.offset) * (b2[:, 3] - b2[:, 1] + ALIGNED_FLAG.offset)\n    if aligned:\n        assert b1.size(0) == b2.size(0)\n        if b1.size(0) * b2.size(0) == 0:\n            return b1.new_zeros(b1.size(0), 1)\n        lt = torch.max(b1[:, :2], b2[:, :2])  # [rows, 2]\n        rb = torch.min(b1[:, 2:], b2[:, 2:])  # [rows, 2]\n        wh = (rb - lt + ALIGNED_FLAG.offset).clamp(min=0)  # [rows, 2]\n        overlap = wh[:, 0] * wh[:, 1]\n        union = area1 + area2 - overlap\n        union = torch.max(union, union.new_tensor([1e-6]))\n        return overlap / union\n    lt = torch.max(b1[:, None, :2], b2[:, :2])\n    rb = torch.min(b1[:, None, 2:4], b2[:, 2:4])\n    wh = (rb - lt + ALIGNED_FLAG.offset).clamp(min=0)\n    inter_area = wh[:, :, 0] * wh[:, :, 1]\n    union_area = area1[:, None] + area2 - inter_area\n    if return_union:\n        return inter_area / torch.clamp(union_area, min=ALIGNED_FLAG.offset), union_area\n    else:","limited":true,"property":false},"up/extensions/python/iou_overlap.py::gpu_iou_overlap":{"id":"up/extensions/python/iou_overlap.py::gpu_iou_overlap","name":"gpu_iou_overlap","path":"up/extensions/python/iou_overlap.py","line":5,"end":24,"meaning":"整理输入和输出缓冲区，再调用原版的 C++/CUDA IoU 扩展。","kind":"compute","hardware":"overlaps.iou(...)，原版明确检查 is_cuda。","url":"https://github.com/ModelTC/United-Perception/blob/52aaeb9ed27a490820696d7754d19f98cd6ecd11/up/extensions/python/iou_overlap.py#L5","code":"def gpu_iou_overlap(b1, b2, mode='IoU'):\n    \"\"\"compute IoU/IoF/IoS between b1 and b2\n    Args:\n        b1: Tensor, [N, >=4]\n        b2: Tensor, [M, >=4]\n        mode: str, {IoU, IoF, IoS} Interse
