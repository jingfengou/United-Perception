s, kernel_size=kernel_size,\n        stride=stride, padding=padding, dilation=dilation,\n        groups=groups, bias=(normalize is None))\n\n    # for compability\n    if (normalize is None) and (not activation):\n        return conv\n\n    seq = nn.Sequential()\n    if relu_first and activation:\n        seq.add_module('relu', nn.ReLU(inplace=True))\n    seq.add_module('conv', conv)\n    if normalize is not None:\n        norm_name, norm = build_norm_layer(out_channels, normalize)\n        seq.add_module(norm_name, norm)\n    if activation:\n        if not relu_first:\n            seq.add_module('relu', nn.ReLU(inplace=True))\n    return seq","limited":false,"property":false},"up/runner/base_runner.py::BaseRunner.prepare_fp16":{"id":"up/runner/base_runner.py::BaseRunner.prepare_fp16","name":"BaseRunner.prepare_fp16","path":"up/runner/base_runner.py","line":65,"end":74,"meaning":"runtime.fp16 开启时准备混合精度；PyTorch 路线创建 GradScaler。","kind":"runtime","hardware":"torch.cuda.amp.GradScaler；实际 autocast 在训练 forward 中。","url":"https://github.com/ModelTC/United-Perception/blob/52aaeb9ed27a490820696d7754d19f98cd6ecd11/up/runner/base_runner.py#L65","code":"    def prepare_fp16(self):\n        if self.config['runtime'].get('fp16', False):\n            if self.backend == 'dist':\n                self.scaler = torch.cuda.amp.GradScaler(enabled=True)\n            else:\n                register_float_module(self.config['runtime']['fp16'].get('keep_batchnorm_fp32', True))\n                loss_scale = self.config['runtime']['fp16'].get('scale_factor', 'dynamic')\n                self.config['trainer']['optimizer']['kwargs']['loss_scale'] = loss_scale\n            self.fp16 = True\n            FP16_FLAG.fp16 = True","limited":false,"property":false},"up/runner/base_runner.py::BaseRunner.build_trainer":{"id":"up/runner/base_runner.py::BaseRunner.build_trainer","name":"BaseRunner.build_trainer","path":"up/runner/base_runner.py","line":299,"end":332,"meaning":"创建优化器、学习率调度器，计算总步数和验证、保存频率。","kind":"cpu","hardware":"--evaluate 时不创建训练用优化器。","url":"https://github.com/ModelTC/United-Perception/blob/52aaeb9ed27a490820696d7754d19f98cd6ecd11/up/runner/base_runner.py#L299","code":"    def build_trainer(self):\n        if not self.training:\n            return\n        cfg_trainer = self.config['trainer']\n        self.optimizer = self.build_optimizer(cfg_trainer['optimizer'])\n        self.lr_scheduler = self.build_lr_scheduler(cfg_trainer['lr_scheduler'])\n        _freq_base = 1\n        _start_base = 1\n        if self.iter_base:\n            _freq_base = 5000\n        self.test_freq = cfg_trainer.get('test_freq', _freq_base)\n        logger.info(f\"test_freq: {self.test_freq}\")\n        self.test_start = cfg_trainer.get('test_start', _start_base)\n        logger.info(f\"test_start: {self.test_start}\")\n        self.save_freq = cfg_trainer.get('save_freq', _freq_base)\n        logger.info(f\"save_freq: {self.save_freq}\")\n        self.save_start = cfg_trainer.get('save_start', _start_base)\n        self.only_save_latest = cfg_trainer.get('only_save_latest', self.config['saver'].get('only_save_latest', False))\n        if not self.iter_base:\n            _save_latest_freq = cfg_trainer.get('save_latest_freq', self.config['saver'].get('save_latest_freq', 1))\n            save_latest_freq = int(_save_latest_freq) * self.train_epoch_size\n        else:\n            _save_latest_freq = cfg_trainer.get('save_latest_freq',\n                                                self.config['saver'].get('save_latest_freq', self.train_epoch_size))\n            save_latest_freq = int(_save_latest_freq)\n        self.save_latest_freq = cfg_trainer.get('save_latest_freq', save_latest_freq)\n        logger.info(f'only save latest: {self.only_save_latest}')\n        logger.info(f'save latest freq: {self.save_latest_freq}')\n        logger.info(f\"save_start: {self.save_start}\")\n        max_epoch = cfg_trainer.get('max_epoch', 0)\n        self.max_iter = cfg_trainer.get('max_iter', int(max_epoch * self.train_epoch_size))\n        logger.info(f\"max_iter: {self.max_iter}\")","limited":true,"property":false},"up/runner/base_runner.py::BaseRunner.update_optimizer_cfg":{"id":"up/runner/base_runner.py::BaseRunner.update_optimizer_cfg","name":"BaseRunner.update_optimizer_cfg","path":"up/runner/base_runner.py","line":112,"end":124,"meaning":"根据是否开启 FP16 及 backend，调整优化器配置；普通 PyTorch 路线保留原配置。","kind":"cpu","hardware":"原版中另有旧后端的融合优化器分支。","url":"https://github.com/ModelTC/United-Perception/blob/52aaeb9ed27a490820696d7754d19f98cd6ecd11/up/runner/base_runner.py#L112","code":"    def update_optimizer_cfg(self, cfg_optimizer):\n        if not self.fp16:\n            return cfg_optimizer\n        if self.backend == 'dist':\n            return cfg_optimizer\n        elif self.backend == 'linklink':\n            if cfg_optimizer['type'] == 'SGD':\n                cfg_optimizer['type'] = 'FusedFP16SGD'\n            if cfg_optimizer['type'] == 'AdamW':\n                cfg_optimizer['type'] = 'FusedFP16AdamW'\n            return cfg_optimizer\n        else:\n            raise NotImplementedError","limited":false,"property":false},"up/runner/base_runner.py::BaseRunner.build_optimizer":{"id":"up/runner/base_runner.py::BaseRunner.build_optimizer","name":"BaseRunner.build_optimizer","path":"up/runner/base_runner.py","line":126,"end":130,"meaning":"选择优化器构建器并传入模型，让它创建真正的优化器。","kind":"cpu","hardware":"参数已在 GPU 上；此处主要做分组和对象创建。","url":"https://github.com/ModelTC/United-Perception/blob/52aaeb9ed27a490820696d7754d19f98cd6ecd11/up/runner/base_runner.py#L126","code":"    def build_optimizer(self, cfg_optimizer):\n        register_type = cfg_optimizer.pop('register_type', 'base')\n        cfg_optimizer = self.update_optimizer_cfg(cfg_optimizer)\n        optimizer_ins = OPTIMIZER_REGISTRY[register_type](cfg_optimizer, self.model)\n        return optimizer_ins.build_optimizer()","limited":false,"property":false},"up/runner/base_runner.py::BaseRunner.build_lr_scheduler":{"id":"up/runner/base_runner.py::BaseRunner.build_lr_scheduler","name":"BaseRunner.build_lr_scheduler","path":"up/runner/base_runner.py","line":132,"end":144,"meaning":"把每轮步数、总 batch 等交给学习率构建器。","kind":"cpu","hardware":"影响学习率缩放和调度，不执行网络计算。","url":"https://github.com/ModelTC/United-Perception/blob/52aaeb9ed27a490820696d7754d19f98cd6ecd11/up/runner/base_runner.py#L132","code":"    def build_lr_scheduler(self, cfg_lr_scheduler):\n        batch_size = self.train_batch_size\n        train_epoch_size = self.train_epoch_size\n        if self.iter_base:\n            train_epoch_size = 1\n            logger.info(\"using iter_base, data_size are set to 1\")\n        register_type = cfg_lr_scheduler.pop('lr_register_type', 'base')\n        lr_scheduler_ins = LR_SCHEDULER_REGISTY[register_type](cfg_lr_scheduler,\n                                                               self.optimizer,\n                                                               train_epoch_size,\n                                                               env.world_size * batch_size)\n\n        return lr_scheduler_ins.build_scheduler()","limited":false,"property":false},"up/utils/model/optimizer_helper.py::BaseOptimizer.build_optimizer":{"id":"up/utils/model/optimizer_helper.py::BaseOptimizer.build_optimizer","name":"BaseOptimizer.build_optimizer","path":"up/utils/model/optimizer_helper.py","line":151,"end":154,"meaning":"复制优化器配置，填入需要训练的参数，再创建优化器。","kind":"cpu","hardware":"继续调用 get_trainable_params() 和 get_optimizer()。","url":"https://github.com/ModelTC/United-Perception/blob/52aaeb9ed27a490820696d7754d19f98cd6ecd11/up/utils/model/optimizer_helper.py#L151","code":"    def build_optimizer(self):\n        cfg_optim = copy.deepcopy(self.cfg_optim)\n        cfg_optim['kwargs']['params'] = self.get_trainable_params(cfg_optim)\n        return self.get_optimizer(cfg_optim)","limited":false,"property":false},"up/utils/model/optimizer_helper.py::BaseOptimizer.get_trainable_params":{"id":"up/utils/model/optimizer_helper.py::BaseOptimizer.get_trainable_params","name":"BaseOptimizer.get_trainable_params","path":"up/utils/model/optimizer_helper.py","line":53,"end":70,"meaning":"筛出 requires_grad=True 的参数；按名称等规则分配不同参数组。","kind":"cpu","hardware":"可以给 backbone、bias 等设置不同学习率或权重衰减。","url":"https://github.com/ModelTC/United-Perception/blob/52aaeb9ed27a490820696d7754d19f98cd6ecd11/up/utils/model/optimizer_helper.py#L53","code":"    def get_trainable_params(self, cfg_optim=None):\n        special_param_group = cfg_optim.get('special_param_group', [])\n        pconfig = cfg_optim.get('pconfig', None)\n        if pconfig is not None:\n            return self.param_group_all(self.model, pconfig)\n        trainable_params = [{\"params\": []}]\n        for spg in special_param_group:\n            spg.update({'params': []})\n            trainable_params.append(spg)\n        for n, p in self.model.named_parameters():\n            if p.requires_grad:\n                gid = 0\n                for i, spg in enumerate(special_param_group):\n                    if spg['key'] in n:\n                        gid = i + 1\n                        break\n                trainable_params[gid][\"params\"].append(p)\n        return trainable_params","limited":false,"property":false},"up/utils/model/optimizer_helper.py::BaseOptimizer.param_group_all":{"id":"up/utils/model/optimizer_helper.py::BaseOptimizer.param_group_all","name":"BaseOptimizer.param_group_all","path":"up/utils/model/optimizer_helper.py","line":72,"end":131,"meaning":"配置 pconfig 时，按 BN、Linear、LayerNorm、层编号等细分参数组。","kind":"cpu","hardware":"分组逻辑，不是 GPU 更新。","url":"https://github.com/ModelTC/United-Perception/blob/52aaeb9ed27a490820696d7754d19f98cd6ecd11/up/utils/model/optimizer_helper.py#L72","code":"    def param_group_all(self, model, config):\n        pgroup = {}\n        param_groups_dict = {}\n        nodecay = config.pop('nodecay', [])\n        layer_decay = config.pop('layer_decay', None)\n        key2type = {\n            'bn_b': torch.nn.BatchNorm2d,\n            'bn_w': torch.nn.BatchNorm2d,\n            'ln_b': torch.nn.LayerNorm,\n            'ln_w': torch.nn.LayerNorm,\n            'linear_w': torch.nn.Linear,\n            'linear_b': torch.nn.Linear\n        }\n        # Handel Layer Decay\n        if layer_decay is not None:\n            if layer_decay['type'] == 'vit_base':\n                num_layers = model.backbone.num_layers\n                layer_scales = list(layer_decay['value'] ** (num_layers - i) for i in range(num_layers + 1))\n            else:\n                raise NotImplementedError(f\"Not support for layer decay type: {layer_decay['type']}\")\n\n        for group_keys in config.keys():\n            if group_keys not in pgroup:\n                pgroup[group_keys] = []\n\n        for name, m in model.named_modules():\n            for group_keys in config.keys():\n                if isinstance(m, key2type[group_keys]):\n                    if config[group_keys]['type'] == 'bias':\n                        pgroup[group_keys].append(m.bias)\n                    elif config[group_keys]['type'] == 'weight':\n                        pgroup[group_keys].append(m.weight)","limited":true,"property":false},"up/utils/model/optimizer_helper.py::BaseOptimizer.get_optimizer":{"id":"up/utils/model/optimizer_helper.py::BaseOptimizer.get_optimizer","name":"BaseOptimizer.get_optimizer","path":"up/utils/model/optimizer_helper.py","line":133,"end":149,"meaning":"按名字创建 torch.optim 的 SGD/AdamW 等，或 UP 的 LARS/LAMB 等实现。","kind":"cpu","hardware":"真正改动 GPU 参数要等 optimizer.step()。","url":"https://github.com/ModelTC/United-Perception/blob/52aaeb9ed27a490820696d7754d19f98cd6ecd11/up/utils/model/optimizer_helper.py#L133","code":"    def get_optimizer(self, cfg_optim):\n        optim_type = cfg_optim['type']\n        if optim_type == 'FusedFP16SGD' or optim_type == 'FusedFP16AdamW' or optim_type == 'FusedZeroFP16AdamW':\n            from spring import linklink\n            if optim_type == 'FusedFP16SGD':\n                linklink.optim.FusedFP16SGD.reload = fused_sgd_reload\n            if optim_type == 'FusedFP16AdamW':\n                linklink.optim.FusedFP16AdamW.reload = fused_sgd_reload\n            if optim_type == 'FusedZeroFP16AdamW':\n                linklink.optim.FusedZeroFP16AdamW.reload = fused_sgd_reload\n            optimizer = build_cls_instance(linklink.optim, cfg_optim)\n        elif optim_type == 'LARS' or optim_type == 'LAMB':\n            optimizer = build_cls_instance(optim, cfg_optim)\n        else:\n            optimizer = build_cls_instance(torch.optim, cfg_optim)\n        logger.info('build optimizer done')\n        return optimizer","limited":false,"property":false},"up/utils/model/optimizer_helper.py::build_cls_instance":{"id":"up/utils/model/optimizer_helper.py::build_cls_instance","name":"build_cls_instance","path":"up/utils/model/optimizer_helper.py","line":18,"end":21,"meaning":"从指定模块取出配置要求的类，再用 kwargs 创建对象。","kind":"cpu","hardware":"优化器构建器内部使用的小工具。","url":"https://github.com/ModelTC/United-Perception/blob/52aaeb9ed27a490820696d7754d19f98cd6ecd11/up/utils/model/optimizer_helper.py#L18","code":"def build_cls_instance(module, cfg):\n    \"\"\"Build instance for given cls\"\"\"\n    cls = getattr(module, cfg['type'])\n    return cls(**cfg['kwargs'])","limited":false,"property":false},"up/utils/model/lr_helper.py::BaseLRScheduler.build_scheduler":{"id":"up/utils/model/lr_helper.py::BaseLRScheduler.build_scheduler","name":"BaseLRScheduler.build_scheduler","path":"up/utils/model/lr_helper.py","line":222,"end":255,"meaning":"把 warmup 和正常学习率曲线接成一个按 iteration 更新的调度器。","kind":"cpu","hardware":"返回 ChainIterLR。","url":"https://github.com/ModelTC/United-Perception/blob/52aaeb9ed27a490820696d7754d19f98cd6ecd11/up/utils/model/lr_helper.py#L222","code":"    def build_scheduler(self):\n        standard_scheduler_class = LR_REGISTRY.get(self.cfg_scheduler['type'])\n        self.update_scheduler_kwargs()\n        warmup_register_type = self.cfg_scheduler.get('warmup_register_type', 'base')\n        warmup_register_ins = WARM_SCHEDULER_REGISTY[warmup_register_type](self.cfg_scheduler,\n                                                                           self.optimizer,\n                                                                           self.data_size,\n                                                                           self.lr_scale)\n        warmup_scheduler, warmup_initial_lr = warmup_register_ins.build_warmup_scheduler()\n\n        class ChainIterLR(standard_scheduler_class):\n            \"\"\"Unified scheduler that chains warmup scheduler and standard scheduler\n            \"\"\"\n\n            def __init__(self, *args, **kwargs):\n                super(ChainIterLR, self).__init__(*args, **kwargs)\n\n            def get_lr(self):\n                if self.last_iter < warmup_scheduler.warmup_iter:\n                    self.base_lrs = warmup_initial_lr\n                    return warmup_scheduler.get_lr(self.last_iter, self.base_lrs, self.optimizer)\n                elif self.last_iter == warmup_scheduler.warmup_iter:\n                    self.base_lrs = list(map(lambda group: group['lr'], self.optimizer.param_groups))\n                    return super(ChainIterLR, self).get_lr()\n                else:\n                    return super(ChainIterLR, self).get_lr()\n\n            @property\n            def last_iter(self):\n                return self.last_epoch\n        if hasattr(standard_scheduler_class, 'warmup_iter') and not self.align:\n            self.cfg_scheduler['kwargs']['warmup_iter'] = warmup_scheduler.warmup_iter","limited":true,"property":false},"up/utils/model/lr_helper.py::BaseLRScheduler.update_scheduler_kwargs":{"id":"up/utils/model/lr_helper.py::BaseLRScheduler.update_scheduler_kwargs","name":"BaseLRScheduler.update_scheduler_kwargs","path":"up/utils/model/lr_helper.py","line":257,"end":262,"meaning":"把优化器和每轮步数填进标准调度器的参数。","kind":"cpu","hardware":"将按 epoch 写的配置换算到按步执行。","url":"https://github.com/ModelTC/United-Perception/blob/52aaeb9ed27a490820696d7754d19f98cd6ecd11/up/utils/model/lr_helper.py#L257","code":"    def update_scheduler_kwargs(self):\n        self.cfg_scheduler['kwargs']['optimizer'] = self.optimizer\n        self.cfg_scheduler['kwargs']['data_size'] = self.data_size\n        if self.cfg_scheduler.get('type') == 'SWALR':\n            total_lr = self.optimizer.param_groups[0]['lr'] * self.lr_scale\n            self.cfg_scheduler['kwargs'].setdefault(\"total_lr\", total_lr)","limited":false,"property":false},"up/utils/model/lr_helper.py::BaseWarmScheduler.build_warmup_scheduler":{"id":"up/utils/model/lr_helper.py::BaseWarmScheduler.build_warmup_scheduler","name":"BaseWarmScheduler.build_warmup_scheduler","path":"up/utils/model/lr_helper.py","line":166,"end":173,"meaning":"根据设置算起始/目标学习率，并创建预热曲线。","kind":"cpu","hardware":"训练早期逐渐提高学习率。","url":"https://github.com/ModelTC/United-Perception/blob/52aaeb9ed27a490820696d7754d19f98cd6ecd11/up/utils/model/lr_helper.py#L166","code":"    def build_warmup_scheduler(self):\n        self.get_init_lr()\n        self.get_target_lr()\n        self.get_warmup_initial_lr()\n        warm_kwargs = self.update_warmup_kwargs()\n        warmup_type = self.cfg_scheduler.get('warmup_type', 'exp')\n        warmup_cfg = self.get_warmup_cfg(warm_kwargs, warmup_type)\n        return WARM_LR_REGISTRY.build(warmup_cfg), self.warmup_initial_lr","limited":false,"property":false},"up/utils/model/lr_helper.py::BaseLRScheduler.build_scheduler.ChainIterLR.get_lr":{"id":"up/utils/model/lr_helper.py::BaseLRScheduler.build_scheduler.ChainIterLR.get_lr","name":"BaseLRScheduler.build_scheduler.ChainIterLR.get_lr","path":"up/utils/model/lr_helper.py","line":239,"end":247,"meaning":"每一步判断是否还处于 warmup，再返回当前学习率。","kind":"cpu","hardware":"不对模型 Tensor 做计算。","url":"https://github.com/ModelTC/United-Perception/blob/52aaeb9ed27a490820696d7754d19f98cd6ecd11/up/utils/model/lr_helper.py#L239","code":"            def get_lr(self):\n                if self.last_iter < warmup_scheduler.warmup_iter:\n                    self.base_lrs = warmup_initial_lr\n                    return warmup_scheduler.get_lr(self.last_iter, self.base_lrs, self.optimizer)\n                elif self.last_iter == warmup_scheduler.warmup_iter:\n                    self.base_lrs = list(map(lambda group: group['lr'], self.optimizer.param_groups))\n                    return super(ChainIterLR, self).get_lr()\n                else:\n                    return super(ChainIterLR, self).get_lr()","limited":false,"property":false},"up/runner/base_runner.py::BaseRunner.build_saver":{"id":"up/runner/base_runner.py::BaseRunner.build_saver","name":"BaseRunner.build_saver","path":"up/runner/base_runner.py","line":250,"end":266,"meaning":"创建管理权重和输出目录的 Saver。","kind":"cpu","hardware":"此时建立保存工具，不是开始保存模型。","url":"https://github.com/ModelTC/United-Perception/blob/52aaeb9ed27a490820696d7754d19f98cd6ecd11/up/runner/base_runner.py#L250","code":"    def build_saver(self):\n        cfg_saver = self.config['saver']\n        if 'kwargs' not in cfg_saver:\n            _cfg_saver = {\"type\": 'base', \"kwargs\": {}}\n            if 'type' in cfg_saver:\n                _cfg_saver['type'] = cfg_saver.pop('type')\n            _cfg_saver['kwargs']['save_cfg'] = cfg_saver\n            _cfg_saver['kwargs']['yml_path'] = self.args.get('config_path', None)\n            _cfg_saver['kwargs']['work_dir'] = self.work_dir\n            saver = SAVER_REGISTRY.build(_cfg_saver)\n            self.results_dir = cfg_saver.get('results_dir', 'results_dir')\n        else:\n            cfg_saver['kwargs']['yml_path'] = self.args.get('config_path', None)\n            cfg_saver['kwargs']['work_dir'] = self.work_dir\n            saver = SAVER_REGISTRY.build(cfg_saver)\n            self.results_dir = cfg_saver['kwargs']['save_cfg'].get('results_dir', 'results_dir')\n        self.saver = saver","limited":false,"property":false},"up/runner/base_runner.py::BaseRunner.build_hooks":{"id":"up/runner/base_runner.py::BaseRunner.build_hooks","name":"BaseRunner.build_hooks","path":"up/runner/base_runner.py","line":292,"end":297,"meaning":"创建日志、保存最佳权重等回调；纯评估时移除不适用的训练回调。","kind":"cpu","hardware":"调用 build_hooks()；具体回调会在训练各时点被触发。","url":"https://github.com/ModelTC/United-Perception/blob/52aaeb9ed27a490820696d7754d19f98cd6ecd11/up/runner/base_runner.py#L292","code":"    def build_hooks(self):\n        cfg_hooks = self.config.get('hooks', [])\n        if not self.training:\n            cfg_hooks = self._remove_hooks(cfg_hooks)\n        self._hooks = build_hooks(self, cfg_hooks, add_log_if_not_exists=True)\n        logger.info('build hooks done')","limited":false,"property":false},"up/runner/base_runner.py::BaseRunner._remove_hooks":{"id":"up/runner/base_runner.py::BaseRunner._remove_hooks","name":"BaseRunner._remove_hooks","path":"up/runner/base_runner.py","line":202,"end":213,"meaning":"评估模式下去掉自动续训、重建数据等训练专用回调。","kind":"cpu","hardware":"返回筛选后的 hook 配置。","url":"https://github.com/ModelTC/United-Perception/blob/52aaeb9ed27a490820696d7754d19f98cd6ecd11/up/runner/base_runner.py#L202","code":"    def _remove_hooks(self, cfg_hooks):\n        need_remove_hooks = ['auto_save_best', 'reload', 'auto_checkpoint', 'auto_save_best_multitask']\n        remove_set = set()\n        new_cfg_hooks = []\n        for idx, hook in enumerate(cfg_hooks):\n            for temp in need_remove_hooks:\n                if temp in hook['type']:\n                    remove_set.add(idx)\n        for idx, hook in enumerate(cfg_hooks):\n            if idx not in remove_set:\n                new_cfg_hooks.append(hook)\n        return new_cfg_hooks","limited":false,"property":false},"up/runner/base_runner.py::BaseRunner.build_ema":{"id":"up/runner/base_runner.py::BaseRunner.build_ema","name":"BaseRunner.build_ema","path":"up/runner/base_runner.py","line":283,"end":290,"meaning":"配置启用 EMA 时，创建一份用于平滑权重的模型副本。","kind":"transfer","hardware":"副本保留 GPU 参数和 buffer。","url":"https://github.com/ModelTC/United-Perception/blob/52aaeb9ed27a490820696d7754d19f98cd6ecd11/up/runner/base_runner.py#L283","code":"    def build_ema(self):\n        if self.config.get('ema', None) is None or not self.config['ema']['enable']:\n            self.ema = None\n            return\n        ema_config = copy.deepcopy(self.config['ema'])\n        ema_type = ema_config.get('ema_type', 'linear')\n        ema_config['kwargs']['model'] = self.build_fake_model()\n        self.ema = EMA_REGISTRY.get(ema_type)(**ema_config['kwargs'])","limited":false,"property":false},"up/runner/base_runner.py::BaseRunner.build_fake_model":{"id":"up/runner/base_runner.py::BaseRunner.build_fake_model","name":"BaseRunner.build_fake_model","path":"up/runner/base_runner.py","line":647,"end":678,"meaning":"当 EMA 不方便直接复制 SyncBN 模型时，另建普通 BN 模型并加载相同权重。","kind":"transfer","hardware":"这里的 fake 指 EMA 辅助模型，不是伪造计算。","url":"https://github.com/ModelTC/United-Perception/blob/52aaeb9ed27a490820696d7754d19f98cd6ecd11/up/runner/base_runner.py#L647","code":"    def build_fake_model(self):\n        '''\n        pt_sync_bn can't be deepcopy, replace with solo bn for ema\n        '''\n        net_cfg = self.config['net']\n        normalize = {\"type\": \"solo_bn\"}\n        flag = False\n        for n in net_cfg:\n            if 'normalize' in n['kwargs']:\n                if 'sync_bn' in n['kwargs']['normalize']['type']:\n                    flag = True\n                    n['kwargs']['normalize'] = normalize\n        if flag:\n            logger.info(\"pt_sync_bn can't be deepcopy, replace with solo bn for ema, \\\n                load model state to fake model state\")\n            model_helper_type = self.config['runtime']['model_helper']['type']\n            model_helper_kwargs = self.config['runtime']['model_helper']['kwargs']\n            model_helper_ins = MODEL_HELPER_REGISTRY[model_helper_type]\n            model = model_helper_ins(net_cfg, **model_helper_kwargs)\n            if self.device == 'cuda':\n                model = model.cuda()\n            if self.fp16 and self.backend == 'linklink':\n                model = model.half()\n            if self.config['runtime']['special_bn_init']:\n                for m in model.modules():\n                    if is_bn(m):\n                        m.eps = 1e-3\n                        m.momentum = 0.03\n            model.load(self.model.state_dict())\n        else:\n            model = self.model\n        return model","limited":false,"property":false},"up/runner/base_runner.py::BaseRunner.resume_model":{"id":"up/runner/base_runner.py::BaseRunner.resume_model","name":"BaseRunner.resume_model","path":"up/runner/base_runner.py","line":231,"end":248,"meaning":"加载模型权重；续训时还恢复优化器、学习率、scaler 和 EMA 状态。","kind":"transfer","hardware":"权重与状态会写入模型和优化器所在设备。","url":"https://github.com/ModelTC/United-Perception/blob/52aaeb9ed27a490820696d7754d19f98cd6ecd11/up/runner/base_runner.py#L231","code":"    def resume_model(self):\n        ckpt = self.saver.load_pretrain_or_resume()\n        self.model.load(ckpt['model'])\n        if self.training:\n            if self.fp16:\n                if self.backend == 'dist':\n                    self.resume_fp16(ckpt)\n                else:\n                    self.optimizer.reload()\n            if 'optimizer' in ckpt:\n                start_epoch = ckpt['epoch']\n                self.optimizer.load_state_dict(ckpt['optimizer'])\n                self.lr_scheduler.load_state_dict(ckpt['lr_scheduler'])\n                logger.info(f'resume from epoch:{start_epoch} iteration:{self.cur_iter}')\n        if 'ema' in ckpt and self.ema is not None:\n            if ckpt['ema']:\n                logger.info(\"load ckpt ema to model ema\")\n                self.ema.load_state_dict(ckpt['ema'])","limited":false,"property":false},"up/runner/base_runner.py::BaseRunner.resume_fp16":{"id":"up/runner/base_runner.py::BaseRunner.resume_fp16","name":"BaseRunner.resume_fp16","path":"up/runner/base_runner.py","line":700,"end":702,"meaning":"从 checkpoint 恢复 GradScaler 的缩放状态。","kind":"runtime","hardware":"下次训练继续沿用 scaler 状态。","url":"https://github.com/ModelTC/United-Perception/blob/52aaeb9ed27a490820696d7754d19f98cd6ecd11/up/runner/base_runner.py#L700","code":"    def resume_fp16(self, ckpt):\n        if 'scaler' in ckpt:\n            self.scaler.load_state_dict(ckpt['scaler'])","limited":false,"property":false},"up/runner/base_runner.py::BaseRunner.prepare_dist_model":{"id":"up/runner/base_runner.py::BaseRunner.prepare_dist_model","name":"BaseRunner.prepare_dist_model","path":"up/runner/base_runner.py","line":334,"end":346,"meaning":"多进程下包装 DDP，并让采样器从恢复的 iteration 位置开始。","kind":"comm","hardware":"DDP(model, device_ids=[local_rank])；梯度同步发生在反向中。","url":"https://github.com/ModelTC/United-Perception/blob/52aaeb9ed27a490820696d7754d19f98cd6ecd11/up/runner/base_runner.py#L334","code":"    def prepare_dist_model(self):\n        if env.distributed:\n            if self.backend == 'dist':\n                logger.info('using ddp')\n                self.model = DDP(self.model, device_ids=[env.local_rank], broadcast_buffers=False)\n            else:\n                self.model = DistModule(self.model, not self.args.get('asynchronize', False))\n\n        if self.training:\n            self.start_iter = self.lr_scheduler.last_iter\n            for source in self.train_pool:\n                dataset_name = source.split(':')[-1]\n                self.data_loaders[dataset_name].batch_sampler.set_start_iter(self.start_iter)","limited":false,"property":false},"up/utils/general/saver_helper.py::Saver.load_pretrain_or_resume":{"id":"up/utils/general/saver_helper.py::Saver.load_pretrain_or_resume","name":"Saver.load_pretrain_or_resume","path":"up/utils/general/saver_helper.py","line":57,"end":87,"meaning":"按 auto_resume、resume_model、pretrain_model 的优先级选权重；都没有就从初始化权重开始。","kind":"transfer","hardware":"找到文件后调用 load_checkpoint()。","url":"https://github.com/ModelTC/United-Perception/blob/52aaeb9ed27a490820696d7754d19f98cd6ecd11/up/utils/general/saver_helper.py#L57","code":"    def load_pretrain_or_resume(self):\n        if self.auto_resume:\n            last_checkpoint_path = self.find_last_checkpoint()\n            if last_checkpoint_path is not None:\n                logger.warning('Load checkpoint from {}'.format(last_checkpoint_path))\n                return self.load_checkpoint(last_checkpoint_path)\n            else:\n                logger.warning('Not found any valid checkpoint yet')\n\n        if 'resume_model' in self.save_cfg:\n            logger.warning('Load checkpoint from {}'.format(self.save_cfg['resume_model']))\n            state = self.load_checkpoint(self.save_cfg['resume_model'], convert=True)\n            return state\n        elif 'pretrain_model' in self.save_cfg:\n            state = self.load_checkpoint(self.save_cfg['pretrain_model'], convert=True)\n            logger.warning('Load checkpoint from {}'.format(self.save_cfg['pretrain_model']))\n            output = {}\n            if 'ema' in state:\n                if \"ema_state_dict\" in state['ema']:\n                    logger.info(\"Load ema pretrain model\")\n                    st = state['ema']['ema_state_dict']\n                else:\n                    st = state['model']\n                output['ema'] = state['ema']\n            else:\n                st = state['model']\n            output['model'] = st\n            return output\n        else:\n            logger.warning('Load nothing! No weights provided {}')\n            return {'model': {}}","limited":false,"property":false},"up/utils/general/saver_helper.py::Saver.find_last_checkpoint":{"id":"up/utils/general/saver_helper.py::Saver.find_last_checkpoint","name":"Saver.find_last_checkpoint","path":"up/utils/general/saver_helper.py","line":272,"end":277,"meaning":"查找输出目录中的 ckpt_latest.pth。","kind":"cpu","hardware":"文件路径查询。","url":"https://github.com/ModelTC/United-Perception/blob/52aaeb9ed27a490820696d7754d19f98cd6ecd11/up/utils/general/saver_helper.py#L272","code":"    def find_last_checkpoint(self):\n        last_ckpt_path = os.path.join(self.save_dir, \"ckpt_latest.pth\")\n        if os.path.exists(last_ckpt_path):\n            return last_ckpt_path\n        else:\n            return None","limited":false,"property":false},"up/utils/general/saver_helper.py::Saver.load_checkpoint":{"id":"up/utils/general/saver_helper.py::Saver.load_checkpoint","name":"Saver.load_checkpoint","path":"up/utils/general/saver_helper.py","line":90,"end":95,"meaning":"读取 checkpoint，并把存储映射到当前 CUDA 卡，然后整理权重格式。","kind":"transfer","hardware":"原版是 torch.cuda.current_device() + storage.cuda(device)。","url":"https://github.com/ModelTC/United-Perception/blob/52aaeb9ed27a490820696d7754d19f98cd6ecd11/up/utils/general/saver_helper.py#L90","code":"    @staticmethod\n    def load_checkpoint(ckpt_path, convert=False):\n        # assert os.path.exists(ckpt_path), f'No such file: {ckpt_path}'\n        device = torch.cuda.current_device()\n        # ckpt_dict = torch.load(ckpt_path, map_location=lambda storage, loc: storage.cuda(device))\n        ckpt_dict = PetrelHelper.load(ckpt_path, map_location=lambda storage, loc: storage.cuda(device))\n        return Saver.process_checkpoint(ckpt_dict, convert)","limited":false,"property":false},"up/utils/general/saver_helper.py::Saver.process_checkpoint":{"id":"up/utils/general/saver_helper.py::Saver.process_checkpoint","name":"Saver.process_checkpoint","path":"up/utils/general/saver_helper.py","line":98,"end":212,"meaning":"识别 model/state_dict 等格式，去掉 module. 前缀；按需要转换旧权重名称。","kind":"cpu","hardware":"主要整理字典和键，不改变网络算法。","url":"https://github.com/ModelTC/United-Perception/blob/52aaeb9ed27a490820696d7754d19f98cd6ecd11/up/utils/general/saver_helper.py#L98","code":"    @staticmethod\n    def process_checkpoint(ckpt_dict, convert=False):\n        \"\"\"Load state_dict from checkpoint\"\"\"\n\n        def cls_convert(state_dict):\n            is_convert = True\n            for k in state_dict.keys():\n                if 'classifier' in k:\n                    is_convert = False\n            if is_convert:\n                new_state_dict = OrderedDict()\n                for k, v in state_dict.items():\n                    if 'fc' in k:\n                        k = k.replace('fc', 'head.classifier')\n                    else:\n                        k = 'backbone.' + k\n                    new_state_dict[k] = v\n                return new_state_dict\n            else:\n                return state_dict\n\n        def _resnet_convert(state_dict):\n            convert_dict1 = {\n                \"conv1.weight\": \"layer0.0.weight\",\n                \"bn1.weight\": \"layer0.1.weight\",\n                \"bn1.bias\": \"layer0.1.bias\",\n                \"bn1.running_mean\": \"layer0.1.running_mean\",\n                \"bn1.running_var\": \"layer0.1.running_var\",\n                \"bn1.num_batches_tracked\": \"layer0.1.num_batches_tracked\",\n                # stem\n                \"conv1.0.weight\": \"layer0.0.0.weight\",\n                \"conv1.1.bias\": \"layer0.0.1.bias\",","limited":true,"property":false},"up/models/model_helper.py::ModelHelper.load":{"id":"up/models/model_helper.py::ModelHelper.load","name":"ModelHelper.load","path":"up/models/model_helper.py","line":141,"end":184,"meaning":"找出名称和形状匹配的权重并加载；严格模式额外处理和核对子模块。","kind":"transfer","hardware":"最终由 load_state_dict() 写入参数和 buffer。","url":"https://github.com/ModelTC/United-Perception/blob/52aaeb9ed27a490820696d7754d19f98cd6ecd11/up/models/model_helper.py#L141","code":"    def load(self, other_state_dict, strict=False):\n        \"\"\"\n        1. load resume model or pretained detection model\n        2. load pretrained clssification model\n        \"\"\"\n        logger.info(\"Try to load the whole resume model or pretrained detection model...\")\n        other_state_dict.pop('model_cfg', None)\n        model_keys = self.state_dict().keys()\n        other_keys = other_state_dict.keys()\n\n        shared_keys, unexpected_keys, missing_keys \\\n            = self.check_keys(model_keys, other_keys, 'model')\n\n        # check shared_keys size\n        new_state_dict = self.check_share_keys_size(self.state_dict(), other_state_dict, shared_keys, model_keys)\n        # get share keys info from new_state_dict\n        shared_keys, _, missing_keys \\\n            = self.check_keys(model_keys, new_state_dict.keys(), 'model')\n        self.load_state_dict(new_state_dict, strict=strict)\n\n        num_share_keys = len(shared_keys)\n        if num_share_keys == 0:\n            logger.info(\n                'Failed to load the whole detection model directly, '\n                'trying to load each part seperately...'\n            )\n            for mname, module in self.named_children():\n                module_keys = module.state_dict().keys()\n                other_keys = other_state_dict.keys()\n                # check and display info module by module\n                shared_keys, unexpected_keys, missing_keys, \\\n                    = self.check_keys(module_keys, other_keys, mname)","limited":true,"property":false},"up/models/model_helper.py::ModelHelper.check_keys":{"id":"up/models/model_helper.py::ModelHelper.check_keys","name":"ModelHelper.check_keys","path":"up/models/model_helper.py","line":186,"end":192,"meaning":"把权重名称分成匹配、多余、缺少三组。","kind":"cpu","hardware":"键集合比较。","url":"https://github.com/ModelTC/United-Perception/blob/52aaeb9ed27a490820696d7754d19f98cd6ecd11/up/models/model_helper.py#L186","code":"    def check_keys(self, own_keys, other_keys, own_name):\n        own_keys = set(own_keys)\n        other_keys = set(other_keys)\n        shared_keys = own_keys & other_keys\n        unexpected_keys = other_keys - own_keys\n        missing_keys = own_keys - other_keys\n        return shared_keys, unexpected_keys, missing_keys","limited":false,"property":false},"up/models/model_helper.py::ModelHelper.check_share_keys_size":{"id":"up/models/model_helper.py::ModelHelper.check_share_keys_size","name":"ModelHelper.check_share_keys_size","path":"up/models/model_helper.py","line":194,"end":200,"meaning":"在名称匹配的权重中，再筛选形状一致的项。","kind":"cpu","hardware":"不把形状不同的权重硬塞进模型。","url":"https://github.com/ModelTC/United-Perception/blob/52aaeb9ed27a490820696d7754d19f98cd6ecd11/up/models/model_helper.py#L194","code":"    def check_share_keys_size(self, model_state_dict, other_state_dict, shared_keys, model_keys):\n        new_state_dict = OrderedDict()\n        for k in shared_keys:\n            if k in model_keys:\n                if model_state_dict[k].shape == other_state_dict[k].shape:\n                    new_state_dict[k] = other_state_dict[k]\n        return new_state_dict","limited":false,"property":false},"up/models/model_helper.py::ModelHelper.display_info":{"id":"up/models/model_helper.py::ModelHelper.display_info","name":"ModelHelper.display_info","path":"up/models/model_helper.py","line":202,"end":208,"meaning":"打印加载了多少权重、哪些名称缺失等信息。","kind":"cpu","hardware":"帮助检查权重是否加载正确。","url":"https://github.com/ModelTC/United-Perception/blob/52aaeb9ed27a490820696d7754d19f98cd6ecd11/up/models/model_helper.py#L202","code":"    def display_info(self, mname, shared_keys, unexpected_keys, missing_keys):\n        info = \"Loading {}:{} shared keys, {} unexpected keys, {} missing keys.\".format(\n            mname, len(shared_keys), len(unexpected_keys), len(missing_keys))\n\n        if len(missing_keys) > 0:\n            info += \"\\nmissing keys are as follows:\\n    {}\".format(\"\\n    \".join(missing_keys))\n        logger.info(info)","limited":false,"property":false},"up/models/model_helper.py::ModelHelper.load_state_dict":{"id":"up/models/model_helper.py::ModelHelper.load_state_dict","name":"ModelHelper.load_state_dict","path":"up/models/model_helper.py","line":216,"end":218,"meaning":"移除保存时附带的模型配置，再调用 PyTorch 加载参数。","kind":"transfer","hardware":"参数和 buffer 的复制。","url":"https://github.com/ModelTC/United-Perception/blob/52aaeb9ed27a490820696d7754d19f98cd6ecd11/up/models/model_helper.py#L216","code":"    def load_state_dict(self, state_dict, strict=True):\n        state_dict.pop('model_cfg', None)\n        super(ModelHelper, self).load_state_dict(state_dict, strict)","limited":false,"property":false},"up/utils/model/ema_helper.py::EMA.__init__":{"id":"up/utils/model/ema_helper.py::EMA.__init__","name":"EMA.__init__","path":"up/utils/model/ema_helper.py","line":10,"end":20,"meaning":"复制模型，切到 eval，并关闭副本参数的梯度。","kind":"transfer","hardware":"副本用于 EMA 更新和评估。","url":"https://github.com/ModelTC/United-Perception/blob/52aaeb9ed27a490820696d7754d19f98cd6ecd11/up/utils/model/ema_helper.py#L10","code":"    def __init__(self, model, decay, inner_T=1, warmup=1):\n        self.model = deepcopy(model).eval()\n        for p in self.model.parameters():\n            p.requires_grad_(False)\n        self.inner_T = inner_T\n        self.decay = decay\n        self.warmup = warmup\n        if self.inner_T > 1:\n            self.decay = self.decay ** self.inner_T\n            logger.info('EMA: effective decay={}'.format(self.decay))\n        self.ema_state_dict = self.model.state_dict()","limited":false,"property":false},"up/utils/model/ema_helper.py::EMA.load_state_dict":{"id":"up/utils/model/ema_helper.py::EMA.load_state_dict","name":"EMA.load_state_dict","path":"up/utils/model/ema_helper.py","line":48,"end":52,"meaning":"恢复 EMA 模型和衰减系数等设置。","kind":"transfer","hardware":"把 EMA 权重加载到副本中。","url":"https://github.com/ModelTC/United-Perception/blob/52aaeb9ed27a490820696d7754d19f98cd6ecd11/up/utils/model/ema_helper.py#L48","code":"    def load_state_dict(self, state):\n        self.model.load(state['ema_state_dict'])\n        self.decay = state['decay']\n        self.inner_T = state['inner_T']\n        self.warmup = state['warmup']","limited":false,"property":false},"up/runner/base_runner.py::BaseRunner.train":{"id":"up/runner/base_runner.py::BaseRunner.train","name":"BaseRunner.train","path":"up/runner/base_runner.py","line":364,"end":391,"meaning":"启动训练模式，然后反复取 batch、算损失、反向、更新、验证和保存。","kind":"mixed","hardware":"主循环总入口；实际顺序见上方目录。","url":"https://github.com/ModelTC/United-Perception/blob/52aaeb9ed27a490820696d7754d19f98cd6ecd11/up/runner/base_runner.py#L364","code":"    def train(self):\n        self._hooks('before_train')\n        self.model.cuda().train()\n        for iter_idx in range(self.start_iter, self.max_iter):\n            batch = self.get_batch('train')\n            loss = self.forward_train(batch)\n            self.backward(loss)\n            self.update()\n            if self.ema is not None:\n                self.ema.step(self.model, curr_step=iter_idx)\n            if self.is_test(iter_idx):\n                if iter_idx == self.start_iter:\n                    continue\n                if self.config['runtime']['async_norm']:\n                    from up.utils.env.dist_helper import all_reduce_norm\n                    logger.info(\"all reduce norm\")\n                    all_reduce_norm(self.model)\n                    if self.ema is not None:\n                        all_reduce_norm(self.ema.model)\n                self.evaluate()\n                self.model.train()\n            if self.only_save_latest:\n                self.save_epoch_ckpt(iter_idx)\n            else:\n                if self.is_save(iter_idx):\n                    self.save()\n            self.lr_scheduler.step()\n        self._hooks('after_train')","limited":false,"property":false},"up/runner/base_runner.py::BaseRunner.get_batch":{"id":"up/runner/base_runner.py::BaseRunner.get_batch","name":"BaseRunner.get_batch","path":"up/runner/base_runner.py","line":531,"end":551,"meaning":"从指定 train/test 加载器取下一批；迭代器结束就重新创建，最后把 Tensor 搬到设备。","kind":"transfer","hardware":"next(iterator) → batch2device()。","url":"https://github.com/ModelTC/United-Perception/blob/52aaeb9ed27a490820696d7754d19f98cd6ecd11/up/runner/base_runner.py#L531","code":"    def get_batch(self, batch_type='train'):\n        if batch_type == 'train':\n            cur_iter = self.cur_iter\n        else:\n            cur_iter = self.local_eval_iter(step=1)\n        self._hooks('before_data', cur_iter)\n        assert batch_type in self.data_loaders\n        if not hasattr(self, 'data_iterators'):\n            self.data_iterators = {}\n        if batch_type not in self.data_iterators:\n            iterator = self.data_iterators[batch_type] = iter(self.data_loaders[batch_type])\n        else:\n            iterator = self.data_iterators[batch_type]\n        try:\n            batch = next(iterator)\n        except StopIteration as e:  # noqa\n            iterator = self.data_iterators[batch_type] = iter(self.data_loaders[batch_type])\n            batch = next(iterator)\n        batch = dict(batch)\n        batch = self.batch2device(batch)\n        return batch","limited":false,"property":false},"up/runner/base_runner.py::BaseRunner.batch2device":{"id":"up/runner/base_runner.py::BaseRunner.batch2device","name":"BaseRunner.batch2device","path":"up/runner/base_runner.py","line":523,"end":529,"meaning":"统一图片 dtype，再把这一批的 Tensor 迁移到 CUDA。","kind":"transfer","hardware":"原版使用 to_device(..., device=torch.device(\"cuda\"))。","url":"https://github.com/ModelTC/United-Perception/blob/52aaeb9ed27a490820696d7754d19f98cd6ecd11/up/runner/base_runner.py#L523","code":"    def batch2device(self, batch):\n        model_dtype = torch.float32\n        if self.fp16 and self.backend == 'linklink':\n            model_dtype = self.model.dtype\n        if batch['image'].device != torch.device('cuda') or batch['image'].dtype != model_dtype:\n            batch = to_device(batch, device=torch.device('cuda'), dtype=model_dtype)\n        return batch","limited":false,"property":false},"up/runner/base_runner.py::BaseRunner.forward_train":{"id":"up/runner/base_runner.py::BaseRunner.forward_train","name":"BaseRunner.forward_train","path":"up/runner/base_runner.py","line":580,"end":585,"meaning":"触发前向前的回调，调用 forward()，再触发前向后的回调，返回总损失。","kind":"compute","hardware":"模型计算和损失从这里进入。","url":"https://github.com/ModelTC/United-Perception/blob/52aaeb9ed27a490820696d7754d19f98cd6ecd11/up/runner/base_runner.py#L580","code":"    def forward_train(self, batch):\n        assert self.model.training\n        self._hooks('before_forward', self.cur_iter, batch)\n        loss, output = self.forward(batch, return_output=True)\n        self._hooks('after_forward', self.cur_iter, output)\n        return loss","limited":false,"property":false},"up/runner/base_runner.py::BaseRunner.forward":{"id":"up/runner/base_runner.py::BaseRunner.forward","name":"BaseRunner.forward","path":"up/runner/base_runner.py","line":727,"end":739,"meaning":"PyTorch AMP 开启时进入 autocast；调用模型后，把名字包含 loss 的输出加成总损失。","kind":"compute","hardware":"torch.cuda.amp.autocast；GPU Tensor 求和。","url":"https://github.com/ModelTC/United-Perception/blob/52aaeb9ed27a490820696d7754d19f98cd6ecd11/up/runner/base_runner.py#L727","code":"    def forward(self, batch, return_output=False):\n        if self.backend == 'dist' and self.fp16:\n            with torch.cuda.amp.autocast(enabled=True):\n                output = self.forward_model(batch)\n        else:\n            output = self.forward_model(batch)\n        self._temporaries['last_output'] = output\n        losses = [val for name, val in output.items() if name.find('loss') >= 0]\n        loss = sum(losses)\n        if return_output:\n            return loss, output\n        else:\n            return loss","limited":false,"property":false},"up/runner/base_runner.py::BaseRunner.forward_model":{"id":"up/runner/base_runner.py::BaseRunner.forward_model","name":"BaseRunner.forward_model","path":"up/runner/base_runner.py","line":722,"end":725,"meaning":"训练时调用当前模型；评估且启用 EMA 时调用 EMA 模型。","kind":"compute","hardware":"这里决定真正执行哪份权重。","url":"https://github.com/ModelTC/United-Perception/blob/52aaeb9ed27a490820696d7754d19f98cd6ecd11/up/runner/base_runner.py#L722","code":"    def forward_model(self, batch):\n        if self.ema is not None and not self.model.training:\n            return self.ema.model(batch)\n        return self.model(batch)","limited":false,"property":false},"up/runner/base_runner.py::BaseRunner.backward":{"id":"up/runner/base_runner.py::BaseRunner.backward","name":"BaseRunner.backward","path":"up/runner/base_runner.py","line":741,"end":761,"meaning":"清空旧梯度，再计算本批梯度；AMP 时先缩放损失，多卡时由 DDP 同步。","kind":"compute","hardware":"zero_grad；loss.backward 或 scaler.scale(loss).backward。","url":"https://github.com/ModelTC/United-Perception/blob/52aaeb9ed27a490820696d7754d19f98cd6ecd11/up/runner/base_runner.py#L741","code":"    def backward(self, loss):\n        self.model.zero_grad()\n        if self.backend == 'dist':\n            if self.fp16:\n                self.scaler.scale(loss).backward()\n            else:\n                loss.backward()\n        elif self.backend == 'linklink':\n            loss = loss / env.world_size\n            if self.fp16:\n                self.optimizer.backward(loss)\n            else:\n                loss.backward()\n            self._hooks('before_allreduce', self.cur_iter)\n            reduce_gradients(self.model, not self.args['asynchronize'],\n                             self.args.get('allow_dead_parameter', False))\n            self._hooks('after_allreduce', self.cur_iter)\n        else:\n            raise NotImplementedError\n        self._hooks('after_backward', self.cur_iter, loss)\n        return loss","limited":false,"property":false},"up/runner/base_runner.py::BaseRunner.update":{"id":"up/runner/base_runner.py::BaseRunner.update","name":"BaseRunner.update","path":"up/runner/base_runner.py","line":763,"end":769,"meaning":"执行优化器更新；AMP 时使用 scaler.step()/update()，随后触发 after_update 回调。","kind":"compute","hardware":"改变 GPU 上的参数，以及优化器状态。","url":"https://github.com/ModelTC/United-Perception/blob/52aaeb9ed27a490820696d7754d19f98cd6ecd11/up/runner/base_runner.py#L763","code":"    def update(self):\n        if self.backend == 'dist' and self.fp16:\n            self.scaler.step(self.optimizer)\n            self.scaler.update()\n        else:\n            self.optimizer.step()\n        self._hooks('after_update', self.cur_iter)","limited":false,"property":false},"up/utils/env/gene_env.py::to_device":{"id":"up/utils/env/gene_env.py::to_device","name":"to_device","path":"up/utils/env/gene_env.py","line":42,"end":60,"meaning":"递归遍历 batch 内的 Tensor、列表和字典，把 Tensor 放到指定设备。","kind":"transfer","hardware":"Tensor.to(device)；文件名等普通 Python 对象保持原样。","url":"https://github.com/ModelTC/United-Perception/blob/52aaeb9ed27a490820696d7754d19f98cd6ecd11/up/utils/env/gene_env.py#L42","code":"def to_device(input, device=\"cuda\", dtype=None):\n    \"\"\"Transfer data between devidces\"\"\"\n\n    if 'image' in input:\n        input['image'] = input['image'].to(dtype=dtype)\n\n    def transfer(x):\n        if torch.is_tensor(x):\n            return x.to(device=device)\n        elif isinstance(x, list):\n            return [transfer(_) for _ in x]\n        elif isinstance(x, Mapping):\n            if 'image' in x:\n                x['image'] = x['image'].to(dtype=dtype)\n            return type(x)({k: transfer(v) for k, v in x.items()})\n        else:\n            return x\n\n    return {k: transfer(v) for k, v in input.items()}","limited":false,"property":false},"up/models/model_helper.py::ModelHelper.forward":{"id":"up/models/model_helper.py::ModelHelper.forward","name":"ModelHelper.forward","path":"up/models/model_helper.py","line":126,"end":139,"meaning":"依次调用已组装的子模块，并把每一步输出补到同一个数据字典里，再交给下一模块。","kind":"compute","hardware":"submodule(input)；实际 GPU 运算在子模块内部。","url":"https://github.com/ModelTC/United-Perception/blob/52aaeb9ed27a490820696d7754d19f98cd6ecd11/up/models/model_helper.py#L126","code":"    def forward(self, input):\n        \"\"\"\n        Note:\n            Input should not be updated inplace !!!\n            In Mimic task, input may be fed into teacher & student networks respectivly,\n            inplace update may cause the input dict only keep the last forward results, which is unexpected.\n        \"\"\"\n        for submodule in self.children():\n            output = submodule(input)\n            input.update(output)\n        if not DEPLOY_FLAG.flag:\n            return input\n        else:\n            return input['deploy_output_node']","limited":false,"property":false},"up/utils/model/ema_helper.py::EMA.step":{"id":"up/utils/model/ema_helper.py::EMA.step","name":"EMA.step","path":"up/utils/model/ema_helper.py","line":26,"end":39,"meaning":"将 EMA 旧权重与当前权重加权平均，让评估使用更平滑的权重。","kind":"compute","hardware":"GPU Tensor 的原地乘法、加法；不记录梯度。","url":"https://github.com/ModelTC/United-Perception/blob/52aaeb9ed27a490820696d7754d19f98cd6ecd11/up/utils/model/ema_helper.py#L26","code":"    def step(self, model, curr_step=None):\n        with torch.no_grad():\n            if curr_step is None:\n                decay = self.decay\n            else:\n                decay = min(self.decay, (1 + curr_step) / (self.warmup + curr_step))\n            if curr_step % self.inner_T != 0:\n                return\n            msd = model.state_dict()\n            msd = self.remove_prefix(msd, 'module.')\n            for k, v in self.model.state_dict().items():\n                if v.dtype.is_floating_point:\n                    v *= decay\n                    v += (1.0 - decay) * msd[k].detach()","limited":false,"property":false},"up/utils/model/ema_helper.py::ExpEMA.step":{"id":"up/utils/model/ema_helper.py::ExpEMA.step","name":"ExpEMA.step","path":"up/utils/model/ema_helper.py","line":60,"end":74,"meaning":"使用随训练步数变化的衰减系数，更新 EMA 权重。","kind":"compute","hardware":"YOLOX-small 选择 exp EMA；GPU 乘加。","url":"https://github.com/ModelTC/United-Perception/blob/52aaeb9ed27a490820696d7754d19f98cd6ecd11/up/utils/model/ema_helper.py#L60","code":"    def step(self, model, curr_step=None):\n        if curr_step is None:\n            decay = self.decay\n        else:\n            def df(x): return self.decay * (1 - math.exp(-x / 2000)) # noqa\n            decay = df(curr_step)\n        with torch.no_grad():\n            if hasattr(model, 'module'):\n                msd = model.module.state_dict()\n            else:\n                msd = model.state_dict()  # model state_dict\n            for k, v in self.model.state_dict().items():\n                if v.dtype.is_floating_point:\n                    v *= decay\n                    v += (1. - decay) * msd[k].detach()","limited":false,"property":false},"up/utils/general/hook_helper.py::GradClipper.after_backward":{"id":"up/utils/general/hook_helper.py::GradClipper.after_backward","name":"GradClipper.after_backward","path":"up/utils/general/hook_helper.py","line":703,"end":725,"meaning":"如果配置梯度裁剪，先对 AMP 梯度 unscale，再限制梯度范数。","kind":"compute","hardware":"scaler.unscale_；clip_grad_norm_；它是可选 hook。","url":"https://github.com/ModelTC/United-Perception/blob/52aaeb9ed27a490820696d7754d19f98cd6ecd11/up/utils/general/hook_helper.py#L703","code":"    def after_backward(self, cur_iter, loss):\n        # the grad in mixed precision is scaled, need unscale first\n        if FP16_FLAG.fp16:\n            optimizer = self.runner_ref().get_optimizer()\n            if DIST_BACKEND.backend == 'dist':\n                self.runner_ref().scaler.unscale_(optimizer)\n            elif DIST_BACKEND.backend == 'linklink':\n                if self.mode in [self._AVG, self._MAVG]:\n                    raise ValueError('linklink fp16 only support grad cliping with pre_defined value!')\n                optimizer.clip_grad_norm_(self.max_norm, self.norm_type)\n                return\n\n        model = self.runner_ref().get_model()\n        parameters = [p for p in model.parameters() if p.requires_grad and p.grad is not None]\n        if self.mode in [self._AVG, self._MAVG]:\n            self.update_max_norm(parameters)\n            if self.display_freq is not None and self.last_iter % self.display_freq == 0:\n                logger.info('max_norm:{}'.format(self.max_norm))\n        if torch.is_tensor(self.max_norm):\n            for idx in range(len(parameters)):\n                if parameters[idx].dtype != self.max_norm.dtype:\n                    parameters[idx] = parameters[idx].to(dtype=self.max_norm.dtype)\n        clip_grad_norm_(parameters, self.max_norm, self.norm_type)","limited":false,"property":false},"up/utils/general/hook_helper.py::build_hooks":{"id":"up/utils/general/hook_helper.py::build_hooks","name":"build_hooks","path":"up/utils/general/hook_helper.py","line":1090,"end":1115,"meaning":"按配置创建回调对象，并在缺省时补上日志回调。","kind":"cpu","hardware":"回调本身是否用 GPU，要看它执行的功能。","url":"https://github.com/ModelTC/United-Perception/blob/52aaeb9ed27a490820696d7754d19f98cd6ecd11/up/utils/general/hook_helper.py#L1090","code":"def build_hooks(runner, cfg_list, add_log_if_not_exists=True):\n\n    def add_log_hook(cfg_hooks):\n        exists = any(['train_val' in cfg['type'] for cfg in cfg_hooks])\n        if not exists:\n            cfg_hooks.insert(0, {\n                'type': 'train_val_logger',\n                'kwargs': {\n                    'freq': runner.args.get('display', 10),\n                    'skip_first_k': 5,\n                    'logdir': 'log'\n                }\n            })\n        return cfg_hooks\n\n    def build_single_hook(cfg):\n        cfg = copy.deepcopy(cfg)\n        kwargs = cfg.setdefault('kwargs', {})\n        kwargs['runner'] = runner\n        return HOOK_REGISTRY.build(cfg)\n\n    if add_log_if_not_exists:\n        cfg_list = add_log_hook(cfg_list)\n\n    hooks = [build_single_hook(cfg) for cfg in cfg_list]\n    return ComposeHook(hooks)","limited":false,"property":false},"up/utils/general/hook_helper.py::ComposeHook.__call__":{"id":"up/utils/general/hook_helper.py::ComposeHook.__call__","name":"ComposeHook.__call__","path":"up/utils/general/hook_helper.py","line":1085,"end":1087,"meaning":"收到时点名称后，顺序调用各个 hook 的同名方法。","kind":"cpu","hardware":"函数分发，不是 GPU 内核。","url":"https://github.com/ModelTC/United-Perception/blob/52aaeb9ed27a490820696d7754d19f98cd6ecd11/up/utils/general/hook_helper.py#L1085","code":"    def __call__(self, *args, **kwargs):\n        results = [hook(*args, **kwargs) for hook in self.hooks]\n        return results","limited":false,"property":false},"up/utils/general/hook_helper.py::TrainEvalLogger.after_update":{"id":"up/utils/general/hook_helper.py::TrainEvalLogger.after_update","name":"TrainEvalLogger.after_update","path":"up/utils/general/hook_helper.py","line":241,"end":286,"meaning":"记录本步耗时、学习率、损失、显存和剩余时间。","kind":"mixed","hardware":"包含 CUDA 显存查询、日志指标同步和 Tensor.item()。","url":"https://github.com/ModelTC/United-Perception/blob/52aaeb9ed27a490820696d7754d19f98cd6ecd11/up/utils/general/hook_helper.py#L241","code":"    def after_update(self, cur_iter):\n        runner = self.runner_ref()\n        cur_iter += 1\n        total_iter = runner.get_total_iter()\n        train_size = runner.train_epoch_size\n\n        self.train_timers.update(\n            cur_iter,\n            data_time=self.t_after_data - self.t_before_data,\n            batch_time=time.time() - self.t_before_data,\n            forward_time=self.t_after_forward - self.t_after_data,\n            backward_time=self.t_after_backward - self.t_after_forward,\n            allreduce_time=self.t_after_allreduce - self.t_before_allreduce)\n\n        eta_seconds = self.train_timers.batch_time.global_avg * (runner.get_total_iter() - cur_iter)\n        eta_string = str(datetime.timedelta(seconds=int(eta_seconds)))\n\n        if cur_iter % self.freq != 0:\n            return\n        logger.info(\n            \" \".join([\n                \"Progress:[{progress:.1f}%][{cur_iter}/{total_iter}]\",\n                \"Epoch:[{epoch}][{local_iter}/{epoch_len}]\",\n                \"LR:{lr:.6f}\",\n                \"Max mem:{memory:.0f}\",\n                \"ETA:{eta}\",\n                \"{timer}\"\n            ]).format(\n                progress=runner.progress,\n                cur_iter=cur_iter,\n                total_iter=runner.get_total_iter(),\n                epoch=runner.cur_epoch(),","limited":true,"property":false},"up/utils/general/hook_helper.py::TrainEvalLogger.allreduce":{"id":"up/utils/general/hook_helper.py::TrainEvalLogger.allreduce","name":"TrainEvalLogger.allreduce","path":"up/utils/general/hook_helper.py","line":204,"end":221,"meaning":"把各卡的 loss/accuracy 汇总后平均，最后转换成可打印数字。","kind":"comm","hardware":"allreduce；Tensor.item() 会把标量交给 CPU。","url":"https://github.com/ModelTC/United-Perception/blob/52aaeb9ed27a490820696d7754d19f98cd6ecd11/up/utils/general/hook_helper.py#L204","code":"    @classmethod\n    def allreduce(cls, output):\n        \"\"\"Sync loss and accuracy across gpus.\n           loss and accuracy must be torch.Tensor.\n           return loss and accuracy only\n        \"\"\"\n\n        def filter_fn(x):\n            return x.find('loss') >= 0 or x.find('accuracy') >= 0\n\n        output = {name: val.clone() for name, val in output.items() if filter_fn(name)}\n\n        if env.distributed:\n            for name, val in output.items():\n                if torch.is_tensor(val):\n                    allreduce(val)\n                    output[name] = val / env.world_size\n\n        return {name: val.item() for name, val in output.items()}","limited":false,"property":false},"up/utils/general/hook_helper.py::TrainEvalLogger.after_eval_forward":{"id":"up/utils/general/hook_helper.py::TrainEvalLogger.after_eval_forward","name":"TrainEvalLogger.after_eval_forward","path":"up/utils/general/hook_helper.py","line":291,"end":315,"meaning":"记录验证每一批的时间、结果和显存。","kind":"runtime","hardware":"包含 torch.cuda.max_memory_allocated()。","url":"https://github.com/ModelTC/United-Perception/blob/52aaeb9ed27a490820696d7754d19f98cd6ecd11/up/utils/general/hook_helper.py#L291","code":"    def after_eval_forward(self, cur_iter, output):\n        self.eval_timers.update(cur_iter,\n                                data_time=self.t_after_data - self.t_before_data,\n                                batch_time=time.time() - self.t_before_data)\n        cur_iter += 1\n        if cur_iter % self.freq != 0:\n            return\n        runner = self.runner_ref()\n        test_len = runner.data_loaders['test'].get_epoch_size()\n        eta_seconds = self.eval_timers.batch_time.global_avg * (test_len - cur_iter)\n        eta_string = str(datetime.timedelta(seconds=int(eta_seconds)))\n        logger.info(\n            \" \".join([\n                \"Progress:[{progress:.1f}%][{cur_iter}/{test_len}]\",\n                \"Max mem:{memory:.0f}\",\n                \"ETA:{eta}\",\n                \"{timers}\",\n            ]).format(\n                progress=min(cur_iter / test_len * 100, 100),\n                memory=torch.cuda.max_memory_allocated() / 1024.0 / 1024.0,\n                cur_iter=cur_iter,\n                test_len=test_len,\n                eta=eta_string,\n                timers=self.eval_timers,\n            ))","limited":false,"property":false},"up/utils/general/hook_helper.py::TrainEvalLogger.after_eval":{"id":"up/utils/general/hook_helper.py::TrainEvalLogger.after_eval","name":"TrainEvalLogger.after_eval","path":"up/utils/general/hook_helper.py","line":324,"end":339,"meaning":"汇总验证耗时，并把指标写到日志或可视化记录。","kind":"cpu","hardware":"指标记录。","url":"https://github.com/ModelTC/United-Perception/blob/52aaeb9ed27a490820696d7754d19f98cd6ecd11/up/utils/general/hook_helper.py#L324","code":"    def after_eval(self, metrics):\n        # if evaluate during training, record metrics into log\n        runner = self.runner_ref()\n        if env.is_master() and runner.training:\n            epoch = runner.cur_epoch()\n            for k, v in metrics.items():\n                if not isinstance(v, list):\n                    if isinstance(v, dict):\n                        for i_k, i_v in v.items():\n                            self.upload_scalar('metrics/' + k + '_' + i_k, i_v, epoch)\n                    else:\n                        self.upload_scalar('metrics/' + k, v, epoch)\n                    try:\n                        self.summary_writer.flush()\n                    except:  # noqa\n                        pass","limited":false,"property":false},"up/utils/general/hook_helper.py::GPUMemoryEmpty.after_update":{"id":"up/utils/general/hook_helper.py::GPUMemoryEmpty.after_update","name":"GPUMemoryEmpty.after_update","path":"up/utils/general/hook_helper.py","line":945,"end":948,"meaning":"配置此回调时，在参数更新后释放未使用的 CUDA 缓存并重置显存峰值统计。","kind":"runtime","hardware":"torch.cuda.empty_cache/reset_peak_memory_stats。","url":"https://github.com/ModelTC/United-Perception/blob/52aaeb9ed27a490820696d7754d19f98cd6ecd11/up/utils/general/hook_helper.py#L945","code":"    def after_update(self, cur_iter):\n        if cur_iter % self.freq == 0 and cur_iter > 0:\n            torch.cuda.empty_cache()\n            torch.cuda.memory.reset_peak_memory_stats()","limited":false,"property":false},"up/tasks/det/plugins/yolox/utils/hook_helper.py::YoloxNoaug.before_forward":{"id":"up/tasks/det/plugins/yolox/utils/hook_helper.py::YoloxNoaug.before_forward","name":"YoloxNoaug.before_forward","path":"up/tasks/det/plugins/yolox/utils/hook_helper.py","line":21,"end":44,"meaning":"训练接近末尾时切换数据增强、开启 L1 损失，并调整验证频率。","kind":"cpu","hardware":"改变后续训练的配置与模块开关。","url":"https://github.com/ModelTC/United-Perception/blob/52aaeb9ed27a490820696d7754d19f98cd6ecd11/up/tasks/det/plugins/yolox/utils/hook_helper.py#L21","code":"    def before_forward(self, cur_iter, input):\n        runner = self.runner_ref()\n        if cur_iter >= runner.data_loaders['train'].get_epoch_size() * (self.max_epoch - self.no_aug_epoch):\n            if not self.flag:\n                logger.info(f\"rebuild dataset transformer cfg {self.transformer}\")\n                runner.config['dataset']['train']['dataset']['kwargs']['transformer'] = self.transformer\n                del runner.data_loaders, runner.data_iterators['train']\n                import gc\n                gc.collect()\n                if not hasattr(self, 'data_iterators'):\n                    runner.data_iterators = {}\n                logger.info(\"rebuild dataloader\")\n                runner.build_dataloaders()\n                runner.data_iterators['train'] = iter(runner.data_loaders[\"train\"])\n                try:\n                    if env.world_size > 1:\n                        runner.model.module.yolox_post.use_l1 = True\n                    else:\n                        runner.model.yolox_post.use_l1 = True\n                except:  # noqa\n                    pass\n                runner.test_freq = self.test_freq\n                runner.save_freq = self.save_freq\n                self.flag = True","limited":false,"property":false},"up/runner/base_runner.py::BaseRunner.is_save":{"id":"up/runner/base_runner.py::BaseRunner.is_save","name":"BaseRunner.is_save","path":"up/runner/base_runner.py","line":567,"end":578,"meaning":"根据保存起点、间隔和是否到最后一步，决定现在要不要保存。","kind":"cpu","hardware":"步数判断。","url":"https://github.com/ModelTC/United-Perception/blob/52aaeb9ed27a490820696d7754d19f98cd6ecd11/up/runner/base_runner.py#L567","code":"    def is_save(self, iter_idx):\n        cur_iter = iter_idx + 1\n        if cur_iter == self.max_iter:\n            return True\n        epoch_size = self.train_epoch_size\n        if self.iter_base:\n            epoch_size = 1\n        save_start = epoch_size * self.save_start\n        save_fren = epoch_size * self.save_freq\n        if cur_iter >= save_start and cur_iter % save_fren == 0:\n            return True\n        return False","limited":false,"property":false},"up/runner/base_runner.py::BaseRunner.save_epoch_ckpt":{"id":"up/runner/base_runner.py::BaseRunner.save_epoch_ckpt","name":"BaseRunner.save_epoch_ckpt","path":"up/runner/base_runner.py","line":357,"end":362,"meaning":"配置只保留 latest 时，在指定轮次边界保存最新状态。","kind":"cpu","hardware":"符合条件后调用 save()。","url":"https://github.com/ModelTC/United-Perception/blob/52aaeb9ed27a490820696d7754d19f98cd6ecd11/up/runner/base_runner.py#L357","code":"    def save_epoch_ckpt(self, iter_idx):\n        cur_iter = iter_idx + 1\n        epoch_size = self.save_latest_freq\n        assert not self.iter_base\n        if cur_iter % epoch_size == 0 and iter_idx > self.start_iter:\n            self.save(auto_save='latest', lns=False)","limited":false,"property":false},"up/runner/base_runner.py::BaseRunner.save":{"id":"up/runner/base_runner.py::BaseRunner.save","name":"BaseRunner.save","path":"up/runner/base_runner.py","line":348,"end":355,"meaning":"收集 checkpoint 字典，只让主进程交给 Saver 保存。","kind":"mixed","hardware":"权重在 GPU 上；写文件时涉及存储和可能的数据传输。","url":"https://github.com/ModelTC/United-Perception/blob/52aaeb9ed27a490820696d7754d19f98cd6ecd11/up/runner/base_runner.py#L348","code":"    def save(self, auto_save=None, lns=None):\n        save_dict = self.get_dump_dict()\n        if auto_save is not None:\n            save_dict['auto_save'] = auto_save\n        if lns is not None:\n            save_dict['lns'] = lns\n        if env.is_master():\n            self.saver.save(**save_dict)","limited":false,"property":false},"up/runner/base_runner.py::BaseRunner.get_dump_dict":{"id":"up/runner/base_runner.py::BaseRunner.get_dump_dict","name":"BaseRunner.get_dump_dict","path":"up/runner/base_runner.py","line":707,"end":720,"meaning":"打包轮数、步数、模型、优化器、学习率，以及可选 scaler 和 EMA 状态。","kind":"mixed","hardware":"读取 state_dict；此动作本身不会训练模型。","url":"https://github.com/ModelTC/United-Perception/blob/52aaeb9ed27a490820696d7754d19f98cd6ecd11/up/runner/base_runner.py#L707","code":"    def get_dump_dict(self):\n        model_dict = self.model.state_dict()\n        dump_dict = {\n            'epoch': self.cur_epoch(),\n            'iter': self.cur_iter,\n            'optimizer': self.optimizer.state_dict(),\n            'model': model_dict,\n            'lr_scheduler': self.lr_scheduler.state_dict()\n        }\n        if self.fp16 and self.backend == 'dist':\n            dump_dict.update(self.get_fp16_dump_dict())\n        if self.ema is not None:\n            dump_dict['ema'] = self.ema.state_dict()\n        return dump_dict","limited":false,"property":false},"up/runner/base_runner.py::BaseRunner.get_fp16_dump_dict":{"id":"up/runner/base_runner.py::BaseRunner.get_fp16_dump_dict","name":"BaseRunner.get_fp16_dump_dict","path":"up/runner/base_runner.py","line":704,"end":705,"meaning":"把 GradScaler 当前状态加入 checkpoint。","kind":"runtime","hardware":"供下次恢复混合精度训练。","url":"https://github.com/ModelTC/United-Perception/blob/52aaeb9ed27a490820696d7754d19f98cd6ecd11/up/runner/base_runner.py#L704","code":"    def get_fp16_dump_dict(self):\n        return {'scaler': self.scaler.state_dict()}","limited":false,"property":false},"up/utils/general/saver_helper.py::Saver.save":{"id":"up/utils/general/saver_helper.py::Saver.save","name":"Saver.save","path":"up/utils/general/saver_helper.py","line":233,"end":259,"meaning":"生成 checkpoint 文件名，保存状态，并更新最新权重的链接。","kind":"mixed","hardware":"torch.save；磁盘 I/O 和设备数据序列化。","url":"https://github.com/ModelTC/United-Perception/blob/52aaeb9ed27a490820696d7754d19f98cd6ecd11/up/utils/general/saver_helper.py#L233","code":"    def save(self, epoch, iter, **kwargs):\n        \"\"\"Save model checkpoint for one epoch\"\"\"\n        os.makedirs(self.save_dir, exist_ok=True)\n        # Assume we warmup for a epochs and training a+b epochs in total,\n        # then our checkpoints are named of ckpt_e{-a+1}.pth ~ ckpt_e{b}.pth\n        # if best in kwargs, we save the best ckpt as ckpt_best.path.auto\n        if 'spacial_name' in kwargs:\n            ckpt_path = os.path.join(self.save_dir, kwargs['spacial_name'] + '.pth')\n        elif 'suffix' in kwargs:\n            suffix = kwargs['suffix']\n            ckpt_path = os.path.join(self.save_dir, 'ckpt_e{}-{}.pth'.format(epoch, suffix))\n        elif 'auto_save' in kwargs:\n            ckpt_path = os.path.join(self.save_dir, 'ckpt_{}.pth'.format(kwargs['auto_save']))\n        else:\n            ckpt_path = os.path.join(self.save_dir, 'ckpt_e{}.pth'.format(epoch))\n        # since epoch not in kwargs\n        kwargs['epoch'] = epoch\n        kwargs['iter'] = iter\n        kwargs['metric_val'] = kwargs.get('metric_val', -1)\n        lns_latest_ckpt = kwargs.pop('lns', True)\n        if os.path.exists(ckpt_path):\n            self.rm_ckpt(ckpt_path)\n        torch.save(kwargs, ckpt_path)\n        if lns_latest_ckpt:\n            latest_path = os.path.join(self.save_dir, 'ckpt_latest.pth')\n            self.lns_latest_ckpt(ckpt_path, latest_path)\n        return ckpt_path","limited":false,"property":false},"up/utils/general/saver_helper.py::Saver.lns_latest_ckpt":{"id":"up/utils/general/saver_helper.py::Saver.lns_latest_ckpt","name":"Saver.lns_latest_ckpt","path":"up/utils/general/saver_helper.py","line":214,"end":224,"meaning":"把 ckpt_latest.pth 链接到刚保存的文件。","kind":"cpu","hardware":"文件链接操作。","url":"https://github.com/ModelTC/United-Perception/blob/52aaeb9ed27a490820696d7754d19f98cd6ecd11/up/utils/general/saver_helper.py#L214","code":"    def lns_latest_ckpt(self, ckpt_path, new_path):\n        try:\n            pwd = os.getcwd()\n            absolute_ckpt_path = os.path.join(pwd, ckpt_path)\n            absolute_new_path = os.path.join(pwd, new_path)\n            if os.path.exists(absolute_new_path):\n                os.system(f'rm {absolute_new_path}')\n            os.system(f\"ln -s {absolute_ckpt_path} {absolute_new_path}\")\n        except Exception as e:\n            logger.warning(f'Failed to ln -s {ckpt_path} {new_path}')\n            logger.warning(e)","limited":false,"property":false},"up/utils/general/saver_helper.py::Saver.rm_ckpt":{"id":"up/utils/general/saver_helper.py::Saver.rm_ckpt","name":"Saver.rm_ckpt","path":"up/utils/general/saver_helper.py","line":226,"end":231,"meaning":"在覆盖同名 checkpoint 前删除旧文件。","kind":"cpu","hardware":"文件操作。","url":"https://github.com/ModelTC/United-Perception/blob/52aaeb9ed27a490820696d7754d19f98cd6ecd11/up/utils/general/saver_helper.py#L226","code":"    def rm_ckpt(self, ckpt_path):\n        try:\n            os.system(f'rm {ckpt_path}')\n        except Exception as e:\n            logger.warning(f'Failed to rm {ckpt_path}')\n            logger.warning(e)","limited":false,"property":false},"up/utils/general/saver_helper.py::Saver.save_model_arch":{"id":"up/utils/general/saver_helper.py::Saver.save_model_arch","name":"Saver.save_model_arch","path":"up/utils/general/saver_helper.py","line":261,"end":266,"meaning":"把模型结构写成文本。","kind":"cpu","hardware":"供阅读和复现。","url":"https://github.com/ModelTC/United-Perception/blob/52aaeb9ed27a490820696d7754d19f98cd6ecd11/up/utils/general/saver_helper.py#L261","code":"    def save_model_arch(self, model):\n        \"\"\"Save model structure\"\"\"\n        os.makedirs(self.save_dir, exist_ok=True)\n        meta_path = os.path.join(self.save_dir, 'model_arch.txt')\n        with open(meta_path, 'w') as fid:\n            fid.write(str(model))","limited":false,"property":false},"up/utils/general/saver_helper.py::Saver.save_running_config":{"id":"up/utils/general/saver_helper.py::Saver.save_running_config","name":"Saver.save_running_config","path":"up/utils/general/saver_helper.py","line":268,"end":270,"meaning":"把实际生效的配置写成 JSON。","kind":"cpu","hardware":"包含 YAML 与命令行覆盖后的设置。","url":"https://github.com/ModelTC/United-Perception/blob/52aaeb9ed27a490820696d7754d19f98cd6ecd11/up/utils/general/saver_helper.py#L268","code":"    def save_running_config(self, config):\n        with open(self.running_config_file, 'w') as rcf:\n            json.dump(config, rcf, indent=2)","limited":false,"property":false},"up/models/model_helper.py::ModelHelper.state_dict":{"id":"up/models/model_helper.py::ModelHelper.state_dict","name":"ModelHelper.state_dict","path":"up/models/model_helper.py","line":210,"end":214,"meaning":"取得模型参数和 buffer 字典；可选择额外附上模型配置。","kind":"mixed","hardware":"字典中的 Tensor 保留其设备。","url":"https://github.com/ModelTC/United-Perception/blob/52aaeb9ed27a490820696d7754d19f98cd6ecd11/up/models/model_helper.py#L210","code":"    def state_dict(self, destination=None, prefix='', keep_vars=False, model_cfg=False):\n        destination = super(ModelHelper, self).state_dict(destination, prefix, keep_vars)\n        if model_cfg:\n            destination['model_cfg'] = self.model_cfg\n        return destination","limited":false,"property":false},"up/runner/base_runner.py::BaseRunner.is_test":{"id":"up/runner/base_runner.py::BaseRunner.is_test","name":"BaseRunner.is_test","path":"up/runner/base_runner.py","line":553,"end":565,"meaning":"根据验证起点、间隔和最后一步判断是否执行验证。","kind":"cpu","hardware":"train --evaluate 则直接进入 evaluate。","url":"https://github.com/ModelTC/United-Perception/blob/52aaeb9ed27a490820696d7754d19f98cd6ecd11/up/runner/base_runner.py#L553","code":"    def is_test(self, iter_idx):\n        if not self.is_eval:\n            return False\n        cur_iter = iter_idx + 1\n        if cur_iter == self.max_iter:\n            return True\n        epoch_size = self.train_epoch_size\n        if self.iter_base:\n            epoch_size = 1\n        if cur_iter >= self.test_start * epoch_size:\n            if (cur_iter % (self.test_freq * epoch_size)) == 0:\n                return True\n        return False","limited":false,"property":false},"up/runner/base_runner.py::BaseRunner.evaluate":{"id":"up/runner/base_runner.py::BaseRunner.evaluate","name":"BaseRunner.evaluate","path":"up/runner/base_runner.py","line":493,"end":510,"meaning":"关闭梯度记录，运行验证集预测，在主进程计算指标并通知回调。","kind":"mixed","hardware":"预测前向用 GPU；常见最终指标统计在 CPU。","url":"https://github.com/ModelTC/United-Perception/blob/52aaeb9ed27a490820696d7754d19f98cd6ecd11/up/runner/base_runner.py#L493","code":"    @torch.no_grad()\n    def evaluate(self):\n        res_file, all_device_results_list = self.inference()\n        if env.is_master():\n            logger.info(\"begin evaluate\")\n            metrics = self.data_loaders['test'].dataset.evaluate(res_file, all_device_results_list)\n            try:\n                logger.info(json.dumps(metrics, indent=2))\n            except BaseException:\n                logger.warning('metrics type is incompatible for display')\n        else:\n            metrics = Metric({})\n        barrier()\n        try:\n            self._hooks('after_eval', metrics)\n        except BaseException:\n            logger.warning('metrics type is incompatible for hook')\n        self.set_cur_eval_iter()\n        return metrics","limited":false,"property":false},"up/runner/base_runner.py::BaseRunner.inference":{"id":"up/runner/base_runner.py::BaseRunner.inference","name":"BaseRunner.inference","path":"up/runner/base_runner.py","line":467,"end":490,"meaning":"安排验证集推理，并选择在内存中收集结果还是写入结果文件。","kind":"mixed","hardware":"它是 Runner 内部的验证集预测方法。","url":"https://github.com/ModelTC/United-Perception/blob/52aaeb9ed27a490820696d7754d19f98cd6ecd11/up/runner/base_runner.py#L467","code":"    @torch.no_grad()\n    def inference(self):\n        self.memory_friendly_infer = self.config['saver'].get('memory_friendly', False)\n        all_device_results_list = self._inference()\n        res_file = None\n        if env.is_master():\n            if self.memory_friendly_infer:\n                res_file = self.merge_results()\n            else:\n                if not self.config['saver'].get('save_result', False):\n                    return res_file, all_device_results_list\n                shutil.rmtree(self.results_dir, ignore_errors=True)\n                os.makedirs(self.results_dir, exist_ok=True)\n                res_file = os.path.join(self.results_dir, 'results.txt')\n                logger.info(f'saving inference results into {res_file}')\n                writer = open(res_file, 'w')\n                for device_list in all_device_results_list:\n                    for results in device_list:\n                        for item in results:\n                            print(json.dumps(item), file=writer)\n                            writer.flush()\n                writer.close()\n                with open(os.path.join(self.results_dir, 'inference_process.log'), 'w') as f:\n                    f.write('[Done] writing all results to {} done. \\n'.format(res_file))\n        return res_file, all_device_results_list","limited":false,"property":false},"up/runner/base_runner.py::BaseRunner._inference":{"id":"up/runner/base_runner.py::BaseRunner._inference","name":"BaseRunner._inference","path":"up/runner/base_runner.py","line":394,"end":432,"meaning":"切换模型到 eval，循环读取整个验证集，前向后把预测交给 dataset.dump()。","kind":"compute","hardware":"原版 model.cuda().eval()；get_batch 和 forward_eval。","url":"https://github.com/ModelTC/United-Perception/blob/52aaeb9ed27a490820696d7754d19f98cd6ecd11/up/runner/base_runner.py#L394","code":"    @torch.no_grad()\n    def _inference(self):\n        self.model.cuda().eval()\n        test_loader = self.data_loaders['test']\n        all_results_list = []\n        test_resume = ((hasattr(test_loader.dataset, 'test_resume')) and (test_loader.dataset.test_resume is True))\n        if test_resume:\n            assert self.memory_friendly_infer, \\\n                'If you want to resume your test results files, \\\n                you must always inference it with memory_friendly_infer=True'\n        if self.memory_friendly_infer:\n            writer = self._prepare_writer(resume=test_resume)\n        for _ in range(test_loader.get_epoch_size()):\n            batch = self.get_batch('test')\n            output = self.forward_eval(batch)\n            dump_results = test_loader.dataset.dump(output)\n            if self.memory_friendly_infer:\n                self._results2disk(dump_results, writer)\n            else:\n                all_results_list.append(dump_results)\n        barrier()\n        all_device_results_list = None\n        if not self.memory_friendly_infer:\n            all_device_results_list = []\n            group = self.config['saver'].get('gather_group', 1)\n            if group > 1:\n                results_size = len(all_result
