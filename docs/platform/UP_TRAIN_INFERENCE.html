ction over Union/First/Second area\n    \"\"\"\n    if b1.numel() == 0 or b2.numel() == 0:\n        return b1.new_zeros((0,))\n\n    flag = {'IoU': 0, 'IoF': 1, 'IoS': 2}[mode]\n\n    assert b1.shape[1] >= 4 and b2.shape[1] >= 4\n    assert b1.is_cuda and b2.is_cuda\n\n    b1 = b1[:, :4].contiguous()\n    b2 = b2[:, :4].contiguous()\n    ious = b1.new_zeros((b1.shape[0], b2.shape[0]))\n    overlaps.iou(b1, b2, ious, flag)\n    return ious","limited":false,"property":false},"up/tasks/det/models/losses/entropy_loss.py::SigmoidCrossEntropyLoss.forward":{"id":"up/tasks/det/models/losses/entropy_loss.py::SigmoidCrossEntropyLoss.forward","name":"SigmoidCrossEntropyLoss.forward","path":"up/tasks/det/models/losses/entropy_loss.py","line":109,"end":123,"meaning":"把预测和目标交给二元交叉熵，再按配置归一化。","kind":"compute","hardware":"PyTorch BCE 相关计算。","url":"https://github.com/ModelTC/United-Perception/blob/52aaeb9ed27a490820696d7754d19f98cd6ecd11/up/tasks/det/models/losses/entropy_loss.py#L109","code":"    def forward(self, input, target, reduction, normalizer=None):\n        input = input.reshape(-1)\n        target = target.reshape(-1)\n        sample_mask = (target != self.ignore_index)\n        loss = F.binary_cross_entropy_with_logits(input, target.float(), reduction='none')\n\n        # Don't multiply sample mask if no sample is ignored\n        # this is for performance optimization\n        if (~sample_mask).sum() > 0:\n            loss = loss * sample_mask.float()\n\n        if normalizer is None:\n            normalizer = max(1, sample_mask.sum().item())\n\n        return _reduce(loss, reduction, normalizer=normalizer)","limited":false,"property":false},"up/tasks/det/models/losses/iou_loss.py::IOULoss.forward":{"id":"up/tasks/det/models/losses/iou_loss.py::IOULoss.forward","name":"IOULoss.forward","path":"up/tasks/det/models/losses/iou_loss.py","line":168,"end":183,"meaning":"用预测框与目标框的 IoU 计算定位损失，并加上权重和归一化。","kind":"compute","hardware":"框坐标和 Tensor 归约运算。","url":"https://github.com/ModelTC/United-Perception/blob/52aaeb9ed27a490820696d7754d19f98cd6ecd11/up/tasks/det/models/losses/iou_loss.py#L168","code":"    def forward(self, input, target, reduction, normalizer=None, weights=None, anchor=None, bbox_normalize=None):\n        \"\"\"\n        Arguments:\n            - input (:obj:`FloatTensor`), proposals [x1, y1, x2, y2], note the proposals must\n              be in the computation graph.\n            - target (:obj:`FloatTensor`), gt bboxes [x1, y2, x2, y2]\n            - weights (:obj:`FloatTensor`), iou loss weights\n        \"\"\"\n        if anchor is not None:\n            if bbox_normalize is not None:\n                input = unnormalize_offset(input, bbox_normalize[\"means\"], bbox_normalize[\"stds\"])\n                target = unnormalize_offset(target, bbox_normalize['means'], bbox_normalize['stds'])\n            input = offset2bbox(anchor, input)\n            target = offset2bbox(anchor, target)\n        loss = iou_loss(input, target, loss_type=self.loss_type, reduction='none', weights=weights)\n        return _reduce(loss, reduction=reduction, normalizer=normalizer)","limited":false,"property":false},"up/tasks/det/plugins/yolox/models/postprocess/roi_predictor.py::YoloXPredictor.predict":{"id":"up/tasks/det/plugins/yolox/models/postprocess/roi_predictor.py::YoloXPredictor.predict","name":"YoloXPredictor.predict","path":"up/tasks/det/plugins/yolox/models/postprocess/roi_predictor.py","line":19,"end":67,"meaning":"将各尺度预测合并、解码、按分数筛选，执行 NMS，返回七列检测结果。","kind":"compute","hardware":"max、索引、拼接、TorchVision NMS，以及 new_zeros/new_full。","url":"https://github.com/ModelTC/United-Perception/blob/52aaeb9ed27a490820696d7754d19f98cd6ecd11/up/tasks/det/plugins/yolox/models/postprocess/roi_predictor.py#L19","code":"    @torch.no_grad()\n    def predict(self, preds):\n        max_wh = 4096\n        preds = [torch.cat(p, dim=2) for p in preds]\n        preds = torch.cat(preds, dim=1)\n        x1 = preds[..., self.num_classes] - preds[..., self.num_classes + 2] / 2\n        y1 = preds[..., self.num_classes + 1] - preds[..., self.num_classes + 3] / 2\n        x2 = preds[..., self.num_classes] + preds[..., self.num_classes + 2] / 2\n        y2 = preds[..., self.num_classes + 1] + preds[..., self.num_classes + 3] / 2\n        preds[..., self.num_classes] = x1\n        preds[..., self.num_classes + 1] = y1\n        preds[..., self.num_classes + 2] = x2\n        preds[..., self.num_classes + 3] = y2\n\n        B = preds.shape[0]\n        det_results = []\n        for b_ix in range(B):\n            pred_per_img = preds[b_ix]\n            class_conf, class_pred = torch.max(pred_per_img[:, :self.num_classes], 1, keepdim=True)\n\n            conf_mask = (class_conf.squeeze() >= self.pre_nms_score_thresh).squeeze()\n            detections = torch.cat((pred_per_img[:, self.num_classes:-1], class_conf, class_pred.float()), 1)\n            detections = detections[conf_mask]\n            if not detections.size(0):\n                continue\n\n            # batch nms\n            cls_hash = detections[:, -1].unsqueeze(-1) * max_wh\n\n            boxes = detections[:, :4] + cls_hash\n            scores = detections[:, 4:5]  # .unsqueeze(-1)\n            res, keep = nms(torch.cat([boxes, scores], 1), self.nms_cfg)","limited":true,"property":false},"up/tasks/det/models/utils/nms_wrapper.py::nms":{"id":"up/tasks/det/models/utils/nms_wrapper.py::nms","name":"nms","path":"up/tasks/det/models/utils/nms_wrapper.py","line":4,"end":7,"meaning":"从 NMS 配置读取阈值，调用 TorchVision NMS，并返回保留下来的框与索引。","kind":"compute","hardware":"原版这里直接用 torchvision.ops.nms；设备随输入。","url":"https://github.com/ModelTC/United-Perception/blob/52aaeb9ed27a490820696d7754d19f98cd6ecd11/up/tasks/det/models/utils/nms_wrapper.py#L4","code":"def nms(cls_rois, nms_cfg={}):\n    thresh = nms_cfg.get('nms_iou_thresh', 0.5)\n    idx = t_nms(cls_rois[:, :4], cls_rois[:, 4], thresh)\n    return cls_rois[idx], idx","limited":false,"property":false},"up/tasks/det/plugins/yolox/utils/lr_helper.py::YoloXLRScheduler.update_scheduler_kwargs":{"id":"up/tasks/det/plugins/yolox/utils/lr_helper.py::YoloXLRScheduler.update_scheduler_kwargs","name":"YoloXLRScheduler.update_scheduler_kwargs","path":"up/tasks/det/plugins/yolox/utils/lr_helper.py","line":57,"end":65,"meaning":"为 YOLOX 学习率曲线填入每轮步数、预热和最后无增强阶段的长度。","kind":"cpu","hardware":"这是构建训练配方的一部分。","url":"https://github.com/ModelTC/United-Perception/blob/52aaeb9ed27a490820696d7754d19f98cd6ecd11/up/tasks/det/plugins/yolox/utils/lr_helper.py#L57","code":"    def update_scheduler_kwargs(self):\n        self.cfg_scheduler['kwargs']['optimizer'] = self.optimizer\n        self.cfg_scheduler['kwargs']['warmup_total_iters'] = max(\n            self.cfg_scheduler.get(\n                'warmup_iter', 0), self.cfg_scheduler.get(\n                'warmup_epochs', 0) * self.data_size)\n        self.cfg_scheduler['kwargs']['no_aug_iters'] = self.cfg_scheduler['kwargs'].get(\n            'no_aug_epoch', 0) * self.data_size\n        self.cfg_scheduler['kwargs']['total_iters'] = self.cfg_scheduler['kwargs'].get('T_max', 0) * self.data_size","limited":false,"property":false},"up/tasks/det/plugins/yolox/utils/lr_helper.py::YoloXCosineLR.calculate_lr":{"id":"up/tasks/det/plugins/yolox/utils/lr_helper.py::YoloXCosineLR.calculate_lr","name":"YoloXCosineLR.calculate_lr","path":"up/tasks/det/plugins/yolox/utils/lr_helper.py","line":26,"end":36,"meaning":"按当前步数计算 YOLOX 的 warmup、余弦下降或末尾固定学习率。","kind":"cpu","hardware":"只算学习率数值。","url":"https://github.com/ModelTC/United-Perception/blob/52aaeb9ed27a490820696d7754d19f98cd6ecd11/up/tasks/det/plugins/yolox/utils/lr_helper.py#L26","code":"    def calculate_lr(self, lr):\n        min_lr = lr * self.min_lr_scale\n        if self.last_epoch >= self.total_iters - self.no_aug_iters:\n            lr = min_lr\n        else:\n            lr = min_lr + 0.5 * (lr - min_lr) * (1.0 + math.cos(\n                math.pi * (self.last_epoch - self.warmup_total_iters)\n                / (self.total_iters - self.warmup_total_iters - self.no_aug_iters)\n            )\n            )\n        return lr","limited":false,"property":false},"up/models/backbones/resnet.py::ResNet.forward":{"id":"up/models/backbones/resnet.py::ResNet.forward","name":"ResNet.forward","path":"up/models/backbones/resnet.py","line":727,"end":757,"meaning":"依次执行各个 stage，返回配置要求的特征图；可选激活重算。","kind":"compute","hardware":"卷积、BN、激活、池化；重算会在反向时再跑部分前向。","url":"https://github.com/ModelTC/United-Perception/blob/52aaeb9ed27a490820696d7754d19f98cd6ecd11/up/models/backbones/resnet.py#L727","code":"    def forward(self, input):\n        \"\"\"\n\n        Arguments:\n            - input (:obj:`dict`): output of\n              :class:`~root.datasets.base_dataset.BaseDataset`\n\n        Returns:\n            - out (:obj:`dict`):\n\n        Output example::\n\n            {\n                'features': [], # list of tenosr\n                'strides': []   # list of int\n            }\n        \"\"\"\n        x = input['image']\n        outs = []\n        for layer_idx in range(0, 5):\n            layer = getattr(self, f'layer{layer_idx}', None)\n            if layer is not None:  # layer4 is None for C4 backbone\n                # Use checkpoint for learnable layer\n                if self.segments[layer_idx] > 0 and layer_idx not in self.frozen_layers:\n                    x = self.checkpoint_fwd(layer, x, self.segments[layer_idx])\n                else:\n                    x = layer(x)\n                outs.append(x)\n\n        features = [outs[i] for i in self.out_layers]\n        return {'features': features, 'strides': self.get_outstrides()}","limited":false,"property":false},"up/models/backbones/resnet.py::Bottleneck.forward":{"id":"up/models/backbones/resnet.py::Bottleneck.forward","name":"Bottleneck.forward","path":"up/models/backbones/resnet.py","line":314,"end":337,"meaning":"执行三层卷积和归一化，再加上捷径分支。","kind":"compute","hardware":"卷积、BN、ReLU 和残差相加。","url":"https://github.com/ModelTC/United-Perception/blob/52aaeb9ed27a490820696d7754d19f98cd6ecd11/up/models/backbones/resnet.py#L314","code":"    def forward(self, x):\n        residual = x\n\n        out = self.conv1(x)\n        out = self.norm1(out)\n        out = self.relu(out)\n\n        out = self.conv2(out)\n        out = self.norm2(out)\n        out = self.relu(out)\n\n        out = self.conv3(out)\n        out = self.norm3(out)\n\n        if self.drop_path is not None:\n            out = self.drop_path(out)\n\n        if self.downsample is not None:\n            residual = self.downsample(x)\n\n        out += residual\n        out = self.relu(out)\n\n        return out","limited":false,"property":false},"up/models/backbones/vision_transformer.py::VisionTransformer.forward":{"id":"up/models/backbones/vision_transformer.py::VisionTransformer.forward","name":"VisionTransformer.forward","path":"up/models/backbones/vision_transformer.py","line":250,"end":286,"meaning":"把图像变成 Patch 序列，加入位置和分类 Token，依次执行 Transformer block。","kind":"compute","hardware":"Patch 卷积、拼接、Dropout、Attention 与归一化。","url":"https://github.com/ModelTC/United-Perception/blob/52aaeb9ed27a490820696d7754d19f98cd6ecd11/up/models/backbones/vision_transformer.py#L250","code":"    def forward(self, input):\n        img = input['image']\n        x = self.embedding(img)\n        patch_resolution = x.shape[2:]\n        x = x.flatten(2).transpose(1, 2)\n        # x shape: [B, N, K]\n\n        if self.classifier == 'token':\n            cls_tokens = self.cls_token.expand(img.shape[0], -1, -1)\n            x = torch.cat((cls_tokens, x), dim=1)\n            # x shape: [B, N+1, K]\n\n        x += self.pos_embedding\n        x = self.dropout(x)\n\n        # transformer main body\n        outs = []\n        out_strides = []\n        for i, layer in enumerate(self.layers):\n            x = layer(x)\n\n            if i == len(self.layers) - 1 and self.encoder_norm and self.last_norm:\n                x = self.encoder_norm(x)\n\n            if i in self.out_indices:\n                B, _, C = x.shape\n                patch_token = x[:, 1:].reshape(B, *patch_resolution, C)\n                patch_token = patch_token.permute(0, 3, 1, 2)\n                cls_token = x[:, 0]\n                if self.classifier == 'token':\n                    out = [patch_token, cls_token]\n                else:","limited":true,"property":false},"up/models/backbones/vision_transformer.py::Encoder1DBlock.forward":{"id":"up/models/backbones/vision_transformer.py::Encoder1DBlock.forward","name":"Encoder1DBlock.forward","path":"up/models/backbones/vision_transformer.py","line":101,"end":115,"meaning":"先做归一化和 Attention，再做归一化和 MLP，两处都带残差。","kind":"compute","hardware":"LayerNorm、Attention、MLP，以及可选 DropPath。","url":"https://github.com/ModelTC/United-Perception/blob/52aaeb9ed27a490820696d7754d19f98cd6ecd11/up/models/backbones/vision_transformer.py#L101","code":"    def forward(self, x):\n\n        residual = x\n        x = self.norm1(x)\n        x = self.attention(x)\n        if self.drop_path is not None:\n            x = self.drop_path(x)\n        x = x + residual\n\n        y = self.norm2(x)\n        y = self.feedforward(y)\n        if self.drop_path is not None:\n            y = self.drop_path(y)\n\n        return x + y","limited":false,"property":false},"up/models/backbones/vision_transformer.py::MultiHeadAttention.forward":{"id":"up/models/backbones/vision_transformer.py::MultiHeadAttention.forward","name":"MultiHeadAttention.forward","path":"up/models/backbones/vision_transformer.py","line":76,"end":88,"meaning":"先算 Q/K/V，再用 Q 与 K 得到注意力权重，乘 V 后投影回输出。","kind":"compute","hardware":"Linear、矩阵乘 @、softmax、Dropout。","url":"https://github.com/ModelTC/United-Perception/blob/52aaeb9ed27a490820696d7754d19f98cd6ecd11/up/models/backbones/vision_transformer.py#L76","code":"    def forward(self, x):\n        B, N, C = x.shape\n        qkv = self.to_qkv(x).reshape(B, N, 3, self.heads, C // self.heads).permute(2, 0, 3, 1, 4)\n        q, k, v = qkv[0], qkv[1], qkv[2]\n\n        attn = (q @ k.transpose(-2, -1)) * self.scale\n        attn = attn.softmax(dim=-1)\n        attn = self.attention_dropout(attn)\n\n        x = (attn @ v).transpose(1, 2).reshape(B, N, C)\n        x = self.to_out(x)\n        x = self.dropout(x)\n        return x","limited":false,"property":false},"up/models/backbones/vision_transformer.py::FeedForward.forward":{"id":"up/models/backbones/vision_transformer.py::FeedForward.forward","name":"FeedForward.forward","path":"up/models/backbones/vision_transformer.py","line":48,"end":55,"meaning":"用两层 Linear 和中间激活进一步变换每个 Token。","kind":"compute","hardware":"Linear、GELU、Dropout。","url":"https://github.com/ModelTC/United-Perception/blob/52aaeb9ed27a490820696d7754d19f98cd6ecd11/up/models/backbones/vision_transformer.py#L48","code":"    def forward(self, x):\n        x = self.mlp1(x)\n        x = self.act(x)\n        x = self.dropout(x)\n\n        x = self.mlp2(x)\n        x = self.dropout(x)\n        return x","limited":false,"property":false},"up/models/backbones/vision_transformer.py::GELU.forward":{"id":"up/models/backbones/vision_transformer.py::GELU.forward","name":"GELU.forward","path":"up/models/backbones/vision_transformer.py","line":30,"end":35,"meaning":"按公式实现 GELU 激活。","kind":"compute","hardware":"tanh/pow 或 erf；这些基础运算也会在 GPU 上执行。","url":"https://github.com/ModelTC/United-Perception/blob/52aaeb9ed27a490820696d7754d19f98cd6ecd11/up/models/backbones/vision_transformer.py#L30","code":"    def forward(self, x):\n        if self.approximate:\n            cdf = 0.5 * (1.0 + torch.tanh(math.sqrt(2 / math.pi) * (x + 0.044715 * torch.pow(x, 3))))\n            return x * cdf\n        else:\n            return x * (torch.erf(x / math.sqrt(2)) + 1) / 2","limited":false,"property":false},"up/tasks/cls/models/heads/cls_head.py::BaseClsHead.forward":{"id":"up/tasks/cls/models/heads/cls_head.py::BaseClsHead.forward","name":"BaseClsHead.forward","path":"up/tasks/cls/models/heads/cls_head.py","line":99,"end":100,"meaning":"取出输入特征并调用分类 .py::BaseClsPostProcess.get_loss":{"id":"up/tasks/cls/models/postprocess/cls_postprocess.py::BaseClsPostProcess.get_loss","name":"BaseClsPostProcess.get_loss","path":"up/tasks/cls/models/postprocess/cls_postprocess.py","line":30,"end":46,"meaning":"调用配置中的分类损失并加上输出名称。","kind":"compute","hardware":"交叉熵、标签平滑等具体损失由 YAML 决定。","url":"https://github.com/ModelTC/United-Perception/blob/52aaeb9ed27a490820696d7754d19f98cd6ecd11/up/tasks/cls/models/postprocess/cls_postprocess.py#L30","code":"    def get_loss(self, logits, targets):\n        loss_info = {}\n        if isinstance(logits, list):\n            loss = 0\n            for idx, logit in enumerate(logits):\n                if isinstance(self.cls_loss, nn.ModuleList):\n                    assert len(logits) == len(self.cls_loss)\n                    loss = self.cls_loss[idx](logit, targets[:, idx])\n                else:\n                    loss = self.cls_loss(logit, targets[:, idx])\n                loss_info[f\"{self.prefix}_head_{idx}.loss\"] = loss\n                loss_info[f\"{self.prefix}_head_{idx}.accuracy\"] = self.get_acc(logit, targets[:, idx])\n        else:\n            loss = self.cls_loss(logits, targets)\n            loss_info[f\"{self.prefix}.loss\"] = loss\n            loss_info[f\"{self.prefix}.accuracy\"] = self.get_acc(logits, targets)\n        return loss_info","limited":false,"property":false},"up/tasks/cls/models/postprocess/cls_postprocess.py::BaseClsPostProcess.get_single_pred":{"id":"up/tasks/cls/models/postprocess/cls_postprocess.py::BaseClsPostProcess.get_single_pred","name":"BaseClsPostProcess.get_single_pred","path":"up/tasks/cls/models/postprocess/cls_postprocess.py","line":48,"end":52,"meaning":"对一组 logits 求 softmax，并取最大分数对应的类别。","kind":"compute","hardware":"softmax、topk。","url":"https://github.com/ModelTC/United-Perception/blob/52aaeb9ed27a490820696d7754d19f98cd6ecd11/up/tasks/cls/models/postprocess/cls_postprocess.py#L48","code":"    def get_single_pred(self, logit):\n        score = F.softmax(logit, dim=1)\n        _, pred = logit.data.topk(k=1, dim=1)\n        pred = pred.view(-1)\n        return score, pred","limited":false,"property":false},"up/utils/model/utils.py::drop_path":{"id":"up/utils/model/utils.py::drop_path","name":"drop_path","path":"up/utils/model/utils.py","line":65,"end":80,"meaning":"训练时为每个样本生成保留/丢弃掩码，随机跳过一条残差路径；评估时直接返回输入。","kind":"compute","hardware":"torch.rand(..., device=x.device)、floor 和乘除。","url":"https://github.com/ModelTC/United-Perception/blob/52aaeb9ed27a490820696d7754d19f98cd6ecd11/up/utils/model/utils.py#L65","code":"def drop_path(x, drop_prob: float = 0., training: bool = False):\n    \"\"\"Drop paths (Stochastic Depth) per sample (when applied in main path of residual blocks).\n    This is the same as the DropConnect impl I created for EfficientNet, etc networks, however,\n    the original name is misleading as 'Drop Connect' is a different form of dropout in a separate paper...\n    See discussion: https://github.com/tensorflow/tpu/issues/494#issuecomment-532968956 ... I've opted for\n    changing the layer and argument names to 'drop path' rather than mix DropConnect as a layer name and use\n    'survival rate' as the argument.\n    \"\"\"\n    if drop_prob == 0. or not training:\n        return x\n    keep_prob = 1 - drop_prob\n    shape = (x.shape[0],) + (1,) * (x.ndim - 1)  # work with diff dim tensors, not just 2D ConvNets\n    random_tensor = keep_prob + torch.rand(shape, dtype=x.dtype, device=x.device)\n    random_tensor.floor_()  # binarize\n    output = x.div(keep_prob) * random_tensor\n    return output","limited":false,"property":false},"up/tasks/cls/data/cls_dataset.py::ClsDataset.get_input":{"id":"up/tasks/cls/data/cls_dataset.py::ClsDataset.get_input","name":"ClsDataset.get_input","path":"up/tasks/cls/data/cls_dataset.py","line":252,"end":275,"meaning":"按样本编号读取图片和分类标签。","kind":"cpu","hardware":"返回单张图片的数据字典。","url":"https://github.com/ModelTC/United-Perception/blob/52aaeb9ed27a490820696d7754d19f98c 'nvcc']).decode().rstrip('\\r\\n')\n    cuda_home = os.path.dirname(os.path.dirname(nvcc))\n    print(f'find cuda home:{cuda_home}')\n    return cuda_home","limited":false,"property":false},"setup.py::recursive_glob":{"id":"setup.py::recursive_glob","name":"recursive_glob","path":"setup.py","line":42,"end":46,"meaning":"递归收集 C++ 和 CUDA 源码文件。","kind":"cpu","hardware":"收集 .cpp、.cu。","url":"https://github.com/ModelTC/United-Perception/blob/52aaeb9ed27a490820696d7754d19f98cd6ecd11/setup.py#L42","code":"def recursive_glob(base_dir, pattern):\n    files = []\n    for root, subdirs, subfiles in os.walk(base_dir):\n        files += glob.glob(os.path.join(root, pattern))\n    return files","limited":false,"property":false},"setup.py::get_extensions":{"id":"setup.py::get_extensions","name":"get_extensions","path":"setup.py","line":49,"end":89,"meaning":"检查 CUDA 条件，创建 CUDAExtension，编译 up/extensions/csrc 下的源码。","kind":"runtime","hardware":"生成 up.extensions._C；原版要求 CUDA 环境。","url":"https://github.com/ModelTC/United-Perception/blob/52aaeb9ed27a490820696d7754d19f98cd6ecd11/setup.py#L49","code":"def get_extensions():\n    this_dir = os.path.dirname(os.path.abspath(__file__))\n    sources_dir = os.path.join(this_dir, CORE_DIR, EXT_DIR, \"csrc\")\n\n    source_cpu = recursive_glob(sources_dir, \"*.cpp\")\n    source_cuda = recursive_glob(sources_dir, \"*.cu\")\n\n    sources = source_cpu\n    extension = CppExtension\n\n    extra_compile_args = {\"cxx\": []}\n    define_macros = []\n    assert torch.cuda.is_available() and CUDA_HOME is not None\n\n    if torch.cuda.is_available() and CUDA_HOME is not None:\n        extension = CUDAExtension\n        sources += source_cuda\n        define_macros += [(\"WITH_CUDA\", None)]\n        extra_compile_args[\"nvcc\"] = [\n            \"-DCUDA_HAS_FP16=1\",\n            \"-D__CUDA_NO_HALF_OPERATORS__\",\n            \"-D__CUDA_NO_HALF_CONVERSIONS__\",\n            \"-D__CUDA_NO_HALF2_OPERATORS__\",\n        ]\n\n    # sources = [os.path.join(e ame":"RoIAlignFunction.backward","path":"up/extensions/python/roi_align.py","line":58,"end":84,"meaning":"根据输出梯度计算输入特征图的梯度，调用原生反向实现。","kind":"compute","hardware":"自定义 GPU 扩展反向。","url":"https://github.com/ModelTC/United-Perception/blob/52aaeb9ed27a490820696d7754d19f98cd6ecd11/up/extensions/python/roi_align.py#L58","code":"    @staticmethod\n    def backward(self, grad_output):\n        grad_output = grad_output.data\n        feature, rois = self.saved_tensors\n\n        batch_size, num_channels, data_height, data_width = feature.shape\n        grad_input = feature.new(batch_size, num_channels, data_height, data_width).zero_()\n        if grad_output.data.numel() == 0:\n            return grad_input, None, None, None, None, None, None\n        if not grad_output.is_contiguous():\n            grad_output = grad_output.contiguous()\n        assert(grad_output.is_contiguous())\n        assert(rois.is_contiguous())\n\n        if self.pooled_mode == 'AVG':\n            backward_fn = roi_align.backward_avg_cuda\n            backward_fn(\n                ALIGNED_FLAG.aligned, self.pooled_h, self.pooled_w, self.spatial_scale,\n                self.sampling_ratio, grad_output, rois, grad_input)\n        elif self.pooled_mode == 'MAX':\n            backward_fn = roi_align.backward_max_cuda\n            backward_fn(\n                ALIGNED_FLAG.aligned, self.pooled_h, self.pooled_w, self.spatial_scale,\n                self.sampling_ratio, grad_output, rois, grad_input, feature)\n        else:\n            raise KeyError\n\n        return grad_input, None, None, None, None, None, None","limited":false,"property":false},"up/extensions/python/nms.py::naive_nms":{"id":"up/extensions/python/nms.py::naive_nms","name":"naive_nms","path":"up/extensions/python/nms.py","line":9,"end":26,"meaning":"整理缓冲区并选择原版 CPU/GPU NMS 扩展分支。","kind":"mixed","hardware":"独立扩展入口；与 YOLOX 的 TorchVision nms_wrapper 分开。","url":"https://github.com/ModelTC/United-Perception/blob/52aaeb9ed27a490820696d7754d19f98cd6ecd11/up/extensions/python/nms.py#L9","code":"def naive_nms(dets, thresh):\n    assert dets.shape[1] == 5\n    num_dets = dets.shape[0]\n    if torch.is_tensor(num_dets):\n        num_dets = num_dets.item()\n    keep = torch.LongTensor(num_dets)\n    num_out = torch.LongTensor(1)\n    if dets.device.type == 'cuda':\n        nms.gpu_nms(keep, num_out, dets.float(), thresh, ALIGNED_FLAG.offset)\n    else:\n        x1 = dets[:, 0]\n        y1 = dets[:, 1]\n        x2 = dets[:, 2]\n        y2 = dets[:, 3]\n        areas = (x2 - x1 + ALIGNED_FLAG.offset) * (y2 - y1 + ALIGNED_FLAG.offset)\n        order = torch.from_numpy(np.arange(dets.shape[0])).long()\n        nms.cpu_nms(keep, num_out, dets.float(), order, areas, thresh, ALIGNED_FLAG.offset)\n    return keep[:num_out[0]].contiguous().to(device=dets.device)","limited":false,"property":false}},"notionProgressUrl":"https://www.notion.so/40da6486ce2d81328ea3ee0ebee46fe8","updated":"2026-11-03"}</script>
<script>
'use strict';
const data=JSON.parse(document.getElementById('tutorial-data').textContent);
const main=document.getElementById('main'),nav=document.getElementById('nav'),search=document.getElementById('search'),onlyGpu=document.getElementById('gpu-only');
const kinds={cpu:'CPU 调度',runtime:'设备 / 运行时',transfer:'设备传输',compute:'GPU 计算',comm:'多卡通信',mixed:'按路径涉及 GPU'};
const routeNames={train:'一 · 训练，按执行顺序',eval:'二 · 训练内验证',inference:'三 · 独立图片推理',models:'四 · 进入模型内部',reference:'五 · 查阅与扩展入口'};
let mode='flow',selected='overview',selectedFile='',lastSelected='start';
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const allFunctions=Object.values(data.functions);
function badge(kind){return `<span class="badge ${kind}">${kinds[kind]}</span>`;}
function footer(){return `<footer class="footer">讲解依据原版 UP 提交 <a href="${data.sourceUrl}" target="_blank" rel="noopener">${data.commit}</a>。代码节选归 ModelTC/United-Perception，遵循原仓库 Apache-2.0 许可。${data.stages.length} 个阅读模块 · ${allFunctions.length} 个函数条目；GPU 标记指该函数涉及的操作，不是底层内核总数。<br>本页记录源码调用关系；运行效果、性能与精度实验在独立工作项中记录。</footer>`;}
function fnCard(f){return `<article class="function" data-fn="${esc(f.id)}"><div class="function-header"><h3>${esc(f.name)}${f.property?' · 属性':'()'}</h3>${badge(f.kind)}</div><div class="source-path">${esc(f.path)}:${f.line}</div><p class="meaning">${esc(f.meaning)}</p><p class="hardware"><strong>设备相关在哪里：</strong>${esc(f.hardware)}</p><details><summary>展开原版代码${f.limited?'（节选）':''}</summary><div class="codeblock"><pre><code>${esc(f.code)}</code></pre></div><div class="code-footer"><span>${f.limited?'显示前 32 行，完整函数见源码。':'本函数原版代码。'}${f.property?'这是属性，读取时不带括号。':''}</span><a class="source-link" href="${f.url}" target="_blank" rel="noopener">打开原版 L${f.line} ↗</a></div></details></article>`;}
function match(f){const q=search.value.trim().toLowerCase();return(!onlyGpu.checked||f.kind!=='cpu')&&(!q||`${f.name} ${f.path} ${f.meaning} ${f.hardware}`.toLowerCase().includes(q));}
function filtered(keys){return keys.map(id=>data.functions[id]).filter(match);}
function closeMenu(){document.getElementById('sidebar').classList.remove('open');document.getElementById('shade').classList.remove('open');document.getElementById('menu').setAttribute('aria-expanded','false');}
function view(id,reset=true){selected=id;if(id!=='overview')lastSelected=id;search.value='';mode='flow';updateMode();renderNav();render();closeMenu();if(reset)window.scrollTo({top:0,behavior:'instant'});location.hash=id;}
function renderOverview(){main.innerHTML=`<div class="eyebrow">从一张图片，走到一次参数更新</div><h1>先把 UP 的两条路走明白。</h1><p class="intro">train.py 和 inference.py 是入口。真正的工作分散在 Runner、数据加载器、模型和后处理里。左边按实际调用顺序展开；想对着仓库读，就切到“文件目录”。</p><div class="reading-route"><button data-view="start">读配置、启动进程</button><span class="arrow">→</span><button data-view="runner">准备数据和模型</button><span class="arrow">→</span><button data-view="step">训练一批</button><span class="arrow">→</span><button data-view="eval">验证与保存</button></div><div class="overview-grid"><button class="overview-item" data-view="start"><strong>01 训练怎么走</strong><span>命令 → Runner 初始化 → 取数据 → 算损失 → 反向 → 改权重。</span></button><button class="overview-item" data-view="eval"><strong>02 训练内 eval 怎么走</strong><span>遍历验证集，汇总预测，最后计算 Top-1 或 AP。</span></button><button class="overview-item" data-view="infer-start"><strong>03 独立推理怎么走</strong><span>读图片、加载权重、预测，最后画图保存。</span></button><button class="overview-item" data-view="yolox"><strong>04 模型里面还做了什么</strong><span>以 YOLOX 展开匹配、损失和 NMS，再看 ResNet / ViT。</span></button></div><h2>先认清 4 个东西</h2><table class="scope-table"><thead><tr><th>名字</th><th>人话解释</th></tr></thead><tbody><tr><td>配置 YAML</td><td>装配清单：用什么数据、什么模型、什么损失，训练多少轮。</td></tr><tr><td>Registry</td><td>名字查找表：配置写 yolox_s，就去找登记为 yolox_s 的类或函数。</td></tr><tr><td>Runner</td><td>训练总管：组织数据、前向、反向、优化器、验证和保存。</td></tr><tr><td>batch 字典</td><td>各模块接力传递的数据包：image → features → preds → loss / 检测结果。</td></tr></tbody></table><h2>哪些算“涉及 GPU”</h2><div class="legend">${badge('runtime')}${badge('transfer')}${badge('compute')}${badge('comm')}${badge('cpu')}</div><p class="fact">不仅是 .cuda()。卷积、Attention、损失、反向和参数更新，只要处理 GPU Tensor，也会在 GPU 上计算。</p><p class="fact">反过来，创建模块、查注册表、读配置、计算学习率，通常只是 CPU 上的组织工作。</p><div class="note">本页只读原版 UP，固定在 52aaeb9e。当前改造版的 runtime / platform 接口另行对照，不混进原版调用链。</div><div class="note">训练内验证与独立图片推理是两条外层流程：前者会算完整数据集指标，后者默认输出预测和可视化。</div>${footer()}`;}
function renderStage(){const stage=data.stages.find(s=>s.id===selected);if(!stage){selected='overview';renderOverview();return;}const funcs=filtered(stage.functions),index=data.stages.indexOf(stage),prev=data.stages[index-1],next=data.stages[index+1];main.innerHTML=`<div class="eyebrow">${esc(routeNames[stage.route])} / ${stage.number}</div><h1>${esc(stage.title)}</h1><p class="intro">${esc(stage.intro)}</p><section class="flowbox"><div class="box-head">调用顺序 · 从上往下读</div><pre class="tree">${esc(stage.sequence)}</pre></section>${stage.notes.map(n=>`<p class="note">${esc(n)}</p>`).join('')}<h2>逐个函数看</h2><p class="result-count">${funcs.length} 个函数${onlyGpu.checked?' · 已隐藏纯 CPU 调度项':''}。先看解释，需要时再展开原版代码。</p>${funcs.length?funcs.map(fnCard).join(''):'<p class="empty">这个模块没有符合当前筛选的函数。</p>'}<div class="reading-nav"><button data-view="${prev?prev.id:'overview'}"><small>← 上一步</small>${esc(prev?prev.title:'阅读总览')}</button><button data-view="${next?next.id:'overview'}"><small>${next?'下一步 →':'回到总览 →'}</small>${esc(next?next.title:'重新选择阅读路线')}</button></div>${footer()}`;}
function renderSearch(){const f=allFunctions.filter(match);main.innerHTML=`<div class="eyebrow">全页检索</div><h1>${search.value.trim()?`查找：${esc(search.value.trim())}`:'涉及 GPU 的函数'}</h1><p class="intro">结果同时匹配函数名、文件名和中文说明。这里每项都能展开原版代码。</p><p class="result-count">找到 ${f.length} 个函数条目。</p>${f.length?f.map(fnCard).join(''):'<p class="empty">没有找到。可以试试“梯度”“权重”“Attention”或“cuda”。</p>'}${footer()}`;}
function renderFile(){const f=allFunctions.filter(x=>x.path===selectedFile).filter(match);main.innerHTML=`<div class="eyebrow">按文件读代码</div><h1>${esc(selectedFile||'选择左侧文件')}</h1><p class="intro">这里列出该文件在训练、验证和推理导读中用到的函数，按原版源码行号排列。</p>${selectedFile?`<p class="file-actions"><a href="${data.sourceUrl+selectedFile}" target="_blank" rel="noopener">在 GitHub 打开整个原版文件 ↗</a></p>`:''}<p class="result-count">本页收录 ${f.length} 个函数。</p>${f.sort((a,b)=>a.line-b.line).map(fnCard).join('')}${footer()}`;}
function renderGpu(){const groups=[['runtime','设备与运行时','找卡、绑卡、随机种子、AMP 设置、显存和同步查询。'],['transfer','设备传输','模型、图片、标签、权重和预测在 CPU / GPU 之间流动。'],['compute','实际计算','模型前后向、损失、匹配、NMS、优化器与 EMA 更新。'],['comm','多卡通信','初始化进程组、梯度和统计量归约、预测结果汇总。'],['mixed','按路径涉及 GPU','同一个函数的设备取决于输入、配置和所选分支。']];main.innerHTML=`<div class="eyebrow">从调用链中找适配边界</div><h1>GPU 相关操作，分 5 类看。</h1><p class="intro">这里列的是原版调用链中的函数入口。一个入口可能触发很多底层算子；基础 Tensor 运算仍由 PyTorch 执行。</p>${groups.map(([k,t,d])=>`<h2>${esc(t)}</h2><p class="fact">${esc(d)}</p>${allFunctions.filter(f=>f.kind===k).map(fnCard).join('')}`).join('')}${footer()}`;}
function render(){if(search.value.trim())renderSearch();else if(mode==='files')renderFile();else if(mode==='gpu')renderGpu();else renderStage();}
function fileTree(files){const tree={};for(const path of files){let p=tree;const parts=path.split('/');parts.forEach((part,i)=>{if(i===parts.length-1)p[part]={$file:path};else p=p[part]??={};});}function node(obj,depth){return Object.entries(obj).sort(([a,av],[b,bv])=>Number(!!av.$file)-Number(!!bv.$file)||a.localeCompare(b)).map(([name,v])=>v.$file?`<button class="nav-item ${selectedFile===v.$file?'active':''}" data-file="${esc(v.$file)}"><span class="nav-title">${esc(name)}</span></button>`:`<details class="folder" ${depth<2?'open':''}><summary>${esc(name)}/</summary>${node(v,depth+1)}</details>`).join('');}return node(tree,0);}
function renderNav(){if(mode==='files'){nav.innerHTML=fileTree([...new Set(allFunctions.filter(match).map(f=>f.path))]);return;}if(mode==='gpu'){nav.innerHTML='<button class="nav-item active" data-gpu-home="true">GPU 入口分类清单</button><div class="sidebar-foot">可在上方搜索具体接口。<br>例如 cuda、NMS、通信、显存。</div>';return;}nav.innerHTML=`<button class="nav-item ${selected==='overview'?'active':''}" data-view="overview"><span class="num">◎</span><span class="nav-title">先看整体怎么走</span></button>`+Object.entries(routeNames).map(([route,title])=>`<div class="route-label">${title}</div>`+data.stages.filter(s=>s.route===route).map(s=>`<button class="nav-item ${selected===s.id?'active':''}" data-view="${s.id}"><span class="num">${s.number}</span><span class="nav-title">${esc(s.title)}</span></button>`).join('')).join('');}
function updateMode(){document.querySelectorAll('[data-mode]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.mode===mode)));}
document.addEventListener('click',e=>{const b=e.target.closest('[data-view],[data-file],[data-mode],[data-gpu-home]');if(!b)return;if(b.dataset.view)view(b.dataset.view);else if(b.dataset.file){selectedFile=b.dataset.file;renderNav();render();closeMenu();window.scrollTo({top:0,behavior:'instant'});}else if(b.dataset.mode){mode=b.dataset.mode;search.value='';if(mode==='files'&&!selectedFile)selectedFile='up/runner/base_runner.py';if(mode==='flow')selected=lastSelected;updateMode();renderNav();render();}else if(b.dataset.gpuHome){renderGpu();closeMenu();}});
search.addEventListener('input',()=>{render();if(mode==='files')renderNav();});onlyGpu.addEventListener('change',()=>{render();renderNav();});
document.getElementById('menu').addEventListener('click',()=>{const open=document.getElementById('sidebar').classList.toggle('open');document.getElementById('shade').classList.toggle('open',open);document.getElementById('menu').setAttribute('aria-expanded',String(open));});document.getElementById('shade').addEventListener('click',closeMenu);document.addEventListener('keydown',e=>{if(e.key==='Escape')closeMenu();});
const initial=location.hash.slice(1);if(initial==='overview'||data.stages.some(s=>s.id===initial))selected=initial;else selected='overview';
if(selected!=='overview')lastSelected=selected;
if(data.notionProgressUrl)document.getElementById('progress-link').href=data.notionProgressUrl;
renderNav();if(selected==='overview')renderOverview();else renderStage();
window.addEventListener('hashchange',()=>{const id=location.hash.slice(1);if(id!==selected&&(id==='overview'||data.stages.some(s=>s.id===id))){selected=id;mode='flow';search.value='';updateMode();renderNav();if(id==='overview')renderOverview();else renderStage();}});
</script>
</body>
