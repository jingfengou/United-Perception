elper.py::get_rank","up/utils/env/dist_helper.py::get_world_size","up/utils/env/dist_helper.py::get_local_rank","up/utils/env/dist_helper.py::get_dist_rank","up/utils/env/dist_helper.py::get_dist_world_size","up/utils/env/dist_helper.py::barrier","up/utils/env/dist_helper.py::finalize"],"notes":["rank 是“第几个进程”，local_rank 是“这台机器上的第几张卡”，world_size 是“总共有几个进程”。","这里按原版的真实顺序展示：_distributed_worker 先初始化进程组，后 set_device。"]},{"id":"runner","route":"train","number":"03","title":"Runner 开始准备整场训练","intro":"Runner 可以理解成训练总管。它把数据、模型、优化器和保存工具准备好，之后才进入反复训练。","sequence":"BaseRunner.__init__()\n├─ upgrade_config() → set_default_cfg()\n└─ build()，严格按以下顺序\n   1 build_env()          2 get_git_version()\n   3 build_dataloaders()  4 prepare_fp16()\n   5 build_model()        6 build_trainer()\n   7 build_saver()        8 build_hooks()\n   9 build_ema()         10 resume_model()\n  11 prepare_dist_model()\n  12 get_env_info() → save_running_cfg()","functions":["up/runner/base_runner.py::BaseRunner.__init__","up/runner/base_runner.py::BaseRunner.upgrade_config","up/runner/base_runner.py::BaseRunner.set_default_cfg","up/runner/base_runner.py::BaseRunner.build","up/runner/base_runner.py::BaseRunner.build_global_flags","up/runner/base_runner.py::BaseRunner.build_env","up/runner/base_runner.py::BaseRunner.get_git_version","up/runner/base_runner.py::BaseRunner.save_running_cfg","up/utils/general/cfg_helper.py::merge_opts_into_cfg","up/utils/env/gene_env.py::set_random_seed","up/utils/env/gene_env.py::get_env_info"],"notes":["种子控制随机数序列；卷积、归约等内核的计算顺序还受底层实现影响。","原版没有 setup_runtime() 或 up_platform 入口。本页所有函数和链接都取自原版提交。"]},{"id":"data","route":"train","number":"04","title":"准备数据：从图片到一个 batch","intro":"这一步把磁盘上的图片和标注变成 Tensor，并把若干张图片拼成一批。训练的常规数据读取与增强先在 CPU 完成。","sequence":"build_dataloaders()\n└─ BaseDataLoaderBuilder.build_dataloader()\n   ├─ build_dataset() → CocoDataset / ClsDataset\n   ├─ build_batch_sampler() → build_sampler()\n   └─ DataLoader\n\n每次 next(iterator) 时\n└─ Dataset.__getitem__(index)\n   ├─ get_input() → image_reader → 读图和标注\n   ├─ transformer：缩放、翻转、转 Tensor 等\n   └─ DataLoader._collate_fn() → BatchPad → batch 字典","functions":["up/runner/base_runner.py::BaseRunner.build_dataloaders","up/runner/base_runner.py::BaseRunner.build_dataloaders.build","up/runner/base_runner.py::BaseRunner._check_data_pool","up/runner/base_runner.py::BaseRunner.set_dataset_timer","up/runner/base_runner.py::BaseRunner.set_train_epoch_size","up/runner/base_runner.py::BaseRunner.set_train_batch_size","up/data/data_builder.py::BaseDataLoaderBuilder.build_dataloader","up/data/data_builder.py::BaseDataLoaderBuilder.parse_data_source","up/data/data_builder.py::BaseDataLoaderBuilder.update_cfg","up/data/data_builder.py::BaseDataLoaderBuilder.build_dataset","up/data/data_builder.py::BaseDataLoaderBuilder.build_sampler","up/data/data_builder.py::BaseDataLoaderBuilder.build_batch_sampler","up/data/data_builder.py::BaseDataLoaderBuilder.generate_cfg_dataloader","up/tasks/det/data/datasets/coco_dataset.py::CocoDataset.__init__","up/tasks/det/data/datasets/coco_dataset.py::CocoDataset.get_input","up/tasks/det/data/datasets/coco_dataset.py::CocoDataset.__getitem__","up/data/data_loader.py::BaseDataLoader.__init__","up/data/data_loader.py::BaseDataLoader._collate_fn","up/tasks/det/data/datasets/det_transforms.py::BatchPad.__call__","up/data/datasets/transforms.py::build_transformer","up/data/image_reader.py::ImageReader.read","up/data/image_reader.py::ImageReader.__call__","up/data/image_reader.py::FileSystemCVReader.fs_read"],"notes":["图片张量和文件名不是一回事：只有 Tensor 会在后面的 batch2device() 中迁移到 GPU。","具体增强由 YAML 决定。YOLOX 的 mosaic、mixup 等在数据链里；某些配置中的额外 GPU 缩放在模型链里。"]},{"id":"model-build","route":"train","number":"05","title":"按 YAML 把模型拼起来，再搬到 GPU","intro":"net 列表就像模型的装配清单。ModelHelper 按顺序创建各部分，后面也按这个顺序传递数据。","sequence":"build_model()\n└─ ModelHelper(config.net)\n   ├─ split_cfg()：分离模型清单和自身配置\n   ├─ 对每个子模块 build(type, kwargs)\n   │  └─ Registry.build() / 直接导入指定的类\n   ├─ add_module(name, module)\n   └─ freeze_parameters() / train()\n→ model.cuda()\n→ 可选 special_bn_init()","functions":["up/runner/base_runner.py::BaseRunner.build_model","up/runner/base_runner.py::BaseRunner.special_bn_init","up/models/model_helper.py::ModelHelper.__init__","up/models/model_helper.py::ModelHelper.split_cfg","up/models/model_helper.py::ModelHelper.build","up/models/model_helper.py::ModelHelper._init_functional","up/models/model_helper.py::ModelHelper.freeze_parameters","up/models/model_helper.py::ModelHelper.cuda","up/models/model_helper.py::ModelHelper.train","up/utils/model/normalize.py::build_norm_layer","up/utils/model/normalize.py::build_conv_norm"],"notes":["原版 YOLOX-small 的顺序是 backbone → neck → roi_head → yolox_post。最后一个模块训练时算损失，评估时算检测结果。"]},{"id":"optimizer","route":"train","number":"06","title":"准备优化器、学习率和 AMP","intro":"优化器决定怎样改权重；学习率决定每次改多大；AMP 决定适合的计算是否用较低精度。创建对象和实际更新参数是两步。","sequence":"prepare_fp16()：在 build_model() 前准备 scaler\nbuild_trainer()\n├─ build_optimizer()\n│  └─ get_trainable_params() → get_optimizer()\n└─ build_lr_scheduler()\n   └─ BaseLRScheduler.build_scheduler()\n      ├─ 标准学习率曲线\n      └─ warmup → 接到同一个按步调度器","functions":["up/runner/base_runner.py::BaseRunner.prepare_fp16","up/runner/base_runner.py::BaseRunner.build_trainer","up/runner/base_runner.py::BaseRunner.update_optimizer_cfg","up/runner/base_runner.py::BaseRunner.build_optimizer","up/runner/base_runner.py::BaseRunner.build_lr_scheduler","up/utils/model/optimizer_helper.py::BaseOptimizer.build_optimizer","up/utils/model/optimizer_helper.py::BaseOptimizer.get_trainable_params","up/utils/model/optimizer_helper.py::BaseOptimizer.param_group_all","up/utils/model/optimizer_helper.py::BaseOptimizer.get_optimizer","up/utils/model/optimizer_helper.py::build_cls_instance","up/utils/model/lr_helper.py::BaseLRScheduler.build_scheduler","up/utils/model/lr_helper.py::BaseLRScheduler.update_scheduler_kwargs","up/utils/model/lr_helper.py::BaseWarmScheduler.build_warmup_scheduler","up/utils/model/lr_helper.py::BaseLRScheduler.build_scheduler.ChainIterLR.get_lr"],"notes":["AMP 是自动混合精度：部分运算使用 FP16，另一些保留 FP32。PyTorch 这条路线不等于把整个模型直接 half()。","YOLOX-small 选择自己的 yolox_base 调度器，下面的模型模块中列出其具体函数。"]},{"id":"restore","route":"train","number":"07","title":"加载权重，准备 EMA 和多卡同步","intro":"这一步区分“从头开始”“只加载预训练权重”和“接着上次继续训练”。恢复训练还要恢复优化器和学习率位置。","sequence":"build_saver() → build_hooks() → build_ema()\nresume_model()\n├─ Saver.load_pretrain_or_resume()\n│  └─ load_checkpoint() → process_checkpoint()\n├─ model.load()\n└─ 可选恢复 optimizer / lr_scheduler / scaler / EMA\nprepare_dist_model()\n├─ 多卡时包装 DDP\n└─ 设置采样器开始位置","functions":["up/runner/base_runner.py::BaseRunner.build_saver","up/runner/base_runner.py::BaseRunner.build_hooks","up/runner/base_runner.py::BaseRunner._remove_hooks","up/runner/base_runner.py::BaseRunner.build_ema","up/runner/base_runner.py::BaseRunner.build_fake_model","up/runner/base_runner.py::BaseRunner.resume_model","up/runner/base_runner.py::BaseRunner.resume_fp16","up/runner/base_runner.py::BaseRunner.prepare_dist_model","up/utils/general/saver_helper.py::Saver.load_pretrain_or_resume","up/utils/general/saver_helper.py::Saver.find_last_checkpoint","up/utils/general/saver_helper.py::Saver.load_checkpoint","up/utils/general/saver_helper.py::Saver.process_checkpoint","up/models/model_helper.py::ModelHelper.load","up/models/model_helper.py::ModelHelper.check_keys","up/models/model_helper.py::ModelHelper.check_share_keys_size","up/models/model_helper.py::ModelHelper.display_info","up/models/model_helper.py::ModelHelper.load_state_dict","up/utils/model/ema_helper.py::EMA.__init__","up/utils/model/ema_helper.py::EMA.load_state_dict"],"notes":["原版 load_checkpoint() 直接使用 CUDA，不能写成“原版先加载 CPU”。","训练、验证和独立推理比较时，还要核对使用的是普通权重还是 EMA 权重。"]},{"id":"step","route":"train","number":"08","title":"训练一批：数据 → 损失 → 梯度 → 新权重","intro":"前面都是准备。这一段才会反复执行，也是 GPU 计算最集中的位置。","sequence":"train()\n├─ before_train → model.cuda().train()\n└─ for 每一个 iteration\n   1 get_batch(\"train\") → batch2device()\n   2 forward_train() → forward() → forward_model()\n     └─ ModelHelper.forward() → backbone → neck/head → loss\n   3 backward(loss)\n   4 update()\n   5 可选 ema.step()\n   6 到验证时点 → evaluate() → model.train()\n   7 到保存时点 → save()\n   8 lr_scheduler.step()\n→ after_train","functions":["up/runner/base_runner.py::BaseRunner.train","up/runner/base_runner.py::BaseRunner.get_batch","up/runner/base_runner.py::BaseRunner.batch2device","up/runner/base_runner.py::BaseRunner.forward_train","up/runner/base_runner.py::BaseRunner.forward","up/runner/base_runner.py::BaseRunner.forward_model","up/runner/base_runner.py::BaseRunner.backward","up/runner/base_runner.py::BaseRunner.update","up/utils/env/gene_env.py::to_device","up/models/model_helper.py::ModelHelper.forward","up/utils/model/ema_helper.py::EMA.step","up/utils/model/ema_helper.py::ExpEMA.step","up/utils/general/hook_helper.py::GradClipper.after_backward"],"notes":["“前向”是由图片算出预测和损失；“反向”是算出每个参数该怎样调整；optimizer.step() 才真正更新权重。","一次 AMP iteration 可能因梯度溢出而跳过参数更新。因此“读了多少批”和“成功更新了多少次”需要分开统计。"]},{"id":"hooks","route":"train","number":"09","title":"旁路：日志、回调和显存工具","intro":"Hook 是在固定时点插入的小功能。例如每步打印日志、裁剪梯度，或接近训练末尾时关闭 YOLOX 的强数据增强。","sequence":"Runner 在固定位置调用 _hooks(\"时点\", 参数)\n└─ ComposeHook → 对每一个 hook 调用对应方法\n   ├─ before_data / before_forward / after_forward\n   ├─ after_backward / after_update\n   └─ before_eval_forward / after_eval_forward / after_eval","functions":["up/utils/general/hook_helper.py::build_hooks","up/utils/general/hook_helper.py::ComposeHook.__call__","up/utils/general/hook_helper.py::TrainEvalLogger.after_update","up/utils/general/hook_helper.py::TrainEvalLogger.allreduce","up/utils/general/hook_helper.py::TrainEvalLogger.after_eval_forward","up/utils/general/hook_helper.py::TrainEvalLogger.after_eval","up/utils/general/hook_helper.py::GPUMemoryEmpty.after_update","up/tasks/det/plugins/yolox/utils/hook_helper.py::YoloxNoaug.before_forward"],"notes":["没有配置的可选 hook 不会自动参与训练。日志、显存清理和激活重算要分别看待，不能都当成模型算子。"]},{"id":"save","route":"train","number":"10","title":"保存权重，准备下一步","intro":"保存的是能恢复训练的状态；调学习率则是在准备下一次更新使用的步长。","sequence":"is_save() / save_epoch_ckpt()\n└─ save()\n   ├─ get_dump_dict()\n   │  ├─ model / optimizer / lr_scheduler\n   │  └─ 可选 scaler / EMA\n   └─ Saver.save() → torch.save() → 更新 latest 链接\n→ lr_scheduler.step()","functions":["up/runner/base_runner.py::BaseRunner.is_save","up/runner/base_runner.py::BaseRunner.save_epoch_ckpt","up/runner/base_runner.py::BaseRunner.save","up/runner/base_runner.py::BaseRunner.get_dump_dict","up/runner/base_runner.py::BaseRunner.get_fp16_dump_dict","up/utils/general/saver_helper.py::Saver.save","up/utils/general/saver_helper.py::Saver.lns_latest_ckpt","up/utils/general/saver_helper.py::Saver.rm_ckpt","up/utils/general/saver_helper.py::Saver.save_model_arch","up/utils/general/saver_helper.py::Saver.save_running_config","up/models/model_helper.py::ModelHelper.state_dict"],"notes":[]},{"id":"eval","route":"eval","number":"01","title":"训练内验证：遍历验证集并计算指标","intro":"训练内 eval 和 train --evaluate 都从 Runner.evaluate() 进入。这里使用数据集和评估器，才会得到完整验证集的 Top-1 或 AP。","sequence":"训练循环中的 is_test()，或 train --evaluate\n└─ evaluate()，no_grad\n   └─ inference()\n      └─ _inference()，model.cuda().eval()\n         └─ 对验证集每一个 batch\n            ├─ get_batch(\"test\") → batch2device()\n            ├─ forward_eval() → forward_model()\n            └─ dataset.dump(output)\n      → gather_pk() 或合并各 rank 结果文件\n   → 主进程 dataset.evaluate() → evaluator.eval()\n   → after_eval 回调\n训练循环随后执行 model.train()","functions":["up/runner/base_runner.py::BaseRunner.is_test","up/runner/base_runner.py::BaseRunner.evaluate","up/runner/base_runner.py::BaseRunner.inference","up/runner/base_runner.py::BaseRunner._inference","up/runner/base_runner.py::BaseRunner.forward_eval","up/runner/base_runner.py::BaseRunner._prepare_writer","up/runner/base_runner.py::BaseRunner._results2disk","up/runner/base_runner.py::BaseRunner.merge_results","up/tasks/det/data/datasets/coco_dataset.py::CocoDataset.dump","up/data/datasets/base_dataset.py::BaseDataset.evaluate","up/tasks/det/data/metrics/coco_evaluator.py::CocoEvaluator.load_dts","up/tasks/det/data/metrics/coco_evaluator.py::CocoEvaluator.eval","up/tasks/cls/data/cls_evaluator.py::ImageNetEvaluator.eval"],"notes":[".eval() 控制 BN/Dropout 的行为；no_grad() 关闭梯度记录。它们都不把模型自动搬到 CPU。","启用 EMA 时，forward_model() 会用 EMA 模型预测。验证后由训练循环把训练模型切回 train。","原版的验证入口没有自动套用训练 forward() 中的 autocast。比较速度和数值时，要分别记录训练与验证的精度设置。"]},{"id":"eval-comm","route":"eval","number":"02","title":"验证相关通信：收齐预测和 BN 状态","intro":"每张卡只负责一部分数据。评估前要把各卡的结果收齐；某些配置还会先同步 BN 的统计量。","sequence":"可选 async_norm\n└─ all_reduce_norm(model) → all_reduce_dict(states)\n\n验证结果汇总\n└─ gather_pk(data)\n   ├─ 默认 Gloo 组\n   ├─ _serialize_to_tensor()：把对象编码成字节\n   ├─ _pad_to_largest_tensor()：对齐长度\n   └─ gather → 解码回 Python 对象","functions":["up/utils/env/dist_helper.py::all_reduce_norm","up/utils/env/dist_helper.py::get_async_norm_states","up/utils/env/dist_helper.py::all_reduce_dict","up/utils/env/dist_helper.py::gather_pk","up/utils/env/dist_helper.py::_get_global_gloo_group","up/utils/env/dist_helper.py::_serialize_to_tensor","up/utils/env/dist_helper.py::_pad_to_largest_tensor","up/utils/env/dist_helper.py::all_gather","up/utils/env/dist_helper.py::allreduce","up/utils/env/dist_helper.py::broadcast"],"notes":["SyncBN 在训练前向中同步当前批次统计；async_norm 是配置决定的验证前状态同步。它们是两种不同的操作。"]},{"id":"infer-start","route":"inference","number":"01","title":"独立推理入口：读命令，创建推理器","intro":"命令行 inference.py 负责启动；apis/inference.py 中的 BaseInference 负责真正读图和预测。两者是上下游关系。","sequence":"python -m up inference\n└─ up.__main__.main()\n   └─ commands.inference._main()\n      └─ 启动进程 → commands.inference.main()\n         ├─ load_yaml()\n         ├─ 整理 image_path / ckpt / vis_dir\n         └─ BaseInference(config, visualizer)\n            └─ predict()\n         → finalize()","functions":["up/commands/inference.py::Inference.add_subparser","up/commands/inference.py::_main","up/commands/inference.py::main","up/apis/inference.py::BaseInference.__init__"],"notes":["独立 inference 默认对图片或文件夹做预测和可视化。完整 COCO/ImageNet 精度评估走前面的 train --evaluate。","这条图片推理路线直接调用 PyTorch 模型；ONNX 导出是另外的入口。"]},{"id":"infer-prepare","route":"inference","number":"02","title":"推理准备：模型、权重和图片处理","intro":"推理器沿用训练配置里的网络结构和测试预处理。这里不创建训练优化器。","sequence":"BaseInference.__init__()\n1 build_data()：读图器 + 测试增强 + padding\n2 build_model()：ModelHelper → cuda() → eval()\n3 build_saver()：准备 checkpoint 读取\n4 创建 visualizer\n5 resume()：读取权重 → detector.load()","functions":["up/apis/inference.py::BaseInference.build_data","up/apis/inference.py::BaseInference.build_model","up/apis/inference.py::BaseInference.build_saver","up/apis/inference.py::BaseInference.resume"],"notes":["eval 不是选择某一种厂商后端；它只是把当前模型切换到评估行为。"]},{"id":"infer-input","route":"inference","number":"03","title":"读一张图片，预处理后搬到 GPU","intro":"输入可以是一张图，也可以是一个文件夹。默认 predict() 每次取一张图片，fetch() 则负责把它整理成 batch。","sequence":"predict()\n├─ 文件夹 → iterate_image() 找图片\n└─ 每张图片 → fetch([filename])\n   ├─ fetch_single(filename)\n   │  ├─ image_reader.read()\n   │  ├─ transformer(data)\n   │  ├─ 保存原图和缩放信息\n   │  └─ data.image.cuda()\n   ├─ batch_value()：把同名字段收成列表\n   └─ batch_pad(data) → batch","functions":["up/apis/inference.py::BaseInference.iterate_image","up/apis/inference.py::BaseInference.fetch_single","up/apis/inference.py::BaseInference.fetch","up/apis/inference.py::BaseInference.fetch.batch_value"],"notes":["训练常规 padding 在 DataLoader 中、搬卡之前；独立图片推理的 padding 在 image.cuda() 之后。相同函数在两条路线中可能运行在不同设备。"]},{"id":"infer-predict","route":"inference","number":"04","title":"前向、后处理、画图与保存","intro":"模型先在 GPU 上输出分类或检测结果，再把结果转换成 CPU 能绘图和保存的格式。","sequence":"predict()\n└─ with torch.no_grad(): detector(batch)\n   └─ ModelHelper.forward() → 各模型子模块\n      ├─ 分类：softmax / topk\n      ├─ 检测：框解码 / 筛选 / NMS\n      └─ 分割：像素类别预测\n→ det：map_back() → vis()\n→ cls：vis_cls()\n→ seg：vis_seg()\n其中 tensor2numpy() 负责 .cpu().numpy()","functions":["up/apis/inference.py::BaseInference.predict","up/apis/inference.py::BaseInference.tensor2numpy","up/apis/inference.py::BaseInference.map_back","up/apis/inference.py::BaseInference.vis","up/apis/inference.py::BaseInference.vis_cls","up/apis/inference.py::BaseInference.vis_seg"],"notes":["原版 UP 有 seg 分支。本页按原版解释它的入口；前面瘦身分支只保留 cls/det 是另一件事。","推理后处理可能包含 GPU 计算。不是模型 forward 一结束，后面的工作就全在 CPU。"]},{"id":"yolox","route":"models","number":"01","title":"模型内部实例：YOLOX-small 怎样串起来","intro":"先看 net 清单，再沿 ModelHelper.forward() 往下读。输入是一个 batch 字典，各模块把 features、preds、loss 或 dt_bboxes 接力传下去。","sequence":"configs/det/yolox/yolox_small.yaml 的 net\nimage\n└─ backbone：CSPDarknet → 多尺度 features\n   └─ neck：YoloxPAFPN → 融合后的 features\n      └─ roi_head：YoloXHead → 分类/框/目标置信度 preds\n         └─ yolox_post：YoloxPostProcess\n            ├─ train → 匹配真实框 → cls/loc/obj/l1 loss\n            └─ eval  → 框与分数 → NMS → dt_bboxes","functions":["up/tasks/det/plugins/yolox/models/backbone/cspdarknet.py::yolox_s","up/tasks/det/plugins/yolox/models/backbone/cspdarknet.py::CSPDarknet.forward","up/tasks/det/plugins/yolox/models/backbone/cspdarknet.py::Bottleneck.forward","up/tasks/det/plugins/yolox/models/backbone/cspdarknet.py::CSPLayer.forward","up/tasks/det/plugins/yolox/models/backbone/cspdarknet.py::SPP_dila.forward","up/tasks/det/plugins/yolox/models/backbone/cspdarknet.py::DWConv.forward","up/tasks/det/plugins/yolox/models/neck/pafpn.py::YoloxPAFPN.forward","up/tasks/det/plugins/yolox/models/neck/pafpn.py::YoloxPAFPN.get_outplanes","up/tasks/det/plugins/yolox/models/neck/pafpn.py::YoloxPAFPN.get_outstrides","up/tasks/det/plugins/yolox/models/head/yolox_head.py::YoloXHead.initialize_biases","up/tasks/det/plugins/yolox/models/head/yolox_head.py::YoloXHead.forward","up/tasks/det/plugins/yolox/models/head/yolox_head.py::YoloXHead.forward_net","up/tasks/det/plugins/yolox/models/postprocess/yolox_postprocess.py::YoloxPostProcess.__init__","up/tasks/det/plugins/yolox/models/postprocess/yolox_postprocess.py::YoloxPostProcess.forward","up/tasks/det/plugins/yolox/models/postprocess/yolox_post unctions":{"up/__main__.py::main":{"id":"up/__main__.py::main","name":"main","path":"up/__main__.py","line":8,"end":23,"meaning":"创建命令行解析器，收集已注册的命令；解析参数后调用 args.run(args)。","kind":"cpu","hardware":"命令分发，本身不计算模型。","url":"https://github.com/ModelTC/United-Perception/blob/52aaeb9ed27a490820696d7754d19f98cd6ecd11/up/__main__.py#L8","code":"def main():\n\n    parser = argparse.ArgumentParser(description=\"Run Easy Object Detector\")\n    parser.add_argument('--version', action='version', version=__version__)\n\n    subparsers = parser.add_subparsers(title='subcommands')\n\n    for subname, subcommand in SUBCOMMAND_REGISTRY.items():\n        subcommand().add_subparser(subname, subparsers)\n\n    args = parser.parse_args()\n\n    if 'run' in dir(args):\n        args.run(args)\n    else:\n        parser.print_help()","limited":false,"property":false},"up/commands/train.py::Train.add_subparser":{"id":"up/commands/train.py::Train.add_subparser","name":"Train.add_subparser","path":"up/commands/train.py","line":26,"end":111,"meaning":"声明 --config、--backend、--ng、--evaluate 等参数，并把执行入口设为 _main。","kind":"cpu","hardware":"这里只解释参数，尚未选择某个 GPU 内核。","url":"https://github.com/ModelTC/United-Perception/blob/52aaeb9ed27a490820696d7754d19f98cd6ecd11/up/commands/train.py#L26","code":"    def add_subparser(self, name, parser):\n        sub_parser = parser.add_parser(name,\n                                       description='subcommand for training',\n                                       help='train a model')\n\n        sub_parser.add_argument('-e',\n                                '--evaluate',\n                                dest='evaluate',\n                                action='store_true',\n                                help='evaluate model on validation set')\n        sub_parser.add_argument(\n            '--fork-method',\n            dest='fork_method',\n            type=str,\n            default='fork',\n            choices=['spawn', 'fork'],\n            help='method to fork subprocess, especially for dataloader')\n        sub_parser.add_argument('--backend',\n                                dest='backend',\n                                type=str,\n                                default='dist',\n                                help='model backend')\n        sub_parser.add_argument(\n            '--nocudnn',\n            dest='nocudnn',\n            action='store_true',\n            help='Whether to use cudnn backend or not. Please disable cudnn when running on V100'\n        )\n        sub_parser.add_argument(\n            '--allow_dead_parameter',\n            action='store_true',\n            help='dead parameter (defined in model but not used in forward pass) is allowed'","limited":true,"property":false},"up/commands/train.py::_main":{"id":"up/commands/train.py::_main","name":"_main","path":"up/commands/train.py","line":158,"end":168,"meaning":"设置全局通信方式，再按 --launch 选择本机 PyTorch 启动或集群启动。","kind":"runtime","hardware":"将控制权交给 launch() 或 setup_distributed()。","url":"https://github.com/ModelTC/United-Perception/blob/52aaeb9ed27a490820696d7754d19f98cd6ecd11/up/commands/train.py#L158","code":"def _main(args):\n    DIST_BACKEND.backend = args.backend\n    if args.launch == 'pytorch':\n        launch(main, args.num_gpus_per_machine, args.num_machines, args=args, start_method=args.fork_method)\n    else:\n        mp.set_start_method(args.fork_method, force=True)\n        fork_method = mp.get_start_method(allow_none=True)\n        assert fork_method == args.fork_method\n        sys.stdout.flush()\n        setup_distributed(args.port, args.launch, args.backend)\n        main(args)","limited":false,"property":false},"up/commands/train.py::main":{"id":"up/commands/train.py::main","name":"main","path":"up/commands/train.py","line":114,"end":155,"meaning":"读取配置、选择 Runner；普通训练调用 runner.train()，--evaluate 调用 runner.evaluate()，最后结束通信。","kind":"cpu","hardware":"实际 GPU 工作发生在接下来的 Runner 和模型中。","url":"https://github.com/ModelTC/United-Perception/blob/52aaeb9ed27a490820696d7754d19f98cd6ecd11/up/commands/train.py#L114","code":"def main(args):\n    if args.test_gpu:\n        gpu_check()\n    cfg = load_yaml(args.config, args.cfg_type)\n    cfg['args'] = {\n        'ddp': args.backend == 'dist',\n        'config_path': args.config,\n        'asynchronize': args.asynchronize,\n        'nocudnn': args.nocudnn,\n        'display': args.display,\n        'no_running_config': args.no_running_config,\n        'allow_dead_parameter': args.allow_dead_parameter,\n        'opts': args.opts\n    }\n    train_phase = args.phase\n    cfg['runtime'] = cfg.setdefault('runtime', {})\n    runner_cfg = cfg['runtime'].get('runner', {})\n    runner_cfg['type'] = runner_cfg.get('type', 'base')\n    runner_cfg['kwargs'] = runner_cfg.get('kwargs', {})\n    cfg['runtime']['runner'] = runner_cfg\n    training = True\n    if args.evaluate:\n        training = False\n        train_phase = \"eval\"\n    send_info(cfg, train_phase)\n    runner_cfg['kwargs']['training'] = training\n    runner = RUNNER_REGISTRY.get(runner_cfg['type'])(cfg, **runner_cfg['kwargs'])\n    train_func = {\"train\": runner.train, \"eval\": runner.evaluate}\n    if runner_cfg['type'] == 'bignas':\n        train_func = {\n            \"train_supnet\": runner.train,\n            \"sample_flops\": runner.sample_multiple_subnet_flops,","limited":true,"property":false},"up/utils/general/yaml_loader.py::load_yaml":{"id":"up/utils/general/yaml_loader.py::load_yaml","name":"load_yaml","path":"up/utils/general/yaml_loader.py","line":176,"end":188,"meaning":"把配置文件读成字典；必要时处理旧格式，再检查配置。","kind":"cpu","hardware":"返回 cfg；调用 IncludeLoader 和 check_cfg。","url":"https://github.com/ModelTC/United-Perception/blob/52aaeb9ed27a490820696d7754d19f98cd6ecd11/up/utils/general/yaml_loader.py#L176","code":"def load_yaml(path, cfg_type='up'):\n    with open(path, \"r\")as f:\n        yaml_data = yaml.load(f, IncludeLoader)\n    if cfg_type == 'pod':\n        logger.warning(\"auto convert pod config -> UP config !!!\")\n        ConvertTool = POD2UP()\n        yaml_data = ConvertTool.forward(yaml_data)\n    else:\n        pass\n    # cfg check\n    # return check_cfg(yaml_data)\\\n    # TODO check_cfg\n    return yaml_data","limited":false,"property":false},"up/utils/general/yaml_loader.py::IncludeLoader.include":{"id":"up/utils/general/yaml_loader.py::IncludeLoader.include","name":"IncludeLoader.include","path":"up/utils/general/yaml_loader.py","line":32,"end":44,"meaning":"处理配置里的 !include，把其他 YAML 的配置拼进来。","kind":"cpu","hardware":"配置组合，不涉及 GPU。","url":"https://github.com/ModelTC/United-Perception/blob/52aaeb9ed27a490820696d7754d19f98cd6ecd11/up/utils/general/yaml_loader.py#L32","code":"    def include(self, node):\n        # splits = node.value.split('//')\n        splits = self._split(node.value)\n        node.value = splits[0]\n\n        v = self.extract_file(self.construct_scalar(node))\n\n        for k in splits[1:]:\n            if isinstance(v, list):\n                v = v[int(k)]\n            else:\n                v = v[k]\n        return v","limited":false,"property":false},"up/utils/general/yaml_loader.py::IncludeLoader.construct_document":{"id":"up/utils/general/yaml_loader.py::IncludeLoader.construct_document","name":"IncludeLoader.construct_document","path":"up/utils/general/yaml_loader.py","line":117,"end":122,"meaning":"按 YAML 规则生成最终配置，并处理覆盖项。","kind":"cpu","hardware":"配置组合，不涉及 GPU。","url":"https://github.com/ModelTC/United-Perception/blob/52aaeb9ed27a490820696d7754d19f98cd6ecd11/up/utils/general/yaml_loader.py#L117","code":"    def construct_document(self, node):\n        data = super(IncludeLoader, self).construct_document(node)\n        for k in self.overwrite_keys:\n            if k in data:\n                self._process_overwrite(data, k)\n        return data","limited":false,"property":false},"up/utils/general/yaml_loader.py::check_cfg":{"id":"up/utils/general/yaml_loader.py::check_cfg","name":"check_cfg","path":"up/utils/general/yaml_loader.py","line":125,"end":170,"meaning":"检查配置中的分类、检测等选项，补齐或调整框架约定。","kind":"cpu","hardware":"配置检查。","url":"https://github.com/ModelTC/United-Perception/blob/52aaeb9ed27a490820696d7754d19f98cd6ecd11/up/utils/general/yaml_loader.py#L125","code":"def check_cfg(cfg):\n    cfg = copy.deepcopy(cfg)\n    task_type = get_task_from_cfg(cfg)\n    cfg['saver']['task_type'] = task_type\n    if task_type == 'det':\n        net = cfg.get('net', [])\n        assert len(net) > 0, \"net doesn't exist.\"\n        net_parse, idx2name = {}, {}\n        num_level = 0\n        for idx in range(len(net)):\n            name = net[idx]['name']\n            net_parse[name] = net[idx]\n            if name == 'neck':\n                num_level = net_parse[name]['kwargs'].get('num_level', 0)\n            idx2name[name] = idx\n        # NaiveRPN: num_classes\n        roi_head_type = net_parse['roi_head']['type']\n        if roi_head_type == 'NaiveRPN':\n            logger.info(\"auto reset rpn num_classes = 2\")\n            cfg['net'][idx2name['roi_head']]['kwargs']['num_classes'] = 2\n            cfg['net'][idx2name['post_process']]['kwargs']['num_classes'] = 2\n        # roi_head: class_activation\n        name_post = 'yolox_post' if 'yolox_post' in net_parse else 'post_process'\n        cls_loss_type = net_parse[name_post]['kwargs']['cfg']['cls_loss']['type']\n        class_activation = 'softmax' if 'softmax' in cls_loss_type else 'sigmoid'\n        logger.info('auto reset class activation')\n        cfg['net'][idx2name['roi_head']]['kwargs']['class_activation'] = class_activation\n        # roi_head: num_level:\n        if num_level != 0:\n            cfg['net'][idx2name['roi_head']]['kwargs']['num_level'] = num_level\n        elif roi_head_type != 'YoloXHead':\n            cfg['net'][idx2name['roi_head']]['kwargs']['num_level'] = 1","limited":true,"property":false},"up/utils/general/registry.py::Registry.register":{"id":"up/utils/general/registry.py::Registry.register","name":"Registry.register","path":"up/utils/general/registry.py","line":45,"end":70,"meaning":"把类或函数登记到一个名字下面，例如把 BaseRunner 登记成 base。","kind":"cpu","hardware":"名字 → Python 对象。","url":"https://github.com/ModelTC/United-Perception/blob/52aaeb9ed27a490820696d7754d19f98cd6ecd11/up/utils/general/registry.py#L45","code":"    def register(self, module_name=None, module=None):\n        if _REG_TRACE_IS_ON:\n            frame = inspect.stack()[1][0]\n            info = inspect.getframeinfo(frame)\n            filename = info.filename\n            lineno = info.lineno\n        # used as function call\n        if module is not None:\n            assert module_name is not None\n            Registry._register_generic(self, module_name, module)\n            if _REG_TRACE_IS_ON:\n                self.__trace__[module_name] = (filename, lineno)\n            return\n\n        # used as decorator\n        def register_fn(fn):\n            if module_name is None:\n                name = fn.__name__\n            else:\n                name = module_name\n            Registry._register_generic(self, name, fn)\n            if _REG_TRACE_IS_ON:\n                self.__trace__[name] = (filename, lineno)\n            return fn\n\n        return register_fn","limited":false,"property":false},"up/utils/general/registry.py::Registry.get":{"id":"up/utils/general/registry.py::Registry.get","name":"Registry.get","path":"up/utils/general/registry.py","line":78,"end":84,"meaning":"按名字找到前面登记的对象。","kind":"cpu","hardware":"查表，不是加载厂商内核。","url":"https://github.com/ModelTC/United-Perception/blob/52aaeb9ed27a490820696d7754d19f98cd6ecd11/up/utils/general/registry.py#L78","code":"    def get(self, module_name):\n        if module_name not in self:\n            if env.is_master():\n                assert module_name in self, '{} is not supported, avaiables are:{}'.format(module_name, self)\n            else:\n                exit(1)\n        return self[module_name]","limited":false,"property":false},"up/utils/general/registry.py::Registry.build":{"id":"up/utils/general/registry.py::Registry.build","name":"Registry.build","path":"up/utils/general/registry.py","line":86,"end":111,"meaning":"从配置取出 type 和 kwargs，找到对象并调用其构造函数。","kind":"cpu","hardware":"例如 base + 参数 → 一个 BaseRunner 实例。","url":"https://github.com/ModelTC/United-Perception/blob/52aaeb9ed27a490820696d7754d19f98cd6ecd11/up/utils/general/registry.py#L86","code":"    def build(self, cfg):\n        \"\"\"\n        Arguments:\n            cfg: dict with ``type`` and `kwargs`\n        \"\"\"\n        obj_type = cfg['type']\n        obj_kwargs = cfg.get('kwargs', {})\n        if obj_type not in self:\n            if env.is_master():\n                assert obj_type in self, '{} is not supported, avaiables are:{}'.format(obj_type, self)\n            else:\n                exit(1)\n\n        try:\n            build_fn = self[obj_type]\n            return build_fn(**obj_kwargs)\n        except Exception as e:\n            global _innest_error\n            if _innest_error:\n                argspec = inspect.getfullargspec(build_fn)\n                message = 'for {}(alias={})'.format(build_fn, obj_type)\n                message += '\\nExpected args are:{}'.format(argspec)\n                message += '\\nGiven args are:{}'.format(argspec, obj_kwargs.keys())\n                message += '\\nGiven args details are:{}'.format(argspec, obj_kwargs)\n                _innest_error = False\n            raise e","limited":false,"property":false},"up/utils/env/launch.py::launch":{"id":"up/utils/env/launch.py::launch","name":"launch","path":"up/utils/env/launch.py","line":19,"end":68,"meaning":"根据机器数和每机卡数计算进程总数；多进程时启动 worker，单进程时直接调用 main。","kind":"runtime","hardware":"默认通信后端是 nccl；单进程分支没有显式 set_device。","url":"https://github.com/ModelTC/United-Perception/blob/52aaeb9ed27a490820696d7754d19f98cd6ecd11/up/utils/env/launch.py#L19","code":"def launch(\n    main_func,\n    num_gpus_per_machine,\n    num_machines=1,\n    machine_rank=0,\n    backend=\"nccl\",\n    dist_url='auto',\n    args=(),\n    timeout=DEFAULT_TIMEOUT,\n    start_method='fork'\n):\n    \"\"\"\n    Args:\n        main_func: a function that will be called by `main_func(*args)`\n        num_machines (int): the total number of machines\n        machine_rank (int): the rank of this machine (one per machine)\n        dist_url (str): url to connect to for distributed training, including protocol\n                       e.g. \"tcp://127.0.0.1:8686\".\n                       Can be set to auto to automatically select a free port on localhost\n        args (tuple): arguments passed to main_func\n    \"\"\"\n    world_size = num_machines * num_gpus_per_machine\n    if world_size > 1:\n        # https://github.com/pytorch/pytorch/pull/14391\n        # TODO prctl in spawned processes\n\n        if dist_url == \"auto\":\n            assert (\n                num_machines == 1\n            ), \"dist_url=auto cannot work with distributed training.\"\n            port = dist_helper.find_free_port()\n            dist_url = f\"tcp://127.0.0.1:{port}\"","limited":true,"property":false},"up/utils/env/launch.py::_distributed_worker":{"id":"up/utils/env/launch.py::_distributed_worker","name":"_distributed_worker","path":"up/utils/env/launch.py","line":71,"end":117,"meaning":"计算 rank、初始化通信组、绑定当前 CUDA 卡，然后调用训练或推理 main。","kind":"comm","hardware":"torch.cuda.is_available/device_count/set_device；dist.init_process_group/new_group。","url":"https://github.com/ModelTC/United-Perception/blob/52aaeb9ed27a490820696d7754d19f98cd6ecd11/up/utils/env/launch.py#L71","code":"def _distributed_worker(\n    local_rank,\n    main_func,\n    world_size,\n    num_gpus_per_machine,\n    machine_rank,\n    backend,\n    dist_url,\n    args,\n    timeout=DEFAULT_TIMEOUT,\n):\n    assert (\n        torch.cuda.is_available()\n    ), \"cuda is not available. Please check your installation.\"\n    global_rank = machine_rank * num_gpus_per_machine + local_rank\n    logger.info(\"Rank {} initialization finished.\".format(global_rank))\n    try:\n        dist.init_process_group(\n            backend=backend,\n            init_method=dist_url,\n            world_size=world_size,\n            rank=global_rank,\n            timeout=timeout,\n        )\n    except Exception:\n        logger.error(\"Process group URL: {}\".format(dist_url))\n        raise\n\n    # Setup the local process group (which contains ranks within the same machine)\n    assert dist_helper._LOCAL_PROCESS_GROUP is None\n    num_machines = world_size // num_gpus_per_machine\n    for i in range(num_machines):","limited":true,"property":false},"up/utils/env/dist_helper.py::find_free_port":{"id":"up/utils/env/dist_helper.py::find_free_port","name":"find_free_port","path":"up/utils/env/dist_helper.py","line":267,"end":272,"meaning":"为本机通信找一个可用端口。","kind":"cpu","hardware":"网络端口查询，不是 GPU 计算。","url":"https://github.com/ModelTC/United-Perception/blob/52aaeb9ed27a490820696d7754d19f98cd6ecd11/up/utils/env/dist_helper.py#L267","code":"def find_free_port():\n    import socket\n    from contextlib import closing\n    with closing(socket.socket(socket.AF_INET, socket.SOCK_STREAM)) as s:\n        s.bind(('', 0))\n        return str(s.getsockname()[1])","limited":false,"property":false},"up/utils/env/dist_helper.py::setup_distributed":{"id":"up/utils/env/dist_helper.py::setup_distributed","name":"setup_distributed","path":"up/utils/env/dist_helper.py","line":350,"end":359,"meaning":"按 backend 选择通信初始化方法，返回当前 rank 和 world_size。","kind":"comm","hardware":"PyTorch 路线继续调用 setup_distributed_dist。","url":"https://github.com/ModelTC/United-Perception/blob/52aaeb9ed27a490820696d7754d19f98cd6ecd11/up/utils/env/dist_helper.py#L350","code":"def setup_distributed(port=33334, launch='slurm', backend='dist'):\n    if backend == 'dist':\n        setup_distributed_dist(port, launch)\n    else:\n        setup_distributed_link(port, launch)\n    rank = get_rank()\n    world_size = get_world_size()\n    print('rank:{} world_size(gpus):{}'.format(rank, world_size))\n    sys.stdout.flush()\n    return rank, world_size","limited":false,"property":false},"up/utils/env/dist_helper.py::setup_distributed_dist":{"id":"up/utils/env/dist_helper.py::setup_distributed_dist","name":"setup_distributed_dist","path":"up/utils/env/dist_helper.py","line":334,"end":342,"meaning":"按 slurm 或其他启动方式，选择对应的进程组初始化函数。","kind":"comm","hardware":"分别进入 dist_init_slurm 或 dist_init_mpi。","url":"https://github.com/ModelTC/United-Perception/blob/52aaeb9ed27a490820696d7754d19f98cd6ecd11/up/utils/env/dist_helper.py#L334","code":"def setup_distributed_dist(port, launch):\n    if launch == 'slurm':\n        device = get_rank() % torch.cuda.device_count()\n        torch.cuda.set_device(device)\n        dist_init_slurm(port=port)\n    else:\n        dist_init_mpi(port=port)\n        device = get_rank() % torch.cuda.device_count()\n        torch.cuda.set_device(device)","limited":false,"property":false},"up/utils/env/dist_helper.py::dist_init_slurm":{"id":"up/utils/env/dist_helper.py::dist_init_slurm","name":"dist_init_slurm","path":"up/utils/env/dist_helper.py","line":275,"end":299,"meaning":"从集群环境变量读取进程信息，初始化通信，再按 rank 绑定 CUDA 卡。","kind":"comm","hardware":"dist.init_process_group；torch.cuda.device_count/set_device。","url":"https://github.com/ModelTC/United-Perception/blob/52aaeb9ed27a490820696d7754d19f98cd6ecd11/up/utils/env/dist_helper.py#L275","code":"def dist_init_slurm(backend='nccl', port='13333'):\n    proc_id = int(os.environ['SLURM_PROCID'])\n    ntasks = int(os.environ['SLURM_NTASKS'])\n    node_list = os.environ['SLURM_NODELIST']\n    if '[' in node_list:\n        beg = node_list.find('[')\n        pos1 = node_list.find('-', beg)\n        if pos1 < 0:\n            pos1 = 1000\n        pos2 = node_list.find(',', beg)\n        if pos2 < 0:\n            pos2 = 1000\n        node_list = node_list[:min(pos1, pos2)].replace('[', '')\n    addr = node_list[8:].replace('-', '.')\n    os.environ['MASTER_PORT'] = str(port)\n    os.environ['MASTER_ADDR'] = addr\n    os.environ['WORLD_SIZE'] = str(ntasks)\n    os.environ['RANK'] = str(proc_id)\n    if backend == 'nccl':\n        dist.init_process_group(backend='nccl')\n    else:\n        dist.init_process_group(backend='gloo', rank=proc_id, world_size=ntasks)\n    rank = dist.get_rank()\n    device = rank % torch.cuda.device_count()\n    torch.cuda.set_device(device)","limited":false,"property":false},"up/utils/env/dist_helper.py::dist_init_mpi":{"id":"up/utils/env/dist_helper.py::dist_init_mpi","name":"dist_init_mpi","path":"up/utils/env/dist_helper.py","line":302,"end":331,"meaning":"从 MPI 参数或环境读取 rank 等信息，初始化通信并绑定 CUDA 卡。","kind":"comm","hardware":"这是原版的 MPI 分支；读流程时与本机 launch 分支分开看。","url":"https://github.com/ModelTC/United-Perception/blob/52aaeb9ed27a490820696d7754d19f98cd6ecd11/up/utils/env/dist_helper.py#L302","code":"def dist_init_mpi(backend='nccl',\n                  addr='localhost',\n                  port=\"13333\",\n                  rank=None,\n                  world_size=None):\n    r\"\"\"\n    Overview:\n        Init the distributed training setting\n    \"\"\"\n    assert backend in ['nccl', 'gloo'], backend\n    os.environ['MASTER_ADDR'] = addr or os.environ.get('MASTER_ADDR', addr)\n    os.environ['MASTER_PORT'] = str(port) or os.environ.get('MASTER_PORT', str(port))\n\n    if rank is None:\n        local_id = os.environ.ge(os.environ.get('OMPI_COMM_WORLD_RANK', None))\n        if local_id is None:\n            raise RuntimeError(\"please indicate rank explicitly in dist_init method\")\n        else:\n            rank = int(local_id)\n    if world_size is None:\n        ntasks = os.environ.get(os.environ.get('OMPI_COMM_WORLD_SIZE', None))\n        if ntasks is None:\n            raise RuntimeError(\"please indicate world_size explicitly in dist_init method\")\n        else:\n            world_size = int(ntasks)\n\n    dist.init_process_group(backend=backend, rank=rank, world_size=world_size)\n    rank = dist.get_rank()\n    devi             for k in key_s[:-1]:\n                    cur_cfg_temp = cur_cfg_temp.setdefault(k, {})\n                cur_cfg_temp[key_s[-1]] = val\n            if not flag_exist:\n                _cur_cfg = {}\n                cur_cfg_temp = _cur_cfg\n                key_s = key_s.split('.')\n                for k in key_s[:-1]:\n                    cur_cfg_temp = cur_cfg_temp.setdefault(k, {})","limited":true,"property":false},"up/utils/env/gene_env.py::set_random_seed":{"id":"up/utils/env/gene_env.py::set_random_seed","name":"set_random_seed","path":"up/utils/env/gene_env.py","line":28,"end":39,"meaning":"分别给 Python、NumPy、Torch 和 CUDA 设置随机种子；rank_init 决定不同进程是否用不同种子。","kind":"runtime","hardware":"torch.manual_seed；torch.cuda.manual_seed。","url":"https://github.com/ModelTC/United-Perception/blob/52aaeb9ed27a490820696d7754d19f98cd6ecd11/up/utils/env/gene_env.py#L28","code":"def set_random_seed(seed, rank_init=False):\n    if not rank_init:\n        random.seed(seed)\n        np.random.seed(seed ** 2)\n        torch.manual_seed(seed ** 3)\n        torch.cuda.manual_seed(seed ** 4)\n    else:\n        seed_add = env.rank\n        random.seed(seed + seed_add)\n        np.random.seed(seed + seed_add)\n        torch.manual_seed(seed + seed_add)\n        torch.cuda.manual_seed(seed + seed_add)","limited":false,"property":false},"up/utils/env/gene_env.py::get_env_info":{"id":"up/utils/env/gene_env.py::get_env_info","name":"get_env_info","path":"up/utils/env/gene_env.py","line":19,"end":25,"meaning":"打印 Python、PyTorch、CUDA 等环境信息，方便复现。","kind":"runtime","hardware":"环境信息查询，不是模型前向。","url":"https://github.com/ModelTC/United-Perception/blob/52aaeb9ed27a490820696d7754d19f98cd6ecd11/up/utils/env/gene_env.py#L19","code":"def get_env_info():\n    logger.info(\"Collecting env info (might take some time)\")\n    try:\n        logger.info(\"\\n\" + get_pretty_env_info())\n    except Exception as e:\n        logger.warning('Failed to collect env info. This is probably caused by pip3 version problem')\n        logger.warning(e)","limited":false,"property":false},"up/runner/base_runner.py::BaseRunner.build_dataloaders":{"id":"up/runner/base_runner.py::BaseRunner.build_dataloaders","name":"BaseRunner.build_dataloaders","path":"up/runner/base_runner.py","line":171,"end":200,"meaning":"为 train、test 等数据源逐个创建加载器，记住每轮批次数和 batch 大小。","kind":"cpu","hardware":"训练初始化通常同时准备训练集和验证集。","url":"https://github.com/ModelTC/United-Perception/blob/52aaeb9ed27a490820696d7754d19f98cd6ecd11/up/runner/base_runner.py#L171","code":"    def build_dataloaders(self, reload_cfg=None):\n        def build(builder_type, cfg_data, pool, reload_cfg):\n            loaders = {}\n            for idx, data_source in enumerate(pool):\n                data_builder = DATA_BUILDER_REGISTY[builder_type[idx]](cfg_data, data_source, reload_cfg)\n                source = data_source.split(':')[-1]\n                loader = data_builder.build_dataloader()\n                logger.info(f'build {data_source} done')\n                loaders[source] = loader\n            return loaders\n        cfg_data = self.config['dataset']\n        self.set_dataset_timer(cfg_data)\n        self.config['dataset']['builder_type'] = cfg_data.setdefault('builder_type', 'base')\n        self.config['dataset']['data_pool'] = cfg_data.setdefault('data_pool', ['train:train', 'test:test'])\n        builder_type = cfg_data.get('builder_type', 'base')\n        pool = cfg_data.get('data_pool', ['train:train', 'test:test'])\n        pool = self._check_data_pool(pool, cfg_data)\n        self.train_pool = [source for source in pool if source.startswith('train')]\n        # train_pool_idxs = [idx for idx in range(len(pool)) if pool[idx].startswith('train')]\n        self.test_pool = [source for source in pool if source.startswith('test')]\n        if not isinstance(builder_type, list):\n            builder_type = [builder_type] * len(pool)\n        if not self.training:\n            pool = self.test_pool\n            test_pool_idxs = [idx for idx in range(len(pool)) if pool[idx].startswith('test')]\n            builder_type = [builder_type[idx] for idx in test_pool_idxs]\n        self.data_loaders = build(builder_type, cfg_data, pool, reload_cfg)\n        if 'train' in self.data_loaders:\n            self.set_train_epoch_size()\n            self.set_train_batch_size()","limited":false,"property":false},"up/runner/base_runner.py::BaseRunner.build_dataloaders.build":{"id":"up/runner/base_runner.py::BaseRunner.build_dataloaders.build","name":"BaseRunner.build_dataloaders.build","path":"up/runner/base_runner.py","line":172,"end":180,"meaning":"这个内部小函数遍历数据源，为每个源调用数据构建器，并把结果放进字典。","kind":"cpu","hardware":"返回如 train → loader、test → loader 的映射。","url":"https://github.com/ModelTC/United-Perception/blob/52aaeb9ed27a490820696d7754d19f98cd6ecd11/up/runner/base_runner.py#L172","code":"        def build(builder_type, cfg_data, pool, reload_cfg):\n            loaders = {}\n            for idx, data_source in enumerate(pool):\n                data_builder = DATA_BUILDER_REGISTY[builder_type[idx]](cfg_data, data_source, reload_cfg)\n                source = data_source.split(':')[-1]\n                loader = data_builder.build_dataloader()\n                logger.info(f'build {data_source} done')\n                loaders[source] = loader\n            return loaders","limited":false,"property":false},"up/runner/base_runner.py::BaseRunner._check_data_pool":{"id":"up/runner/base_runner.py::BaseRunner._check_data_pool","name":"BaseRunner._check_data_pool","path":"up/runner/base_runner.py","line":146,"end":151,"meaning":"过滤掉配置里实际不存在的数据源。","kind":"cpu","hardware":"避免对不存在的数据集创建加载器。","url":"https://github.com/ModelTC/United-Perception/blob/52aaeb9ed27a490820696d7754d19f98cd6ecd11/up/runner/base_runner.py#L146","code":"    def _check_data_pool(self, pool, cfg_data):\n        check_pool = []\n        for p in pool:\n            if p.split(':')[-1] in cfg_data:\n                check_pool.append(p)\n        return check_pool","limited":false,"property":false},"up/runner/base_runner.py::BaseRunner.set_dataset_timer":{"id":"up/runner/base_runner.py::BaseRunner.set_dataset_timer","name":"BaseRunner.set_dataset_timer","path":"up/runner/base_runner.py","line":153,"end":169,"meaning":"把 batch 大小和日志间隔等传给数据耗时统计工具。","kind":"cpu","hardware":"写环境变量，便于记录读数据时间。","url":"https://github.com/ModelTC/United-Perception/blob/52aaeb9ed27a490820696d7754d19f98cd6ecd11/up/runner/base_runner.py#L153","code":"    def set_dataset_timer(self, cfg_data):\n        cfg_dataset_timer = cfg_data.get('dataset_timer', None)\n        batch_size = 1\n        if len(cfg_data.get('data_pool', ['train:train', 'test:test'])) == 0:\n            return\n        if cfg_data['train'].get('batch_sampler', None):\n            batch_size = cfg_data['train']['batch_sampler']['kwargs']['batch_size']\n        elif cfg_data['test'].get('batch_sampler', None):\n            batch_size = cfg_data['test']['batch_sampler']['kwargs']['batch_size']\n        elif cfg_data.get('batch_sampler', None):\n            batch_size = cfg_data['batch_sampler']['kwargs']['batch_size']\n\n        os.environ['BATCH_SIZE'] = str(batch_size)\n        os.environ['DISPLAY_FREQ'] = str(self.config['args'].get('display', 1))\n        if cfg_dataset_timer:\n            os.environ['DATASET_TIMER_ENABLED'] = str(1 if cfg_dataset_timer['enabled'] is True else 0)\n            os.environ['DATASET_TIMER_THRESHOLD'] = str(cfg_dataset_timer['threshold_seconds'])","limited":false,"property":false},"up/runner/base_runner.py::BaseRunner.set_train_epoch_size":{"id":"up/runner/base_runner.py::BaseRunner.set_train_epoch_size","name":"BaseRunner.set_train_epoch_size","path":"up/runner/base_runner.py","line":622,"end":623,"meaning":"向加载器查询一轮训练有多少批。","kind":"cpu","hardware":"结果用于计算总步数和验证、保存频率。","url":"https://github.com/ModelTC/United-Perception/blob/52aaeb9ed27a490820696d7754d19f98cd6ecd11/up/runner/base_runner.py#L622","code":"    def set_train_epoch_size(self):\n        self.train_epoch_size = self.data_loaders['train'].get_epoch_size()","limited":false,"property":false},"up/runner/base_runner.py::BaseRunner.set_train_batch_size":{"id":"up/runner/base_runner.py::BaseRunner.set_train_batch_size","name":"BaseRunner.set_train_batch_size","path":"up/runner/base_runner.py","line":625,"end":626,"meaning":"记下每个进程的一批图片数。","kind":"cpu","hardware":"后面构建学习率调度器会用到。","url":"https://github.com/ModelTC/United-Perception/blob/52aaeb9ed27a490820696d7754d19f98cd6ecd11/up/runner/base_runner.py#L625","code":"    def set_train_batch_size(self):\n        self.train_batch_size = self.data_loaders['train'].batch_sampler.batch_size","limited":false,"property":false},"up/data/data_builder.py::BaseDataLoaderBuilder.build_dataloader":{"id":"up/data/data_builder.py::BaseDataLoaderBuilder.build_dataloader","name":"BaseDataLoaderBuilder.build_dataloader","path":"up/data/data_builder.py","line":91,"end":97,"meaning":"依次组装数据集、采样器和加载器。","kind":"cpu","hardware":"返回一个可以 next() 取 batch 的 DataLoader。","url":"https://github.com/ModelTC/United-Perception/blob/52aaeb9ed27a490820696d7754d19f98cd6ecd11/up/data/data_builder.py#L91","code":"    def build_dataloader(self):\n        self.parse_data_source()\n        cfg = self.update_cfg()\n        dataset = self.build_dataset(cfg['dataset'])\n        batch_sampler = self.build_batch_sampler(cfg['batch_sampler'], dataset)\n        cfg_dataloader = self.generate_cfg_dataloader(cfg, dataset, batch_sampler)\n        return DATALOADER_REGISTRY.build(cfg_dataloader)","limited":false,"property":false},"up/data/data_builder.py::BaseDataLoaderBuilder.parse_data_source":{"id":"up/data/data_builder.py::BaseDataLoaderBuilder.parse_data_source","name":"BaseDataLoaderBuilder.parse_data_source","path":"up/data/data_builder.py","line":23,"end":32,"meaning":"把 train:train 这样的名字拆成阶段和数据源。","kind":"cpu","hardware":"决定用训练还是验证的配置。","url":"https://github.com/ModelTC/United-Perception/blob/52aaeb9ed27a490820696d7754d19f98cd6ecd11/up/data/data_builder.py#L23","code":"    def parse_data_source(self):\n        \"\"\"\n        Arguments:\n            - data_source: `train:train`\n        \"\"\"\n        splits = self.data_source.split(':')\n        if len(splits) == 1:\n            self.phase, self.source = splits[0], splits[0]\n        else:\n            self.phase, self.source = splits[0], splits[1]","limited":false,"property":false},"up/data/data_builder.py::BaseDataLoaderBuilder.update_cfg":{"id":"up/data/data_builder.py::BaseDataLoaderBuilder.update_cfg","name":"BaseDataLoaderBuilder.update_cfg","path":"up/data/data_builder.py","line":78,"end":83,"meaning":"把公共数据配置与当前 train/test 的配置合并。","kind":"cpu","hardware":"得到这一个数据源的完整设置。","url":"https://github.com/ModelTC/United-Perception/blob/52aaeb9ed27a490820696d7754d19f98cd6ecd11/up/data/data_builder.py#L78","code":"    def update_cfg(self):\n        assert self.source in self.cfg\n        cfg = copy.deepcopy(self.cfg)\n        cfg_data = cfg.pop(self.source)\n        cfg.update(cfg_data)\n        return cfg","limited":false,"property":false},"up/data/data_builder.py::BaseDataLoaderBuilder.build_dataset":{"id":"up/data/data_builder.py::BaseDataLoaderBuilder.build_dataset","name":"BaseDataLoaderBuilder.build_dataset","path":"up/data/data_builder.py","line":34,"end":37,"meaning":"按配置中的 type 创建 CocoDataset、ClsDataset 等对象。","kind":"cpu","hardware":"图片怎么读、标签怎么解析，在具体 Dataset 中实现。","url":"https://github.com/ModelTC/United-Perception/blob/52aaeb9ed27a490820696d7754d19f98cd6ecd11/up/data/data_builder.py#L34","code":"    def build_dataset(self, cfg_dataset):\n        if self.reload_cfg is not None and self.phase == 'train':\n            cfg_dataset['kwargs']['reload_cfg'] = self.reload_cfg\n        return DATASET_REGISTRY.build(cfg_dataset)","limited":false,"property":false},"up/data/data_builder.py::BaseDataLoaderBuilder.build_sampler":{"id":"up/data/data_builder.py::BaseDataLoaderBuilder.build_sampler","name":"BaseDataLoaderBuilder.build_sampler","path":"up/data/data_builder.py","line":39,"end":53,"meaning":"决定当前进程读哪些样本、按什么顺序读；验证时选择测试采样器。","kind":"cpu","hardware":"多卡的数据分工，不是梯度通信。","url":"https://github.com/ModelTC/United-Perception/blob/52aaeb9ed27a490820696d7754d19f98cd6ecd11/up/data/data_builder.py#L39","code":"    def build_sampler(self, cfg_sampler, dataset):\n        \"\"\"Only works for training. We support dist_test for testing for now\n        \"\"\"\n        cfg_sampler = copy.deepcopy(cfg_sampler)\n        cfg_sampler['kwargs']['dataset'] = dataset\n        if self.phase == 'test':\n            if 'test' in cfg_sampler['type']:\n                return SAMPLER_REGISTRY.build(cfg_sampler)\n            else:\n                test_sampler = {'type': 'dist_test', 'kwargs': {'dataset': dataset}}\n                logger.warning('We use dist_test instead of {} for test. \\\n                    If you use a rank based dataset, \\\n                    you need to use the local_test as the test sampler'.format(cfg_sampler['type']))\n                return SAMPLER_REGISTRY.build(test_sampler)\n        return SAMPLER_REGISTRY.build(cfg_sampler)","limited":false,"property":false},"up/data/data_builder.py::BaseDataLoaderBuilder.build_batch_sampler":{"id":"up/data/data_builder.py::BaseDataLoaderBuilder.build_batch_sampler","name":"BaseDataLoaderBuilder.build_batch_sampler","path":"up/data/data_builder.py","line":55,"end":76,"meaning":"把采样出的编号分成一批批，再包上可连续迭代的采样器。","kind":"cpu","hardware":"返回 batch_sampler。","url":"https://github.com/ModelTC/United-Perception/blob/52aaeb9ed27a490820696d7754d19f98cd6ecd11/up/data/data_builder.py#L55","code":"    def build_batch_sampler(self, cfg_batch_sampler, dataset):\n        cfg_batch_sampler = copy.deepcopy(cfg_batch_sampler)\n\n        cfg_sampler = cfg_batch_sampler['kwargs']['sampler']\n        sampler = self.build_sampler(cfg_sampler, dataset)\n\n        cfg_batch_sampler['kwargs']['sampler'] = sampler\n        if self.phase == 'test' and cfg_batch_sampler['type'] == 'aspect_ratio_group':\n            logger.warning(\"'aspect_ratio_group' is not a 'test-friendly' choice, \"\n                           \"cause it may miss some images under some conditions. \"\n                           \"We use 'base' instead\")\n            cfg_batch_sampler = {\n                'type': 'base',\n                'kwargs': {\n                    'sampler': sampler,\n                    'batch_size': cfg_batch_sampler['kwargs']['batch_size']\n                }\n            }\n        batch_sampler = BATCH_SAMPLER_REGISTRY.build(cfg_batch_sampler)\n        batch_sampler = InfiniteBatchSampler(batch_sampler)\n\n        return batch_sampler","limited":false,"property":false},"up/data/data_builder.py::BaseDataLoaderBuilder.generate_cfg_dataloader":{"id":"up/data/data_builder.py::BaseDataLoaderBuilder.generate_cfg_dataloader","name":"BaseDataLoaderBuilder.generate_cfg_dataloader","path":"up/data/data_builder.py","line":85,"end":89,"meaning":"把已经创建的数据集和批采样器填进加载器参数。","kind":"cpu","hardware":"供 DATALOADER_REGISTRY.build() 创建加载器。","url":"https://github.com/ModelTC/United-Perception/blob/52aaeb9ed27a490820696d7754d19f98cd6ecd11/up/data/data_builder.py#L85","code":"    def generate_cfg_dataloader(self, cfg, dataset, batch_sampler):\n        cfg_dataloader = cfg['dataloader']\n        cfg_dataloader['kwargs']['dataset'] = dataset\n        cfg_dataloader['kwargs']['batch_sampler'] = batch_sampler\n        return cfg_dataloader","limited":false,"property":false},"up/tasks/det/data/datasets/coco_dataset.py::CocoDataset.__init__":{"id":"up/tasks/det/data/datasets/coco_dataset.py::CocoDataset.__init__","name":"CocoDataset.__init__","path":"up/tasks/det/data/datasets/coco_dataset.py","line":69,"end":144,"meaning":"读取 COCO 标注，建立图片、类别等索引，准备图片读取器、增强和评估器。","kind":"cpu","hardware":"这里只准备数据对象。","url":"https://github.com/ModelTC/United-Perception/blob/52aaeb9ed27a490820696d7754d19f98cd6ecd11/up/tasks/det/data/datasets/coco_dataset.py#L69","code":"    def __init__(self,\n                 meta_file,\n                 image_reader,\n                 transformer,\n                 source='coco',\n                 class_names=None,\n                 has_keypoint=False,\n                 has_mask=False,\n                 has_grid=False,\n                 box2mask=False,\n                 has_semantic_seg=False,\n                 semantic_seg_prefix=None,\n                 unknown_erasing=False,\n                 use_ignore=False,\n                 evaluator=None,\n                 cache=None,\n                 clip_box=True):\n        with no_print():\n            self.coco = self._loader(meta_file)\n\n        category_ids = self.coco.cats.keys()\n\n        self.classes = ['__background__'] + [\n            self.coco.cats[c]['name'] for c in sorted(category_ids)\n        ]\n        # map coco discrete category ids to contiguous ids\n        self.category_to_class = {\n            c: i + 1\n            for i, c in enumerate(sorted(category_ids))\n        }\n        self.class_to_category = {\n            i + 1: c","limited":true,"property":false},"up/tasks/det/data/datasets/coco_dataset.py::CocoDataset.get_input":{"id":"up/tasks/det/data/datasets/coco_dataset.py::CocoDataset.get_input","name":"CocoDataset.get_input","path":"up/tasks/det/data/datasets/coco_dataset.py","line":238,"end":314,"meaning":"按编号读取一张图片和其框、标签等标注。","kind":"cpu","hardware":"返回单张图片的数据字典。","url":"https://github.com/ModelTC/United-Perception/blob/52aaeb9ed27a490820696d7754d19f98cd6ecd11/up/tasks/det/data/datasets/coco_dataset.py#L238","code":"    def get_input(self, idx):\n        \"\"\" parse annotation into input dict\n        \"\"\"\n        img_id = self.img_ids[idx]\n        meta_img = self.coco.imgs[img_id]\n        meta_annos = self.coco.imgToAnns[img_id]\n        # filename = os.path.join(self.image_dir, meta_img['file_name'])\n        filename = self.get_filename(meta_img)\n\n        gt_bboxes, ig_bboxes = [], []\n        gt_keyps = [] if self.has_keypoint else None\n        gt_masks = [] if self.has_mask else None\n        gt_semantic_seg = np.zeros((meta_img['height'], meta_img['width']),\n                                   dtype=np.uint8) if self.has_semantic_seg else None\n        if self.has_semantic_seg:\n            gt_semantic_seg = np.array(\n                Image.open(os.path.join(self.semantic_seg_prefix, os.path.basename(filename).replace('jpg', 'png'))))\n\n        for ann in meta_annos:\n            # to keep compatible with lvis dataset\n            if ann.get('iscrowd', False):\n                if self.use_ignore:\n                    # avoid inplace changing the original data\n                    bbox = copy.copy(ann['bbox'])\n                    bbox[2] += bbox[0] - ALIGNED_FLAG.offset\n                    bbox[3] += bbox[1] - ALIGNED_FLAG.offset\n                    ig_bboxes.append(bbox)\n                continue\n            label = self.category_to_class[ann['category_id']]\n            bbox = ann['bbox'] + [label]\n            bbox[2] += bbox[0] - ALIGNED_FLAG.offset\n            bbox[3] += bbox[1] - ALIGNED_FLAG.offset","limited":true,"property":false},"up/tasks/det/data/datasets/coco_dataset.py::CocoDataset.__getitem__":{"id":"up/tasks/det/data/datasets/coco_dataset.py::CocoDataset.__getitem__","name":"CocoDataset.__getitem__","path":"up/tasks/det/data/datasets/coco_dataset.py","line":316,"end":360,"meaning":"调用 get_input()，再做增强，并记录缩放比例、原图尺寸等信息。","kind":"cpu","hardware":"image_info 用于之后把预测框还原到原图。","url":"https://github.com/ModelTC/United-Perception/blob/52aaeb9ed27a490820696d7754d19f98cd6ecd11/up/tasks/det/data/datasets/coco_dataset.py#L316","code":"    def __getitem__(self, idx):\n        \"\"\"\n        Get a single image data: from dataset\n\n        Arguments:\n            - idx (:obj:`int`): index of image, 0 <= idx < len(self)\n\n        Returns:\n            - input (:obj:`dict`)\n\n        Output example::\n\n            {\n                # (FloatTensor): [1, 3, h, w], RGB format\n                'image': ..,\n                # (list): [resized_h, resized_w, scale_factor, origin_h, origin_w]\n                'image_info': ..,\n                # (FloatTensor): [N, 5] (x1, y1, x2, y2, label)\n                'gt_bboxes': ..,\n                # (FloatTensor): [N, 4] (x1, y1, x2, y2)\n                'ig_bboxes': ..,\n                # (FloatTensor): [N, num_keyps, 3] (x, y, flag)\n                'gt_keyps': <tensor>,\n                # (list of list of ndarray): [N] [polygons]\n                'gt_masks': [],\n                #  (list of tuple): [(1, 2), (3, 4), ...], for visualization\n                'keyp_pairs': [],\n                # (str): image name\n                'filename': ..\n            }\n        \"\"\"\n        input = self.get_input(idx)","limited":true,"property":false},"up/data/data_loader.py::BaseDataLoader.__init__":{"id":"up/data/data_loader.py::BaseDataLoader.__init__","name":"BaseDataLoader.__init__","path":"up/data/data_loader.py","line":22,"end":42,"meaning":"配置工作进程、采样器、锁页内存和组 batch 的函数。","kind":"cpu","hardware":"pin_memory 是 CPU 锁页内存；服务于向 GPU 传输。","url":"https://github.com/ModelTC/United-Perception/blob/52aaeb9ed27a490820696d7754d19f98cd6ecd11/up/data/data_loader.py#L22","code":"    def __init__(self,\n                 dataset,\n                 alignment=1,\n                 batch_size=1,\n                 shuffle=False,\n                 sampler=None,\n                 batch_sampler=None,\n                 num_workers=0,\n                 pin_memory=False,\n                 drop_last=False,\n                 pad_value=0,\n                 pad_type='batch_pad',\n                 worker_init=False):\n        worker_init_fn = None\n        if worker_init:\n            from up.utils.env.gene_env import worker_init_reset_seed\n            worker_init_fn = worker_init_reset_seed\n        super(BaseDataLoader, self).__init__(\n            dataset, batch_size, shuffle, sampler, batch_sampler, num_workers,\n            self._collate_fn, pin_memory, drop_last, worker_init_fn=worker_init_fn)\n        self.pad = BATCHING_REGISTRY.get(pad_type)(alignment, pad_value)","limited":false,"property":false},"up/data/data_loader.py::BaseDataLoader._collate_fn":{"id":"up/data/data_loader.py::BaseDataLoader._collate_fn","name":"BaseDataLoader._collate_fn","path":"up/data/data_loader.py","line":44,"end":114,"meaning":"把多张图片的字典整理成一个 batch，保留各自框和尺寸信息，再做 padding。","kind":"cpu","hardware":"本训练数据路径中通常在搬到 GPU 之前执行。","url":"https://github.com/ModelTC/United-Perception/blob/52aaeb9ed27a490820696d7754d19f98cd6ecd11/up/data/data_loader.py#L44","code":"    def _collate_fn(self, batch):\n        \"\"\"\n        Form a mini-batch from list of data of :meth:`~root.datasets.base_dataset.BaseDataset.__getitem__`\n\n        Arguments:\n            - batch (:obj:`list` of data): type of data depends on output of Dataset.\n              For :class:`~root.datasets.coco_dataset.CocoDataset`,\n              :class:`~root.datasets.voc_dataset.VocDataset` and :class:`~root.datasets.custom_dataset.CustomDataset`,\n              data is a Dictionary.\n\n        Returns:\n            - output (:obj:`dict`)\n\n        Output example::\n\n            {\n                # (FloatTensor): [B, 3, max_h, max_w], RGB format\n                'image': ..,\n                # (list of FloatTensor): [B, 5], (resized_h, resize_w, scale_factor, origin_h, origin_w)\n                'image_info': ..,\n                # (list of FloatTensor): [B] [num_gts, 5] or None\n                'gt_bboxes': ..,\n                # (list of FloatTensor): [B] [num_igs, 4] or None\n                'ig_bboxes': ..,\n                #(list of FloatTensor): [B] [num_gts, k, 3] or None\n                'gt_keyps': ..,\n                #(list of list of list of ndarray): [B] [num_gts] [polygons] or None\n                'gt_masks': ..,\n                # (FloatTensor) [B, max_num_gts, num_grid_points(9), 3] or None\n                'gt_grids': ..,\n                # (FloatTensor) [B, 1, max_h, max_w], semantic mask\n                'gt_semantic_seg': ..,","limited":true,"property":false},"up/tasks/det/data/datasets/det_transforms.py::BatchPad.__call__":{"id":"up/tasks/det/data/datasets/det_transforms.py::BatchPad.__call__","name":"BatchPad.__call__","path":"up/tasks/det/data/datasets/det_transforms.py","line":423,"end":440,"meaning":"把图片补到同样大小并堆成 [B,C,H,W]；补齐值由配置决定。","kind":"mixed","hardware":"用输入的 new_full() 分配张量：输入在 CPU 就在 CPU，输入在 GPU 就在 GPU。","url":"https://github.com/ModelTC/United-Perception/blob/52aaeb9ed27a490820696d7754d19f98cd6ecd11/up/tasks/det/data/datasets/det_transforms.py#L423","code":"    def __call__(self, data):\n        \"\"\"\n        Args:\n            images: list of tensor\n        \"\"\"\n        images = data['image']\n        max_img_h = max([_.size(-2) for _ in images])\n        max_img_w = max([_.size(-1) for _ in images])\n        target_h = int(np.ceil(max_img_h / self.alignment) * self.alignment)\n        target_w = int(np.ceil(max_img_w / self.alignment) * self.alignment)\n        padded_images = []\n        for image in images:\n            assert image.dim() == 3\n            src_h, src_w = image.size()[-2:]\n            pad_size = (0, target_w - src_w, 0, target_h - src_h)\n            padded_images.append(F.pad(image, pad_size, 'constant', self.pad_value).data)\n        data['image'] = torch.stack(padded_images)\n        return data","limited":false,"property":false},"up/data/datasets/transforms.py::build_transformer":{"id":"up/data/datasets/transforms.py::build_transformer","name":"build_transformer","path":"up/data/datasets/transforms.py","line":226,"end":228,"meaning":"按 YAML 列出的顺序创建增强对象，并组成一个连续处理链。","kind":"cpu","hardware":"实际执行发生在 transformer(data) 时。","url":"https://github.com/ModelTC/United-Perception/blob/52aaeb9ed27a490820696d7754d19f98cd6ecd11/up/data/datasets/transforms.py#L226","code":"def build_transformer(cfgs):\n    transform_list = [AUGMENTATION_REGISTRY.build(cfg) for cfg in cfgs]\n    return Compose(transform_list)","limited":false,"property":false},"up/data/image_reader.py::ImageReader.read":{"id":"up/data/image_reader.py::ImageReader.read","name":"ImageReader.read","path":"up/data/image_reader.py","line":40,"end":41,"meaning":"把文件名交给具体读取器的 fs_read()。","kind":"cpu","hardware":"返回解码后的图片。","url":"https://github.com/ModelTC/United-Perception/blob/52aaeb9ed27a490820696d7754d19f98cd6ecd11/up/data/image_reader.py#L40","code":"    def read(self, filename):\n        return self.fs_read(filename)","limited":false,"property":false},"up/data/image_reader.py::ImageReader.__call__":{"id":"up/data/image_reader.py::ImageReader.__call__","name":"ImageReader.__call__","path":"up/data/image_reader.py","line":43,"end":49,"meaning":"先把图片目录和文件名拼起来，再调用 read()。","kind":"cpu","hardware":"Dataset 常用这个带目录处理的入口。","url":"https://github.com/ModelTC/United-Perception/blob/52aaeb9ed27a490820696d7754d19f98cd6ecd11/up/data/image_reader.py#L43","code":"    def __call__(self, filename, image_dir_idx=0):\n        if filename.startswith(\"//\"):\n            filename = filename[1:]\n        image_dir = get_cur_image_dir(self.image_dir, image_dir_idx)\n        filename = os.path.join(image_dir, filename)\n        img = self.read(filename)\n        return img","limited":false,"property":false},"up/data/image_reader.py::FileSystemCVReader.fs_read":{"id":"up/data/image_reader.py::FileSystemCVReader.fs_read","name":"FileSystemCVReader.fs_read","path":"up/data/image_reader.py","line":66,"end":89,"meaning":"使用 OpenCV 等读取图片，并按设置转换颜色或数据类型。","kind":"cpu","hardware":"文件读取和图片解码。","url":"https://github.com/ModelTC/United-Perception/blob/52aaeb9ed27a490820696d7754d19f98cd6ecd11/up/data/image_reader.py#L66","code":"    def fs_read(self, filename):\n        assert os.path.exists(filename), filename\n        if self.memcached:\n            import mc\n            self._init_memcached()\n            value = mc.pyvector()\n            assert len(filename) < 250, 'memcached rquires length of path < 250'\n            self.mclient.Get(filename, value)\n            value_buf = mc.ConvertBuffer(value)\n            img_array = np.frombuffer(value_buf, np.uint8)\n            if self.color_mode == 'GRAY':\n                img = cv2.imdecode(img_array, 0)\n            else:\n                img = cv2.imdecode(img_array, cv2.IMREAD_COLOR)\n        else:\n            if self.color_mode == 'GRAY':\n                img = cv2.imread(filename, 0)\n            else:\n                img = cv2.imread(filename, cv2.IMREAD_COLOR)\n        if self.color_mode == 'RGB':\n            img = cv2.cvtColor(img, self.cvt_color)\n        if self.to_float32:\n            img = img.astype(np.float32)\n        return img","limited":false,"property":false},"up/runner/base_runner.py::BaseRunner.build_model":{"id":"up/runner/base_runner.py::BaseRunner.build_model","name":"BaseRunner.build_model","path":"up/runner/base_runner.py","line":634,"end":645,"meaning":"创建 ModelHelper，把网络放到 CUDA；按配置调整 BN，旧 FP16 路线还会转 half。","kind":"transfer","hardware":"主要 GPU 边界是 self.model.cuda()。","url":"https://github.com/ModelTC/United-Perception/blob/52aaeb9ed27a490820696d7754d19f98cd6ecd11/up/runner/base_runner.py#L634","code":"    def build_model(self):\n        model_helper_type = self.config['runtime']['model_helper']['type']\n        model_helper_kwargs = self.config['runtime']['model_helper']['kwargs']\n        model_helper_ins = MODEL_HELPER_REGISTRY[model_helper_type]\n        self.model = model_helper_ins(self.config['net'], **model_helper_kwargs)\n        if self.device == 'cuda':\n            self.model = self.model.cuda()\n        if self.config['runtime']['special_bn_init']:\n            self.special_bn_init()\n        if self.fp16 and self.backend == 'linklink':\n            self.model = self.model.half()\n        logger.info(print_network(self.model))","limited":false,"property":false},"up/runner/base_runner.py::BaseRunner.special_bn_init":{"id":"up/runner/base_runner.py::BaseRunner.special_bn_init","name":"BaseRunner.special_bn_init","path":"up/runner/base_runner.py","line":628,"end":632,"meaning":"把 BN 的 eps 和 momentum 改成配置所要求的固定值。","kind":"cpu","hardware":"改变后续 BN 的计算设置，函数本身不跑 BN。","url":"https://github.com/ModelTC/United-Perception/blob/52aaeb9ed27a490820696d7754d19f98cd6ecd11/up/runner/base_runner.py#L628","code":"    def special_bn_init(self):\n        for m in self.model.modules():\n            if is_bn(m):\n                m.eps = 1e-3\n                m.momentum = 0.03","limited":false,"property":false},"up/models/model_helper.py::ModelHelper.__init__":{"id":"up/models/model_helper.py::ModelHelper.__init__","name":"ModelHelper.__init__","path":"up/models/model_helper.py","line":29,"end":69,"meaning":"遍历 net 清单，创建并登记每个子模块；可从上一模块取得输入通道数。","kind":"cpu","hardware":"大部分层先创建在 CPU，之后整体迁移。","url":"https://github.com/ModelTC/United-Perception/blob/52aaeb9ed27a490820696d7754d19f98cd6ecd11/up/models/model_helper.py#L29","code":"    def __init__(self, cfg):\n        super(ModelHelper, self).__init__()\n\n        if 'net' in cfg:\n            cfg = cfg['net']\n\n        functional_kwargs, cfg = self.split_cfg(cfg)\n\n        self.model_cfg = copy.deepcopy(cfg)\n        for cfg_subnet in cfg:\n            mname = cfg_subnet['name']\n            if 'multi_model' in cfg_subnet:\n                module = {}\n                for cfg_m in cfg_subnet['multi_model']:\n                    name = cfg_m['name']\n                    kwargs = cfg_m['kwargs']\n                    mtype = cfg_m['type']\n                    sub_module = self.build(mtype, kwargs)\n                    module.update({name: sub_module})\n            else:\n                kwargs = cfg_subnet['kwargs']\n                mtype = cfg_subnet['type']\n                if cfg_subnet.get('prev', None) is not None:\n                    if hasattr(self, cfg_subnet['prev']):\n                        prev_module = getattr(self, cfg_subnet['prev'])\n                        if hasattr(prev_module, \"get_outplanes\"):\n                            kwargs['inplanes'] = prev_module.get_outplanes()\n                module = self.build(mtype, kwargs)\n            if 'wrappers' in cfg_subnet:\n                for wrapper_cfg in cfg_subnet['wrappers']:\n                    wrapper_func = MODULE_WRAPPER_REGISTRY[wrapper_cfg['type']]\n                    wrapper_kwargs = wrapper_cfg.get('kwargs', {})","limited":true,"property":false},"up/models/model_helper.py::ModelHelper.split_cfg":{"id":"up/models/model_helper.py::ModelHelper.split_cfg","name":"ModelHelper.split_cfg","path":"up/models/model_helper.py","line":71,"end":79,"meaning":"把 type=self 的 ModelHelper 配置与真正的网络模块分开。","kind":"cpu","hardware":"返回“组装器自身参数”和“网络清单”。","url":"https://github.com/ModelTC/United-Perception/blob/52aaeb9ed27a490820696d7754d19f98cd6ecd11/up/models/model_helper.py#L71","code":"    def split_cfg(self, cfg_list):\n        functional_cfg = [cfg for cfg in cfg_list if cfg['type'] == 'self']\n        if len(functional_cfg) > 0:\n            assert len(functional_cfg) == 1\n            functional_kwargs = functional_cfg[0]['kwargs']\n        else:\n            functional_kwargs = {}\n        model_cfg = [cfg for cfg in cfg_list if cfg['type'] != 'self']\n        return functional_kwargs, model_cfg","limited":false,"property":false},"up/models/model_helper.py::ModelHelper.build":{"id":"up/models/model_helper.py::ModelHelper.build","name":"ModelHelper.build","path":"up/models/model_helper.py","line":87,"end":104,"meaning":"type 带完整模块路径时直接导入；否则从模型或处理模块注册表中查找并创建。","kind":"cpu","hardware":"返回一个子模块。","url":"https://github.com/ModelTC/United-Perception/blob/52aaeb9ed27a490820696d7754d19f98cd6ecd11/up/models/model_helper.py#L87","code":"    def build(self, mtype, kwargs):\n        # For traditional uses\n        if mtype.find('.') >= 0:\n            module_name, cls_name = mtype.rsplit('.', 1)\n            module = importlib.import_module(module_name)\n            cls = getattr(module, cls_name)\n            return cls(**kwargs)\n        else:  # For usage that models are registered by MODULE_ZOO_REGISTRY\n            cfg = {'type': mtype, 'kwargs': kwargs}\n            if env.is_master():\n                assert (mtype in MODULE_ZOO_REGISTRY or mtype in MODULE_PROCESS_REGISTRY), \\\n                    '{} is not supported, avaiables are:{} and {}'.format(mtype,\n                                                                          MODULE_ZOO_REGISTRY,\n                                                                          MODULE_PROCESS_REGISTRY)\n            if mtype in MODULE_ZOO_REGISTRY:\n                return MODULE_ZOO_REGISTRY.build(cfg)\n            else:\n                return MODULE_PROCESS_REGISTRY.build(cfg)","limited":false,"property":false},"up/models/model_helper.py::ModelHelper._init_functional":{"id":"up/models/model_helper.py::ModelHelper._init_functional","name":"ModelHelper._init_functional","path":"up/models/model_helper.py","line":81,"end":85,"meaning":"记住哪些参数需要冻结，再执行冻结。","kind":"cpu","hardware":"调用 freeze_parameters()。","url":"https://github.com/ModelTC/United-Perception/blob/52aaeb9ed27a490820696d7754d19f98cd6ecd11/up/models/model_helper.py#L81","code":"    def _init_functional(self, freeze_patterns=[]):\n        \"\"\"\n        \"\"\"\n        self.freeze_patterns = freeze_patterns\n        self.freeze_parameters()","limited":false,"property":false},"up/models/model_helper.py::ModelHelper.freeze_parameters":{"id":"up/models/model_helper.py::ModelHelper.freeze_parameters","name":"ModelHelper.freeze_parameters","path":"up/models/model_helper.py","line":227,"end":230,"meaning":"将命中冻结规则的参数设为不需要梯度。","kind":"cpu","hardware":"修改 requires_grad，不是 GPU 计算。","url":"https://github.com/ModelTC/United-Perception/blob/52aaeb9ed27a490820696d7754d19f98cd6ecd11/up/models/model_helper.py#L227","code":"    def freeze_parameters(self):\n        for name, p in self.named_parameters():\n            if patterns_match(self.freeze_patterns, name):\n                p.requires_grad = False","limited":false,"property":false},"up/models/model_helper.py::ModelHelper.cuda":{"id":"up/models/model_helper.py::ModelHelper.cuda","name":"ModelHelper.cuda","path":"up/models/model_helper.py","line":118,"end":120,"meaning":"调用 PyTorch 把整个模型搬到 CUDA，同时更新 UP 自己记录的设备字段。","kind":"transfer","hardware":"super().cuda()，包含参数和 buffer 迁移。","url":"https://github.com/ModelTC/United-Perception/blob/52aaeb9ed27a490820696d7754d19f98cd6ecd11/up/models/model_helper.py#L118","code":"    def cuda(self):\n        self.device = torch.device('cuda')\n        return super(ModelHelper, self).cuda()","limited":false,"property":false},"up/models/model_helper.py::ModelHelper.train":{"id":"up/models/model_helper.py::ModelHelper.train","name":"ModelHelper.train","path":"up/models/model_helper.py","line":232,"end":245,"meaning":"切换训练/评估模式，并让指定冻结模块继续保持 eval。","kind":"cpu","hardware":"影响 BN、Dropout 等后续行为；不负责搬设备。","url":"https://github.com/ModelTC/United-Perception/blob/52aaeb9ed27a490820696d7754d19f98cd6ecd11/up/models/model_helper.py#L232","code":"    def train(self, mode=True):\n        self.training = mode\n        if len(self.freeze_patterns) == 0:\n            for submodule in self.children():\n                submodule.train(mode)\n            return self\n        for name, m in self.named_modules():\n            if name == \"\":  # self\n                continue\n            if patterns_match(self.freeze_patterns, name):\n                m.eval()\n            else:\n                m.train(mode)\n        return self","limited":false,"property":false},"up/utils/model/normalize.py::build_norm_layer":{"id":"up/utils/model/normalize.py::build_norm_layer","name":"build_norm_layer","path":"up/utils/model/normalize.py","line":68,"end":102,"meaning":"把 solo_bn、pt_sync_bn、ln 等配置变成具体归一化层。","kind":"cpu","hardware":"BN/SyncBN 的实际 GPU 计算在层的 forward 中。","url":"https://github.com/ModelTC/United-Perception/blob/52aaeb9ed27a490820696d7754d19f98cd6ecd11/up/utils/model/normalize.py#L68","code":"def build_norm_layer(num_features, cfg, postfix='', layer_instance=True):\n    assert isinstance(cfg, dict) and 'type' in cfg\n    cfg = cfg.copy()\n    layer_type = cfg.pop('type')\n    kwargs = cfg.get('kwargs', {})\n\n    if layer_type not in _norm_cfg:\n        raise KeyError('Unrecognized norm type {}'.format(layer_type))\n    else:\n        if 'task_sync_bn' in layer_type:\n            if DIST_BACKEND.backend == 'linklink':\n                layer_type = 'task_sync_bn'\n            elif DIST_BACKEND.backend == 'dist':\n                layer_type = 'torch_task_sync_bn'\n            else:\n                raise NotImplementedError\n        elif 'sync_bn' in layer_type:\n            if DIST_BACKEND.backend == 'dist':\n                layer_type = 'pt_sync_bn'\n            elif DIST_BACKEND.backend == 'linklink':\n                layer_type = 'link_sync_bn'\n            else:\n                raise NotImplementedError\n        abbr, norm_layer = _norm_cfg[layer_type]\n        if norm_layer is None:\n            raise NotImplementedError\n\n    assert isinstance(postfix, (int, str))\n    name = abbr + str(postfix)\n\n    if not layer_instance:\n        return norm_layer","limited":true,"property":false},"up/utils/model/normalize.py::build_conv_norm":{"id":"up/utils/model/normalize.py::build_conv_norm","name":"build_conv_norm","path":"up/utils/model/normalize.py","line":105,"end":135,"meaning":"按参数拼出卷积、归一化和可选激活层。","kind":"cpu","hardware":"构造 nn.Conv2d 等模块；输入数据时才计算。","url":"https://github.com/ModelTC/United-Perception/blob/52aaeb9ed27a490820696d7754d19f98cd6ecd11/up/utils/model/normalize.py#L105","code":"def build_conv_norm(in_channels,\n                    out_channels,\n                    kernel_size,\n                    stride=1,\n                    padding=0,\n                    dilation=1,\n                    groups=1,\n                    normalize=None,\n                    activation=False,\n                    relu_first=False):\n\n    conv = nn.Conv2d(\n        in_channels, out_channel
