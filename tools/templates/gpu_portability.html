<style>
:root{--bg:#f6f8fb;--panel:white;--text:#202d3d;--muted:#57677b;--line:#dce4ee;--blue:#205fbc;--soft:#eaf2ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.7 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}a{color:var(--blue);text-decoration:none}a:hover{text-decoration:underline}button,input,select{font:inherit;color:inherit}button,select,summary{cursor:pointer}:focus-visible{outline:3px solid var(--blue);outline-offset:3px}header{padding:16px 5vw;background:var(--panel);border-bottom:1px solid var(--line);display:flex;gap:22px;align-items:center;flex-wrap:wrap}header strong{font-size:21px}header a{font-size:13px}nav{position:sticky;top:0;z-index:5;background:var(--panel);border-bottom:1px solid var(--line);display:flex;gap:6px;padding:9px 5vw;overflow:auto}nav button{border:0;background:transparent;padding:8px 14px;border-radius:6px;white-space:nowrap}nav button[aria-selected=true]{background:var(--soft);color:var(--blue);font-weight:650}main{max-width:1250px;margin:auto;padding:32px 26px 70px}h1{font-size:32px;line-height:1.4;margin:5px 0 15px}h2{font-size:23px;margin-top:30px}.intro{font-size:17px;color:var(--muted);max-width:900px}.kicker{font-size:12px;color:var(--blue);font-weight:700;letter-spacing:1px}.note{border-left:3px solid var(--blue);background:var(--soft);padding:13px 17px;border-radius:0 7px 7px 0}.muted,small{color:var(--muted)}code{font:13px/1.6 Consolas,monospace;overflow-wrap:anywhere}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:var(--bg);border:1px solid var(--line);padding:16px;border-radius:8px;font-size:13px;max-width:100%}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px;margin:22px 0}.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:19px}.card strong{font-size:18px}.card p{margin-bottom:0}.flow{border:1px solid var(--line);border-radius:12px;padding:22px;background:var(--panel);text-align:center}.flow .node{padding:15px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}.flow .node b{display:block}.flow .fork{display:grid;grid-template-columns:1fr 1fr;gap:18px}.flow .arrow{color:var(--blue);padding:6px;font-size:22px}.filters{display:flex;flex-wrap:wrap;gap:12px;align-items:end;background:var(--panel);border:1px solid var(--line);padding:15px;border-radius:9px;margin:20px 0}.filters label{font-size:12px;display:flex;flex-direction:column;gap:5px}.filters input,.filters select{background:var(--panel);border:1px solid var(--line);padding:8px 10px;border-radius:5px;max-width:100%;min-width:0}.filters .searchbox{flex:1;min-width:190px}.btn{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:8px 12px;color:var(--blue)}.table-wrap{max-width:100%;overflow:auto;border:1px solid var(--line);border-radius:9px;background:var(--panel)}table{border-collapse:collapse;width:100%;font-size:13px}th,td{text-align:left;padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:top}th{background:var(--bg)}td code{font-size:12px}tbody tr:last-child td{border-bottom:0}.tag{display:inline-block;border-radius:4px;padding:2px 6px;font-size:12px;margin:2px;background:var(--soft);color:var(--blue)}.reuse{color:#21704e;background:#e9f6ef}.adapt{color:#935512;background:#fff3e5}.implement{color:#b83e42;background:#fff0f0}.out_of_slim,.excluded{color:var(--muted);background:var(--bg)}details{border:1px solid var(--line);background:var(--panel);border-radius:8px;margin:12px 0;padding:13px 16px;overflow-wrap:anywhere}summary{font-weight:650}.source{font-size:12px;margin:5px 0;overflow-wrap:anywhere}.pagination{display:flex;align-items:center;gap:15px;margin:20px 0}.pagination button{border:1px solid var(--line);background:var(--panel);padding:7px 14px;border-radius:5px}.pagination button:disabled{opacity:.4;cursor:default}li{margin:9px 0}footer{margin-top:35px;border-top:1px solid var(--line);padding-top:18px;color:var(--muted);font-size:12px}#results{min-height:100px}@media(max-width:700px){header{padding:15px 19px;gap:13px}main{padding:24px 17px 55px}h1{font-size:26px}.cards,.flow .fork{grid-template-columns:1fr}.flow{padding:14px}nav{padding:8px 12px}.filters>*{flex:1;min-width:0}.filters .searchbox{min-width:180px}.filters select{width:100%}th,td{padding:10px}.table-wrap table{min-width:580px}pre{font-size:12px}}@media(prefers-color-scheme:dark){:root{--bg:#141c28;--panel:#1c2838;--text:#e2e9f3;--muted:#b0bfd1;--line:#35485f;--blue:#93bdff;--soft:#263c5d}.reuse{color:#a0daba;background:#213c32}.adapt{color:#ffd29d;background:#493a2c}.implement{color:#ffb9bb;background:#452d37}}

<body>
<header><strong>UP / GPU 厂商接入</strong><a href="UP_TRAIN_INFERENCE.html">← 原版训练与推理导读</a><a href="VENDOR_HANDOFF.md">负责人交付说明</a><a href="https://www.notion.so/40da6486ce2d81328ea3ee0ebee46fe8" target="_blank" rel="noopener">工作进度 ↗</a></header>
<nav role="tablist" aria-label="核查内容"><button data-tab="overview" role="tab">先看结论</button><button data-tab="functions" role="tab">逐函数核查</button><button data-tab="native" role="tab">专用操作</button><button data-tab="libraries" role="tab">cuDNN 与替代库</button><button data-tab="handoff" role="tab">分工与实现</button><button data-tab="config" role="tab">配置与使用</button></nav>
<main id="main"></main><noscript>此清单需要启用 JavaScript；交付包另附逐项 CSV。</noscript>
<script id="audit-data" type="application/json">__AUDIT_DATA__</script>
<script>
'use strict';
const D=JSON.parse(document.getElementById('audit-data').textContent),main=document.getElementById('main');
const vendors={metax:'沐曦 C500',cambricon:'寒武纪 MLU590',ascend:'昇腾 910B'},versions={original:'原版 UP',slim:'瘦身 UP',multivendor:'现有多厂商版'},actions={reuse:'复用厂商 Torch',adapt:'修改/核实接入',implement:'专用实现/绑定',cpu_only:'CPU 计算，GPU 任务排除',out_of_slim:'瘦身已移除',excluded:'本轮不接入'};
const E=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const families=Object.fromEntries(D.families.map(f=>[f.id,f]));
for(const f of D.functions)for(const sites of Object.values(f.sites))for(const row of sites)row.path=f.path;
let active='overview',vendor='metax',version='slim',action='all',query='',page=0;
function tag(key,text){return `<span class="tag ${key}">${E(text||actions[key])}</span>`;}
function assignmentTable(){return `<h2>交给每位负责人的工作量</h2><p>按 40 类核查工作项统计，不是 GPU 内核数量。原生扩展中未被当前模型使用的部分，按条目注明的范围接入。</p><div class="table-wrap"><table><thead><tr><th>厂商</th><th>复用 Torch/兼容服务</th><th>修改或核实接入</th><th>专用 GPU 实现/绑定</th></tr></thead><tbody>${Object.keys(vendors).map(v=>`<tr><td>${vendors[v]}</td><td>${D.assignment_counts[v].reuse||0}</td><td>${D.assignment_counts[v].adapt||0}</td><td>${D.assignment_counts[v].implement||0}</td></tr>`).join('')}</tbody></table></div><p class="muted">另有稀疏/Numba 2 类随任务移除，历史 linklink 1 类不接入，Softer NMS 1 项是 CPU 扩展加载问题。详细签名与调用位置在下面两个清单页。</p>`;}
function refs(ids){return ids.map(id=>`<a href="${E(D.sources[id].url)}" target="_blank" rel="noopener">${E(D.sources[id].title)} ↗</a>`).join(' · ');}
function foot(){return `<footer>核查日期 ${D.generated} · 原版 ${D.revisions.original.slice(0,8)} / 瘦身 ${D.revisions.slim.slice(0,8)} / 多厂商 ${D.revisions.multivendor.slice(0,8)}。本轮完成源码、config 与软件检查；新增真机验收由对应负责人执行。候选调用数包含需运行时确认设备的 Tensor 方法，示例、数据和评估路线已单列。</footer>`;}
function overview(){const s=D.summary;main.innerHTML=`<div class="kicker">设计 → 核查 → 分工</div><h1>不是每个函数都重写。先分三类。</h1><p class="intro">标准计算用厂商 PyTorch；设备服务改入口；依赖 CUDA 的专用操作按原契约移植。模型算法和配方保留。</p><div class="cards"><section class="card"><strong>① 复用原算法</strong><p>卷积、Linear、Attention 组合、激活、损失、autograd。由 Tensor 的设备派发到厂商后端。</p></section><section class="card"><strong>② 集中改运行时</strong><p>设备、显存、同步、RNG、AMP、通信和计算库策略，集中在 RuntimeBackend。</p></section><section class="card"><strong>③ 移植专用操作</strong><p>16 项 GPU 原生操作分别列出。先查厂商库，有相同契约就绑定，没有才写内核。</p></section></div><div class="flow"><div class="node"><b>UP 模型、训练 / 训练内 eval / 独立推理</b>算法、参数、配置和返回结构保持原约定</div><div class="arrow">↓</div><div class="fork"><div class="node"><b>RuntimeBackend</b>设备 · 显存 · RNG · AMP<br>通信 · DNN 策略</div><div class="node"><b>计算入口</b>标准 Torch 直接调用<br>专用操作：完整前向 + 所需反向 + 状态</div></div><div class="arrow">↓</div><div class="node"><b>C500 / MLU590 / 910B 的 Torch、计算库、SDK 内核</b>config 选厂商；环境在启动前安装好</div></div><h2>核查范围</h2><p class="muted">逐文件扫描 up/**/*.py 和 setup.py；原生内核按完整操作交接。</p><div class="table-wrap"><table><thead><tr><th>源码基线</th><th>Python 文件</th><th>候选函数</th><th>候选调用位置</th></tr></thead><tbody>${Object.keys(versions).map(v=>`<tr><td>${versions[v]} · <code>${D.revisions[v].slice(0,8)}</code></td><td>${s[v].python_files}</td><td>${s[v].functions}</td><td>${s[v].call_sites}</td></tr>`).join('')}</tbody></table></div><p class="note">这些数是静态源码索引，不是 GPU 内核数量或通过数。逐函数页可看具体调用与源码；Tensor 接收者是否在 GPU 上、配置是否触发该分支，列为待验证。</p><h2>需要核对与接入的任务</h2><p><b>8 类运行时/集成服务</b>：设备、显存、RNG、DNN、AMP、通信、导出、构建；另核 <b>TorchVision NMS 路线</b>。<b>16 项 GPU 原生操作</b>中，2 项已有部分共享路线，14 项未接入非 NVIDIA 原生入口。点云包装保留，未被瘦身模型直接引用的部分按需接入。</p><p>原版稀疏、量化、剪枝和 Numba CUDA 评估路线另列。量化/剪枝 Runner 已移除，仍有少量可选冻结 BN 引用。Softer NMS 原本在 CPU 计算，只需解耦扩展加载，不列为 GPU 内核任务。历史 spring/linklink 不列入本轮接入。</p><p class="note">三份基线的 <b>${s.original.native_files} 个 C++/CUDA 文件${D.native_sources_identical?'内容相同':'存在差异，见校验清单'}</b>；NVIDIA 加速源码保留。标准 Torch API 的“可复用”是实现路径判断，目标版本的前向、反向和状态仍要实测。</p>${assignmentTable()}${foot()}`;}
function filters(){return `<div class="filters"><label>厂商<select id="vendor">${Object.entries(vendors).map(([v,n])=>`<option value="${v}" ${vendor===v?'selected':''}>${n}</option>`).join('')}</select></label><label>源码<select id="version">${Object.entries(versions).map(([v,n])=>`<option value="${v}" ${version===v?'selected':''}>${n}</option>`).join('')}</select></label><label>处理方式<select id="action"><option value="all">全部</option>${Object.entries(actions).map(([v,n])=>`<option value="${v}" ${action===v?'selected':''}>${n}</option>`).join('')}</select></label><label class="searchbox">查函数、操作、文件<input id="query" type="search" value="${E(query)}" placeholder="例如 conv、RoIAlign、matcher"></label><button class="btn" id="download">下载筛选清单 CSV</button></div>`;}
function functionActions(f){if(['softer_nms','points_in_boxes_cpu','boxes_bev_iou_cpu'].includes(f.function))return ['cpu_only'];if(version==='original'&&!f.presence.slim&&!f.presence.multivendor)return ['out_of_slim'];return [...new Set(f.categories.map(c=>families[c]?.vendors[vendor].action).filter(Boolean))];}
function matches(f){const a=active==='native'?[f.vendors[vendor].action]:functionActions(f);return(action==='all'||a.includes(action))&&(!query||JSON.stringify(f).toLowerCase().includes(query.toLowerCase()))&&(active==='native'||f.sites[version].length>0);}
function rows(){return(active==='native'?D.families.filter(f=>f.kind==='native'):D.functions).filter(matches);}
function link(r,v){return `<a href="https://github.com/${v==='original'?'ModelTC':'jingfengou'}/United-Perception/blob/${D.revisions[v]}/${E(r.path)}#L${r.line}" target="_blank" rel="noopener">${E(r.path)}:${r.line} ↗</a>`;}
const scopes={model_or_runtime:'模型/运行时；需确认输入设备',demo_or_test:'示例/测试',data_or_evaluator_check_device:'数据/评估路线；需确认设备',optional_extension_or_build:'可选扩展/构建'};
function fnCard(f){const sites=f.sites[version]||[],cats=f.categories.map(c=>families[c]).filter(Boolean);return `<details data-entry="${E(f.id)}"><summary><code>${E(f.function)}</code> ${functionActions(f).map(a=>tag(a)).join('')}<div class="source">${E(f.path)} · ${sites.length} 处候选调用 · ${f.presence.slim?'瘦身保留':'瘦身无此函数'}${!f.presence.slim&&f.presence.multivendor?'；多厂商版新增':''}</div></summary><p><b>调用了什么：</b><code>${[...new Set(sites.map(r=>r.api))].map(E).join(' · ')}</code></p>${cats.map(c=>`<p><b>${E(c.title)}：</b>${E(c.contract)}<br>${tag(c.vendors[vendor].action,c.vendors[vendor].text)} ${E(c.vendors[vendor].pending)}</p>`).join('')}<p class="note">${version==='original'&&!f.presence.slim?'瘦身基线中没有这段函数；先确认是否恢复对应任务。':'本轮为源码核查，目标卡前向/反向/状态列为待验证。'}</p><div class="table-wrap"><table><thead><tr><th>源码位置</th><th>调用/属性</th><th>范围</th></tr></thead><tbody>${sites.map(r=>`<tr><td>${link(r,version)}</td><td><code>${E(r.api)}</code></td><td>${E(scopes[r.scope])}</td></tr>`).join('')}</tbody></table></div><p class="source">依据：${refs([...new Set(cats.flatMap(c=>c.evidence))])}</p></details>`;}
function nativeCard(f){const d=f.vendors[vendor],s=f.signatures[version]||[];return `<details data-native="${f.id}"><summary>${E(f.title)} ${tag(d.action,d.text)}<div class="source"><code>${E(f.path)}</code> · ${E(f.scope)}</div></summary><p><b>实现契约：</b>${E(f.contract)}</p><p><b>待验证：</b>${E(d.pending)}</p><pre>${s.map(x=>E(x.signature)).join('\n')}</pre><p>${s.map(x=>link(x,version)).join('<br>')}</p><p class="note">包括包装中的分配、保存状态和所需反向；仅换扩展库名字不够。${E(f.hardware)}</p><p class="source">依据：${refs(f.evidence)}</p></details>`;}
function results(){const all=rows();document.getElementById('results').innerHTML=`<p class="muted" id="result-count">${all.length} 项 · ${vendors[vendor]} · ${versions[version]}</p>${all.slice(page*30,(page+1)*30).map(active==='native'?nativeCard:fnCard).join('')}<div class="pagination"><button data-page="-1" ${page===0?'disabled':''}>上一页</button><span>${page+1} / ${Math.max(1,Math.ceil(all.length/30))}</span><button data-page="1" ${(page+1)*30>=all.length?'disabled':''}>下一页</button></div>`;}
function audit(native){main.innerHTML=`<div class="kicker">${native?'专用操作交付契约':'原版 / 瘦身 / 现有多厂商版'}</div><h1>${native?'把完整操作交给负责人。':'找到函数，再决定怎么接。'}</h1><p class="intro">${native?'16 项分别列出原签名、设备/布局/状态和所需反向。没有梯度契约的操作不加梯度。':'展开一行看调用和源码。复用指保留算法、由厂商 Torch 执行；目标版本的 dtype、形状和梯度按条目验收。'}</p>${filters()}<div id="results"></div>${foot()}`;results();}
function libraries(){main.innerHTML=`<div class="kicker">计算库与控制项</div><h1>别家的卡不直接用 NVIDIA cuDNN。</h1><p class="intro">上层仍可调用 nn.Conv2d；Tensor 的设备后端选择实际计算库或内核。作用相近，不等于每个控制项都相同。</p><div class="table-wrap"><table><thead><tr><th>平台</th><th>Torch / 设备</th><th>计算库 / 通信</th><th>接入处理</th></tr></thead><tbody><tr><td>NVIDIA</td><td>NVIDIA Torch / cuda</td><td>cuDNN、cuBLAS 等 / NCCL</td><td>保留原加速扩展；configure_dnn 管理 cuDNN 控制项。</td></tr><tr><td>沐曦 C500</td><td>MACA 厂商 Torch / cuda 兼容 API</td><td>mcDNN、mcBLAS 等 / mcCL 的 NCCL 兼容 API</td><td>核实际加载库、AMP 和控制项；不加载 NVIDIA UP _C。</td></tr><tr><td>寒武纪 MLU590</td><td>匹配 Torch + torch_mlu / mlu</td><td>CNNL、CNRT、厂商内核 / CNCL</td><td>公开历史 CNNL 中 enabled、benchmark、deterministic 不提供对应功能；TF32 有专门接口。目标版本另核。</td></tr><tr><td>昇腾 910B</td><td>匹配 Torch + torch_npu / npu</td><td>CANN 算子库、ACLNN 等 / HCCL</td><td>CANN 是整套计算栈；不能把 cuDNN 开关直接套上去。</td></tr></tbody></table></div><h2>这些控制项分别是什么</h2><p><code>enabled</code> 控制是否使用相应库，<code>benchmark</code> 涉及算法选择，<code>deterministic</code> 涉及部分操作的确定性算法，<code>allow_tf32</code> 涉及计算精度策略。它们不是全部运算通用的总开关。</p><p class="note">目前 MLU/NPU 默认使用厂商原生设置；显式请求未接入的 runtime.dnn 控制项会报错。负责人只接真实有效的控制项，不做空设置。</p><h2>核查依据</h2><ul>${['cudnn','metax','macalib','mlu','cnnl','npu','cann'].map(k=>`<li>${refs([k])}</li>`).join('')}</ul><p class="muted">公开 MetaX 2.4、Cambricon r1.22_pt2.1.0 用于确认架构和公开接口，不当作目标机器的安装版本。负责人补版本表、加载库路径和实测结果。</p>${foot()}`;}
function handoff(){main.innerHTML=`<div class="kicker">按能力分工，不复制模型</div><h1>一个运行时类，加独立的专用操作。</h1><p class="intro">集中设备服务，避免一个包含所有数学和内核的大类。具体签名在“专用操作”页，完整交付说明见 Markdown。</p><div class="flow"><div class="node"><b>setup_runtime(config) → RuntimeBackend</b>厂商 · 设备 · 插件 · 通信后端</div><div class="arrow">↓</div><div class="fork"><div class="node"><b>设备负责人</b>device / AMP / memory_available<br>RNG / 同步 / DNN 策略 / 通信</div><div class="node"><b>操作负责人</b>按类别提供厂商实现<br>前向 / 所需反向 / 状态 / 导出</div></div></div><h2>设备负责人核这张清单</h2><pre>is_available / device_count / current_device / set_device\nget_device_properties.total_memory / memory_allocated\nmax_memory_allocated / reset_peak_memory_stats / empty_cache\nsynchronize / manual_seed / get_rng_state / set_rng_state\namp.autocast / amp.GradScaler\ndevice / dist_backend / memory_available / configure_dnn</pre><p>RuntimeBackend.module 指向 torch.cuda / torch.mlu / torch.npu；名字与语义兼容就复用，有差别时在平台类统一转换。设备 RNG 在各自平台保存恢复，不跨厂商互抄字节。</p><h2>操作负责人按这个顺序做</h2><ol><li>选厂商，找到任务、原签名和源码；先核 SDK 是否已有相同契约。</li><li>实现完整操作：设备分配、前向、所需反向、保存状态。NMS 不伪造梯度。</li><li>接到 up/extensions/python/ 的原包装入口；非 NVIDIA 分支选择完整厂商实现，保留原 .apply() 和 symbolic()。</li><li>固定输入、权重、上游梯度，核前后向、dtype、布局、空输入和状态。维持 rtol=1e-4、atol=1e-5；索引精确比较，原生波动另记。</li><li>再测训练、训练内 eval、恢复、独立推理及双卡通信/SyncBN。</li></ol><p class="note">不用重写 ReLU 等已适配 Torch 操作。负责人交付目标环境、测试结果与例外清单；真正不兼容的操作才补实现。</p><h2>修改位置</h2><pre>up/runtime/backend.py       config、设备服务、DNN 策略\nup/platform/ops.py          已有 Torch IoU/IoF、NMS、Sigmoid Focal\nup/extensions/python/      原生操作 Python / autograd 包装\nup/extensions/csrc/        保留的 NVIDIA C++/CUDA\nsetup.py                   UP_BUILD_PLATFORM 选择构建\nup/utils/env/              绑卡、通信、数据迁移、RNG\nup/runner/base_runner.py   训练和训练内 eval\nup/apis/inference.py       独立推理\ntests/                     config 与审计工具软件检查</pre><p><a href="VENDOR_HANDOFF.md">打开负责人交付说明 →</a></p>${foot()}`;}
function config(){main.innerHTML=`<div class="kicker">启动前装环境，启动时选平台</div><h1>用 config 选择厂商。</h1><p class="intro">训练、训练内 eval 和独立推理读取同一个 runtime.platform。</p><pre>${E(D.examples.yaml)}</pre><p>runtime.device 可省略，保留时分别使用 cuda / mlu / npu；必须与所选平台一致。--backend dist 仍表示 PyTorch 执行路径，不是厂商名称。</p><h2>安装</h2><pre>${E(D.examples.install)}</pre><h2>训练、验证、推理</h2><pre>${E(D.examples.commands)}</pre><p>替换自己的数据、权重与输出路径。将 metax_cuda 换成另外三种平台值即可；config 选择当前环境，不自动安装或切换 Torch wheel。</p><h2>这轮落实了什么</h2><ul><li>校验厂商名、设备类型、可见卡编号；插件缺失时指出需要哪个包。</li><li>Runner 与独立推理通过运行时管理 DNN 策略，默认保留原设置。</li><li>OTA 的显存查询、禁用 AMP 上下文、缓存清理和数据搬回入口使用所选设备。已有 CPU OOM 路线保留，其他错误直接报出。</li><li>原模型数学、权重键和 C++/CUDA 文件未改。</li></ul><p class="note">本轮 ${D.software_tests} 项软件测试通过。GPU 前后向、通信和控制项效果由对应负责人按清单补真机验收。</p>${foot()}`;}
function show(tab){active=tab;page=0;document.querySelectorAll('[data-tab]').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.tab===tab)));if(tab==='overview')overview();else if(tab==='functions'||tab==='native')audit(tab==='native');else if(tab==='libraries')libraries();else if(tab==='handoff')handoff();else config();location.hash=tab;}
document.addEventListener('click',e=>{const b=e.target.closest('[data-tab],[data-page],#download');if(!b)return;if(b.dataset.tab){show(b.dataset.tab);scrollTo(0,0);}else if(b.dataset.page){page+=Number(b.dataset.page);results();document.getElementById('results').scrollIntoView();}else download();});
document.addEventListener('change',e=>{if(e.target.id==='vendor')vendor=e.target.value;else if(e.target.id==='version')version=e.target.value;else if(e.target.id==='action')action=e.target.value;else return;page=0;results();});
document.addEventListener('input',e=>{if(e.target.id==='query'){query=e.target.value;page=0;results();}});
function download(){const q=x=>'"'+String(x??'').replaceAll('"','""')+'"',data=[['厂商','基线','函数或操作','文件','处理方式','契约']];for(const f of rows())data.push([vendors[vendor],versions[version],f.function||f.title,f.path,(active==='native'?[f.vendors[vendor].action]:functionActions(f)).map(a=>actions[a]).join(' / '),f.contract||f.categories.map(c=>families[c]?.contract||'').join(' / ')]);const blob=new Blob(['\ufeff'+data.map(r=>r.map(q).join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`UP-${vendor}-${active}.csv`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);}
const tabs=['overview','functions','native','libraries','handoff','config'];show(tabs.includes(location.hash.slice(1))?location.hash.slice(1):'overview');window.addEventListener('hashchange',()=>{const t=location.hash.slice(1);if(t!==active&&tabs.includes(t))show(t);});
</script>
</body></html>
